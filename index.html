      const m = PRIVS[p.kind], left = m.max ? `残り${m.max - (p.uses || 0)}回` : m.span;
      h += `<div class="privcard" style="--c:${pcolor(p.player_id)}"><span class="pk">${KANJI[p.kind]}</span><div class="pb"><small>${d}日目</small><b>${esc(pname(p.player_id))}：${m.name}</b><span>${m.desc}</span><em>${left}${p.kind === 3 && (p.uses_detail || []).length ? `（使用済み：${p.uses_detail.join("・")}）` : ""}</em>
        <div class="pa">${p.kind === 2 && (p.uses || 0) < 1 ? `<button class="mini" data-steal="1">強奪を実行</button>` : ""}<button class="mini" data-privdel="${p.id}">取り消す</button></div></div></div>`;
    } else h += `<button class="privcard empty-p" data-privday="${d}"><span class="pk">？</span><div class="pb"><small>${d}日目</small><b>${d === day ? "今日の特権を宣言する" : "宣言する"}</b><span>${d === 1 ? "1日目は前回優勝者" : "朝一の宣言時点で1位の人"}が獲得</span></div></button>`;
  }

  const rk = setting(`roulette:${t.id}:${rouletteDay}`);
  const granted = db.tickets.filter(x => x.trip_id === t.id && (x.source || "").startsWith(`ルーレット：${rouletteDay}日目`));
  h += `<div class="h2">super免除券ルーレット<small>第十四条・1日1枚以上</small></div><div class="card">
    <div class="filter" style="margin:0 0 10px;padding:0">${Array.from({length: t.days}, (_, i) => `<button data-rday="${i+1}" aria-pressed="${rouletteDay === i+1}">${i+1}日目</button>`).join("")}</div>`;
  if (rk){
    const holder = rankHolder(t, rk);
    h += `<div class="rres"><span class="num">${rk}</span><div>位が獲得<small>旅費・宿泊費のじゃんけん前の時点でこの順位の人に配ります</small></div></div>
      <p class="note">今の${rk}位：<b style="color:var(--ink)">${holder ? esc(pname(holder)) : "該当なし"}</b>${granted.length ? `／この日の付与済み：${granted.map(x => esc(pname(x.player_id))).join("、")}` : ""}</p>
      <div class="btns"><button class="btn ghost" data-act="roulette">回し直す</button><button class="btn" data-act="grantRoulette" ${holder ? "" : "disabled"}>${holder ? esc(pname(holder)) : ""}に付与</button></div>`;
  } else h += `<p class="note">各日の一番最初に回して、super免除券を獲得する順位を決めます。</p><div class="btns"><button class="btn" data-act="roulette">${rouletteDay}日目のルーレットを回す</button></div>`;
  h += `</div>`;

  const res = prizeResults(t);
  h += `<div class="h2 red">ピタリ賞・ニアピン賞<small>第十七条</small></div><div class="card">
    <label class="f"><span>旅費総額（前回4位の予約者が提示）</span><div style="display:flex;gap:8px"><input id="ttotal" type="number" inputmode="numeric" value="${t.travel_total ?? ""}" placeholder="0"><button class="mini" data-act="saveTravel">保存</button></div></label>
    <p class="note">旅費総額の提示後に、全員が「自分の最終支払額」を予想します。判定は100円単位（100円未満は切り捨て）。ピタリ賞（一致）は全額、ニアピン賞（ピタリ±1,000円以内）は半額が免除され、残りのメンバーで均等に負担します。順位は変わりません。</p>
    ${res.map(r => `<div class="predrow"><span class="dot" style="background:${pcolor(r.id)}"></span><b>${esc(pname(r.id))}</b><input type="number" inputmode="numeric" data-pred="${r.id}" value="${r.pred ?? ""}" placeholder="予想額"><span class="pr">${r.pred == null ? "" : `<small>今の差 ${signed(r.paid - r.pred)}</small>${r.prize ? `<span class="tic ${r.prize === "ピタリ賞" ? "s" : "n"}">${r.prize}</span>` : ""}`}</span></div>`).join("")}
  </div>`;

  h += `<div class="h2 aqua">精算<small>立替え・賞の免除を反映</small></div><div class="card"><p class="note" style="margin-top:0">誰が誰にいくら払えばよいかを計算します。立替えた人は、支払い一覧の各支払いで設定できます。</p><div class="btns" style="margin-top:6px"><button class="btn" data-act="settle">精算を見る</button></div></div>`;
  return h;
}

/* ---------- 特権 ---------- */
function privCandidate(t, day){
  if (day === 1){ const pv = prevTrip(t); return pv ? tripWinner(pv) : null; }
  return tripWinner(t); // 2日目以降は、宣言する時点（朝一）の1位
}
function openPrivDeclare(t, day){
  if (!t) return;
  day = day || 1;
  if (tripPrivs(t).some(p => p.day === day)){ toast(`${day}日目の特権は宣言済みです`); return; }
  const usedKinds = tripPrivs(t).map(p => p.kind);
  const cand = privCandidate(t, day);
  let kind = null;
  const s = openSheet(`${day}日目の特権`, `<p class="note">${day === 1 ? "1日目は前回優勝者" : "宣言する時点（朝一）で1位の人"}が、1つ選んで宣言します。${cand ? `候補：<b style="color:var(--ink)">${esc(pname(cand))}</b>` : ""}</p>
    <div class="f"><span>獲得した人</span>${chipPlayers(activeMembers(t), cand ? [cand] : [])}</div>
    <div class="f"><span>特権</span><div class="privpick">${[1,2,3,4,5].map(k => `<button type="button" data-pk="${k}" ${usedKinds.includes(k) ? "disabled" : ""} aria-pressed="false"><span class="pk">${KANJI[k]}</span><span><b>${PRIVS[k].name}${usedKinds.includes(k) ? "（獲得済み）" : ""}</b><small>${PRIVS[k].desc}（${PRIVS[k].span}）</small></span></button>`).join("")}</div></div>
    <div class="btns"><button class="btn" id="pgo">宣言する</button></div>`);
  bindChips(s, "data-p", false);
  s.querySelectorAll("[data-pk]").forEach(b => b.onclick = () => { kind = Number(b.dataset.pk); s.querySelectorAll("[data-pk]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
  $("#pgo").onclick = async () => {
    const [pid] = picked(s, "data-p");
    if (!pid || !kind){ toast("獲得した人と特権を選んでください"); return; }
    if (await q(sb.from("privileges").insert({ trip_id: t.id, day, player_id: pid, kind }), "宣言")){
      await loadTable("privileges"); closeSheet(); render();
      flash(`特権${KANJI[kind]}「${PRIVS[kind].name}」`, `${pname(pid)}が宣言`);
    }
  };
}
async function deletePriv(id){
  if (!confirm("この特権の宣言を取り消しますか？")) return;
  if (await q(sb.from("privileges").delete().eq("id", id), "取り消し")){ await loadTable("privileges"); render(); }
}
function openSteal(t){
  const p2 = privOf(t, 2); if (!p2) return;
  const targets = activeMembers(t).filter(id => id !== p2.player_id && tcount(t, id) > 0);
  if (!targets.length){ toast("券を持っている人がいません"); return; }
  const s = openSheet("特権二：免除券強奪", `<p class="note">券の所持者だけでじゃんけんし、負けた人を選んでください。${esc(pname(p2.player_id))}が奪う券を選びます。</p>${chipPlayers(targets, [])}
    <div class="dbtns big"><button class="n" data-k="normal">免除券を奪う</button><button class="s" data-k="super">superを奪う</button></div>`);
  bindChips(s, "data-p", false);
  s.querySelectorAll("[data-k]").forEach(b => b.onclick = async () => {
    const [pid] = picked(s, "data-p"); if (!pid){ toast("負けた人を選んでください"); return; }
    const tk = ownTickets(t, pid, b.dataset.k)[0]; if (!tk){ toast("その券を持っていません"); return; }
    if (!(await q(sb.from("tickets").update({ player_id: p2.player_id, source: `強奪：${pname(pid)}から` }).eq("id", tk.id), "強奪"))) return;
    await q(sb.from("privileges").update({ uses: 1 }).eq("id", p2.id), "記録");
    await Promise.all([loadTable("tickets"), loadTable("privileges")]);
    closeSheet(); render(); flash("強奪成功！", `${pname(p2.player_id)}が${pname(pid)}から奪った`);
  });
}

/* ---------- ルーレット ---------- */
function rankHolder(t, r){
  const rows = standings(t).filter(x => typeof x.rank === "number");
  const hit = rows.find(x => x.rank === Number(r));
  return hit ? hit.id : (rows[Number(r) - 1] || {}).id || null;
}
function openRoulette(t, day){
  const n = activeMembers(t).length;
  const s = openSheet(`${day}日目のルーレット`, `<div class="wheel"><span class="num" id="rn">?</span><small>位が獲得</small></div><div class="btns"><button class="btn" id="rgo">回す</button></div>`);
  $("#rgo").onclick = () => {
    $("#rgo").disabled = true;
    const final = 1 + Math.floor(Math.random() * n);
    let i = 0, delay = 50; const el = $("#rn");
    const step = () => {
      el.textContent = (i % n) + 1; i++; delay *= 1.12;
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
      if (delay < 420) setTimeout(step, delay);
      else {
        el.textContent = final; el.classList.add("hitn");
        if (navigator.vibrate) navigator.vibrate(80);
        setTimeout(async () => { if (await putSetting(`roulette:${t.id}:${day}`, final)){ await loadTable("app_settings"); closeSheet(); render(); flash(`${final}位が獲得！`, `${day}日目のsuper免除券`); } }, 900);
      }
    };
    step();
  };
}
async function grantRoulette(t, day){
  const r = setting(`roulette:${t.id}:${day}`), pid = rankHolder(t, r);
  if (!pid) return;
  if (!confirm(`${pname(pid)}（今の${r}位）にsuper免除券を1枚付与しますか？`)) return;
  if (await q(sb.from("tickets").insert({ trip_id: t.id, player_id: pid, kind: "super", source: `ルーレット：${day}日目・${r}位` }), "付与")){
    await loadTable("tickets"); render(); flash("super免除券 獲得！", pname(pid));
  }
}

/* ---------- ピタリ賞・ニアピン賞 ---------- */
function prizeResults(t){
  const paid = Object.fromEntries(standings(t).map(r => [r.id, r.paid]));
  return activeMembers(t).map(id => {
    const pr = db.predictions.find(p => p.trip_id === t.id && p.player_id === id);
    if (!pr || pr.amount == null) return { id, pred: null, paid: paid[id] || 0, exempt: 0 };
    const v = paid[id] || 0, diff = v - pr.amount;
    const v100 = Math.floor(v / 100) * 100, p100 = Math.floor(pr.amount / 100) * 100;  // 判定は100円単位（100円未満は切り捨て）
    const pitari = v100 === p100;
    const near = !pitari && Math.abs(v100 - p100) <= 1000;
    return { id, pred: pr.amount, paid: v, diff, prize: pitari ? "ピタリ賞" : near ? "ニアピン賞" : null, exempt: pitari ? v : near ? Math.round(v / 2) : 0 };
  });
}
async function saveTravelTotal(t){
  const v = parseInt($("#ttotal").value, 10);
  if (await q(sb.from("trips").update({ travel_total: Number.isFinite(v) ? v : null }).eq("id", t.id), "保存")){ await loadTable("trips"); render(); toast("旅費総額を保存しました。全員で予想を入力してください"); }
}
async function savePrediction(t, pid, val){
  const v = parseInt(val, 10);
  if (await q(sb.from("predictions").upsert({ trip_id: t.id, player_id: pid, amount: Number.isFinite(v) ? v : null }, { onConflict: "trip_id,player_id" }), "保存")){ await loadTable("predictions"); render(); toast(`${pname(pid)}の予想を保存しました`); }
}

/* ---------- 精算 ---------- */
function settlement(t){
  const ids = activeMembers(t), rows = standings(t);
  const burden = Object.fromEntries(t.members.map(id => [id, (rows.find(r => r.id === id) || {}).paid || 0]));
  const prizes = prizeResults(t).filter(r => r.exempt > 0);
  prizes.forEach(r => { burden[r.id] -= r.exempt; const others = ids.filter(x => x !== r.id); others.forEach(x => burden[x] += r.exempt / others.length); });
  const outlay = Object.fromEntries(t.members.map(id => [id, 0]));
  tripPays(t).filter(p => p.payer_id).forEach(p => { const who = p.advanced_by || p.payer_id; outlay[who] = (outlay[who] || 0) + p.amount; });
  const bal = t.members.map(id => ({ id, v: Math.round(outlay[id] - burden[id]) }));
  const cred = bal.filter(b => b.v > 0).sort((a, b) => b.v - a.v), debt = bal.filter(b => b.v < 0).map(b => ({ ...b, v: -b.v })).sort((a, b) => b.v - a.v);
  const tx = []; let i = 0, k = 0;
  while (i < debt.length && k < cred.length){
    const m = Math.min(debt[i].v, cred[k].v);
    if (m > 0) tx.push({ from: debt[i].id, to: cred[k].id, amt: m });
    debt[i].v -= m; cred[k].v -= m;
    if (debt[i].v <= 0) i++; if (cred[k].v <= 0) k++;
  }
  return { burden, outlay, tx, prizes };
}
function openSettlement(t){
  const st = settlement(t);
  openSheet("精算", `
    <table class="stbl"><thead><tr><th>メンバー</th><th>男気の支払額</th><th>最終負担</th><th>実際に出した額</th></tr></thead><tbody>
    ${t.members.map(id => `<tr><td><span class="dot" style="background:${pcolor(id)}"></span>${esc(pname(id))}</td><td class="num">${yen((standings(t).find(r => r.id === id) || {}).paid)}</td><td class="num">${yen(st.burden[id])}</td><td class="num">${yen(st.outlay[id])}</td></tr>`).join("")}
    </tbody></table>
    ${st.prizes.length ? `<p class="note">賞：${st.prizes.map(r => `${esc(pname(r.id))} ${r.prize}（${yen(r.exempt)}免除）`).join("、")}</p>` : ""}
    <div class="h2" style="margin-top:18px">送金<small>${st.tx.length}件</small></div>
    ${st.tx.length ? st.tx.map(x => `<div class="txrow"><span><span class="dot" style="background:${pcolor(x.from)}"></span>${esc(pname(x.from))}</span><span class="arrow">→</span><span><span class="dot" style="background:${pcolor(x.to)}"></span>${esc(pname(x.to))}</span><b class="num">${yen(x.amt)}</b></div>`).join("") : `<p class="note">送金は不要です。立替えや賞の免除がなければ、じゃんけんで決まった人がその場で払って完了です。</p>`}`);
}

/* ---------- 設定：一斉宣言の金額 ---------- */
function openThreshold(){
  openSheet("一斉宣言を出す金額", `<p class="note">この金額以上のじゃんけんで、免除券を持っている人に一斉宣言を求めます。これ未満でも、じゃんけん画面の「券を使う」から使えます。</p>
    <label class="f"><span>金額</span><input id="thv" type="number" inputmode="numeric" value="${threshold()}"></label><div class="btns"><button class="btn" id="thok">保存</button></div>`);
  $("#thok").onclick = async () => { const v = parseInt($("#thv").value, 10); if (!(v > 0)){ toast("金額を入力してください"); return; } if (await putSetting("declare_threshold", v)){ await loadTable("app_settings"); closeSheet(); render(); toast(`${yen(v)}以上で一斉宣言します`); } };
}

/* ---------- 起動 ---------- */
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
$("#gearBtn").onclick = openSettings;
$("#meBtn").onclick = openMe;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) return;
  try { await loadAll(); render(); syncArena(); } catch (e) { console.error(e); }
});
(async () => {
  try { await loadAll(); }
  catch (e) { $("#view").innerHTML = `<div class="empty"><b>データを読み込めませんでした</b>${esc(e.message || e)}<br>Supabaseでテーブルを作成したか確認してください。</div>`; return; }
  render(); subscribe();
  if (db.players.length && !player(me)) openMe();
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
