/* ===================== コヨーテ ===================== */
/* カード：数字（1〜5は各4枚、10は3枚、15は2枚、20は1枚）、おばけ0×3、-5×2、-10×1、
   特殊：x2（酋長）、max0（キツネ）、q（ほらあな）、night（夜・0）。計36枚。
   自分のカードだけ見えない。宣言を上げていき、怪しいと思ったら「コヨーテ！」。3回負けたら脱落 */
const coDeck = () => {
  const d = [];
  [[1, 4], [2, 4], [3, 4], [4, 4], [5, 4], [10, 3], [15, 2], [20, 1], [0, 3], [-5, 2], [-10, 1]].forEach(([v, n]) => { for (let i = 0; i < n; i++) d.push(String(v)); });
  d.push("x2", "max0", "q", "night");
  return d;
};
const coGames = () => db.co_games || [];
const coActive = () => coGames().filter(g => g.status === "playing").sort((a, b) => b.created_at.localeCompare(a.created_at))[0] || null;
const coById = id => coGames().find(g => g.id === id);
const coLoss = (g, p) => ((g.lives || {})[p] || 0);
const coAliveP = (g, p) => coLoss(g, p) < 3;
const coAlive = g => g.players.filter(p => coAliveP(g, p));
const coDolls = (g, p) => Math.max(0, 2 - coLoss(g, p));
function coNext(g, pid){
  const n = g.players.length; let i = g.players.indexOf(pid);
  for (let k = 0; k < n; k++){ i = (i + 1) % n; const p = g.players[i]; if (p !== pid && coAliveP(g, p)) return p; }
  return pid;
}
function coMyTurn(g){
  return !!g && g.status === "playing" && g.phase === "bid" && !!me && coAliveP(g, me) && g.players.includes(me) && !!g.turn && g.turn.pid === me;
}
const CO_INFO = {
  x2: { t: "×2", n: "酋長", i: "🪶", c: "chief" }, max0: { t: "MAX→0", n: "キツネ", i: "🦊", c: "fox" },
  q: { t: "?", n: "ほらあな", i: "🕳️", c: "cave" }, night: { t: "0", n: "夜", i: "🌙", c: "night" }
};
function coCard(c, cls = "", extra = ""){
  if (c == null) return `<span class="cocard back ${cls}" ${extra}><b>?</b></span>`;
  const sp = CO_INFO[c];
  if (sp){
    const face = c === "max0" ? `<b class="l2"><span>MAX</span><span>→0</span></b>` : `<b class="${sp.t.length >= 2 ? "len2" : ""}">${sp.t}</b>`;
    return `<span class="cocard sp ${sp.c} ${cls}" ${extra}><i class="ci">${sp.i}</i>${face}</span>`;
  }
  const v = Number(c), txt = v < 0 ? "−" + Math.abs(v) : String(v);
  const k = v < 0 ? "k-neg" : v === 0 ? "k-ghost" : v >= 10 ? "k-big" : "k-num";
  return `<span class="cocard ${k} ${cls}" ${extra}>${v === 0 ? `<i class="ci">👻</i>` : v < 0 ? `<i class="ci">🪖</i>` : ""}<b class="${txt.length >= 3 ? "len3" : txt.length === 2 ? "len2" : ""}">${txt}</b></span>`;
}
// 合計の計算（ほらあなで引いたカードも含めて）。手順を文字で残す
function coCompute(cards){
  const all = cards.slice();
  const steps = [];
  const numeric = all.filter(c => !CO_INFO[c] || c === "night").map(c => c === "night" ? 0 : Number(c));
  let vals = numeric.slice();
  if (all.includes("max0") && vals.length){
    const mx = Math.max(...vals);
    const i = vals.indexOf(mx); vals[i] = 0;
    steps.push(`🦊 最大の${mx}を0に`);
  }
  let sum = vals.reduce((a, b) => a + b, 0);
  if (all.includes("x2")){ steps.push(`🪶 合計${sum}を2倍`); sum *= 2; }
  return { sum, steps };
}
async function coCommit(id, fn){
  for (let tries = 0; tries < 5; tries++){
    const g = coById(id); if (!g) return false;
    const r = fn(g); if (!r) return false;
    const body = { ...r.patch, version: (g.version || 1) + 1, updated_at: new Date().toISOString() };
    if (r.log){ const lg = (g.log || []).slice(), now = Date.now(); [].concat(r.log).forEach((m, i) => lg.push({ t: new Date(now + i).toISOString(), m })); body.log = lg.slice(-60); }
    const { data, error } = await sb.from("co_games").update(body).eq("id", id).eq("version", g.version || 1).select();
    if (error){ fail(error, "保存"); return false; }
    if (data && data.length){ Object.assign(g, data[0]); drawCo(); (r.push || []).forEach(to => pushCall({ type: "game_turn", game: "コヨーテ", to })); return true; }
    await loadTable("co_games");
  }
  drawCo(); toast("混み合っています。もう一度タップしてください", 2000); return false;
}
// カードを配る（山札が足りなければ捨て札を混ぜる）
function coDeal(players, deck, discard){
  let d = deck.slice(), ds = discard.slice();
  const hands = {};
  players.forEach(p => { if (!d.length){ d = shuffle(ds); ds = []; } hands[p] = d.shift(); });
  return { hands, deck: d, discard: ds };
}

let coId = null, coBusy = false, coVal = null, coPrev = null;
function openCo(id){ coId = id; coVal = null; coPrev = null; $("#cog").hidden = false; document.body.style.overflow = "hidden"; drawCo(); coAmbient(true); }

/* ---- 操作 ---- */
function coBid(n){
  return coCommit(coId, g => {
    if (!coMyTurn(g)) return null;
    const cur = g.bid ? g.bid.n : 0;
    if (!(n > cur) || n < 1) return null;
    const nx = coNext(g, me);
    return { patch: { bid: { n, pid: me }, turn: { ...g.turn, pid: nx } }, log: `${pname(me)}が「${n}」を宣言！ → ${pname(nx)}の番`, push: [nx] };
  });
}
function coCall(){
  return coCommit(coId, g => {
    if (!coMyTurn(g) || !g.bid) return null;
    const alive = coAlive(g);
    let deck = (g.deck || []).slice(), discard = (g.discard || []).slice();
    const cards = alive.map(p => g.hands[p]);
    let drawn = null;
    if (cards.includes("q")){
      if (!deck.length){ deck = shuffle(discard); discard = []; }
      drawn = deck.shift() || "0";
    }
    const eff = cards.map(c => c === "q" ? drawn : c);
    const { sum, steps } = coCompute(eff);
    const bidder = g.bid.pid, n = g.bid.n;
    const loser = n > sum ? bidder : me;
    const lives = { ...(g.lives || {}), [loser]: coLoss(g, loser) + 1 };
    const out = lives[loser] >= 3;
    const g2 = { ...g, lives }, alive2 = coAlive(g2);
    const night = eff.includes("night");
    const used = [...cards, ...(drawn ? [drawn] : [])];
    const result = { caller: me, bidder, n, sum, steps, drawn, loser, out, night, dolls: Math.max(0, 2 - lives[loser]) };
    const lines = [`${pname(me)}：コヨーテ！`, `合計は${sum}。宣言${n}は${n > sum ? "ウソ" : "セーフ"} → ${pname(loser)}の負け`];
    if (out) lines.push(`${pname(loser)}は3回負けて脱落…`);
    else lines.push(`${pname(loser)}の身代わり人形がやられた（残り${result.dolls}体）`);
    const patch = { phase: "result", result, lives, deck, discard: night ? discard : [...discard, ...used] };
    if (alive2.length <= 1){ lines.push(`${pname(alive2[0])}が最後の1人！優勝！`); return { patch: { ...patch, status: "finished", winner: alive2[0] || null }, log: lines }; }
    const starter = coAliveP(g2, loser) ? loser : coNext(g2, loser);
    patch.turn = { pid: starter, start: starter };
    return { patch, log: lines };
  });
}
function coNextRound(){
  return coCommit(coId, g => {
    if (g.status !== "playing" || g.phase !== "result") return null;
    let deck = (g.deck || []).slice(), discard = (g.discard || []).slice();
    if (g.result && g.result.night){ deck = shuffle(coDeck()); discard = []; }
    const dl = coDeal(coAlive(g), deck, discard), n = (g.round || 1) + 1, st = g.turn.pid;
    return { patch: { phase: "bid", round: n, hands: dl.hands, deck: dl.deck, discard: dl.discard, bid: null, result: null, turn: { pid: st, start: st } },
      log: `第${n}ラウンド${g.result && g.result.night ? "（夜のカードで山札をリセット）" : ""}。最初の宣言は${pname(st)}`, push: [st] };
  });
}

function coFx(kind, pid, opt = {}){

function coDiff(g){

  const r = g.result;

    setTimeout(() => coFx("howl", r.caller, { small: `${pname(r.caller)}が叫んだ！` }), 30);

function kgInfo(c){

  } else if (idx("pir") >= 0){ w = idx("pir"); why = all("mer") ? "pirmer" : "pirate"; bonus += 20 * all("mer"); }
  else if (idx("mer") >= 0){ w = idx("mer"); why = "mer"; }

    const nums = plays.map((pl, i) => ({ i, ...kgInfo(pl.c), k: ks[i] })).filter(x => x.k === "num");
    if (!nums.length) w = 0, why = "escape";
    else {
      const blacks = nums.filter(x => x.s === "b");
      const pool = blacks.length ? blacks : nums.filter(x => x.s === kgLeadSuit(plays));
      w = pool.reduce((a, b) => b.r > a.r ? b : a).i; why = blacks.length ? "trump" : "high";
    }
  }
  plays.forEach(pl => { const i = kgInfo(pl.c); if (i.t === "num" && i.r === 14) bonus += i.s === "b" ? 20 : 10; });

// 上級ルール込みの勝者。w=-1 はトリックが流れた（誰のものにもならない）。next=次に最初に出す人
function kgResolve(plays){
  const ks = plays.map(kgKind), ki = ks.indexOf("kra"), wi = ks.indexOf("wha");
  const eff = ki >= 0 && wi >= 0 ? (ki > wi ? "kra" : "wha") : ki >= 0 ? "kra" : wi >= 0 ? "wha" : null;   // 両方出たら後から出た方が有効
  const b14 = () => plays.reduce((a, pl) => { const i = kgInfo(pl.c); return a + (i.t === "num" && i.r === 14 ? (i.s === "b" ? 20 : 10) : 0); }, 0);
  if (eff === "wha"){
    const nums = plays.map((pl, i) => ({ i, ...kgInfo(pl.c), k: ks[i] })).filter(x => x.k === "num");
    if (!nums.length) return { w: -1, why: "whale0", bonus: 0, next: plays[wi].p };
    const w = nums.reduce((a, b) => b.r > a.r ? b : a).i;
    return { w, why: "whale", bonus: b14(), next: plays[w].p };
  }
  const b = kgResolveBase(plays);
  if (eff === "kra") return { w: -1, why: "kraken", bonus: 0, next: plays[b.w].p };
  const loot = plays.filter((pl, i) => ks[i] === "loot" && i !== b.w).map(pl => pl.p);
  return { ...b, next: plays[b.w].p, loot };
}

}
function kgPlay(c, tg){

  const lg = (g.log || []).slice(-3).reverse().map(x => `<li>${colorizeLog(g.players, x.m)}</li>`).join("");

  if (g.status === "finished"){
    const rank = g.players.slice().sort((a, b) => (g.scores[b] || 0) - (g.scores[a] || 0));
    over = `<div class="nover" style="--c:${pcolor(g.winner)}"><span class="ob"></span><div class="k">優勝</div><div class="p">${esc(pname(g.winner))}</div><div class="y">${g.scores[g.winner]}点</div><div class="kgrank">${rank.map((p, i) => `<span style="--pc:${pcolor(p)}"><i>${i + 1}</i><b>${esc(pname(p))}</b><em>${g.scores[p]}点</em></span>`).join("")}</div><div class="btns"><button class="btn" id="kgClose2">閉じる</button></div></div>`;
  }
  el.innerHTML = `<div class="nbg kgbg" aria-hidden="true">${["⚓", "🏴‍☠️", "💰", "🦜", "⚓", "🗺️", "💀", "🧭"].map((x, i) => `<i style="left:${(i * 13 + 4) % 92}%;top:${(i * 29 + 8) % 88}%;font-size:${22 + (i % 3) * 14}px;--dur:${8 + i}s;--dl:-${i * 1.3}s;--dx:${(i % 2 ? 1 : -1) * 30}px;--dy:-40px;--rot:${i * 17 - 50}deg;opacity:.18">${x}</i>`).join("")}</div>
    <div class="ntop"><b class="nt kgt">SKULL KING</b><span class="nrd sbr"><small>ROUND</small><b>${g.round}</b><i>/10</i></span><span class="ndk"></span><button class="nmini" id="kgMenu" aria-label="メニュー">…</button><button class="nmini" id="kgClose" aria-label="閉じる">×</button></div>
    <div class="nseats2 ${g.players.length >= 5 ? "tight" : ""}">${seats}</div>
    ${table}
    <div class="nlogw"><ul class="nlog">${lg}</ul></div>
    <div class="nbottom">${bottom}</div>${over}`;
  // 卓は常に同じ形（横長の楕円・比率固定）で、空いている場所の中央に置く
  const tb = el.querySelector(".kgtable"), fl = tb && tb.querySelector(".felt"), fw = fl && fl.querySelector(".fwrap");
  if (fw){
    // 横幅いっぱいを使い、縦に余裕があれば丸みを増やす（横長〜円まで。端末ごとに一度決めたら固定）
    if (!kgFeltW){ const r = fl.getBoundingClientRect(); let W = r.width, H = Math.min(r.height, W); if (H < W / 1.12){ W = Math.min(r.width, r.height * 1.12); H = W / 1.12; } kgFeltW = Math.floor(W); kgFeltH = Math.floor(H); }
    fw.style.width = kgFeltW + "px"; fw.style.height = kgFeltH + "px";
    tb.classList.add("fix"); el.querySelector(".kgflip").classList.add("fix");   // 枠は中身ぴったり（伸び縮みしない）
  }
  // トリック決着：場のカードが勝者の席へ吸い寄せられる
  const sw = [...el.querySelectorAll(".kp.sweep")];
  if (sw.length && g.last && g.last.w < 0){
    // クラーケン・白鯨で流れたトリック：渦に吸い込まれて消える
    const cp = el.querySelector(".compass"), b = cp && cp.getBoundingClientRect();
    if (b) sw.forEach((c, i) => {
      const a = c.getBoundingClientRect(), dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
      c.animate([{ transform: "translate(-50%,-50%)", opacity: 1 }, { transform: "translate(-50%,-50%)", opacity: 1, offset: .55 },
        { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.1) rotate(${540 + i * 40}deg)`, opacity: 0 }], { duration: 2500, delay: i * 50, easing: "cubic-bezier(.6,0,.4,1)", fill: "forwards" });
    });
  }
  if (sw.length && g.last && g.last.w >= 0){
    const wp = g.last.plays[g.last.w].p, ws = [...el.querySelectorAll(".ks")].find(x => x.dataset.p === wp);
    if (ws){
      const b = ws.getBoundingClientRect();
      sw.forEach((c, i) => {
        const a = c.getBoundingClientRect(), dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
        c.animate([{ transform: "translate(-50%,-50%)", opacity: 1 }, { transform: "translate(-50%,-50%)", opacity: 1, offset: .6 },
          { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.3) rotate(${i % 2 ? 30 : -30}deg)`, opacity: 0 }], { duration: 2500, delay: i * 40, easing: "cubic-bezier(.6,0,.4,1)", fill: "forwards" });
      });
      ws.animate([{ transform: "translate(-50%,-50%) scale(1)" }, { transform: "translate(-50%,-50%) scale(1.25)" }, { transform: "translate(-50%,-50%) scale(1)" }], { duration: 450, delay: 2300 });
    }
  }
  // 羅針盤の針：前の向きから今いちばん強いカードの方へ振れる
  const nd = el.querySelector(".compass .needle");
  if (nd && nd.dataset.a !== ""){
    let to = Number(nd.dataset.a), from = kgNeedleA == null ? to - 200 : kgNeedleA;
    while (to - from > 180) to -= 360; while (from - to > 180) to += 360;
    nd.style.transform = `rotate(${to}deg)`;
    if (from !== to) nd.animate([{ transform: `rotate(${from}deg)` }, { transform: `rotate(${to + (to > from ? 14 : -14)}deg)`, offset: .7 }, { transform: `rotate(${to}deg)` }], { duration: 900, easing: "cubic-bezier(.3,1.3,.5,1)" });
    kgNeedleA = to;
  }
  const on = (id, fn) => { const x = el.querySelector("#" + id); if (x) x.onclick = fn; };
  const act = fn => async () => { if (kgBusy) return; kgBusy = true; try { await fn(); } finally { kgBusy = false; } };
  on("kgClose", closeKg); on("kgClose2", closeKg); on("kgMenu", () => kgMenu(g));
  on("kgBid", act(async () => { const v = kgBidSel; kgBidSel = null; if (v != null) await kgBid(v); }));
  on("kgPlay", act(async () => { const c = kgSel; kgSel = null; if (c) await kgPlay(c); }));
  on("kgTigE", act(async () => { kgSel = null; await kgPlay("tig", "escape"); }));
  on("kgTigP", act(async () => { kgSel = null; await kgPlay("tig", "pirate"); }));
  on("kgNext", act(kgNextRound));
  // 裏返し：半分回ったところで表と裏を入れ替える（iPhoneでも裏側が透けない）
  on("kgFlip", () => {
    const f = el.querySelector(".kgflip"), c = f && f.querySelector(".kg3"); if (!c || f.dataset.busy) return;
    f.dataset.busy = "1"; kgFlip = !kgFlip;
    const sw = () => { f.classList.toggle("on", kgFlip); el.querySelector("#kgFlip").textContent = kgFlip ? "🧭 テーブル" : "📜 早見表"; };
    const a = c.animate([{ transform: "rotateY(0)" }, { transform: "rotateY(90deg)" }], { duration: 260, easing: "ease-in" });
    a.onfinish = () => { sw(); const b = c.animate([{ transform: "rotateY(-90deg)" }, { transform: "rotateY(0)" }], { duration: 300, easing: "ease-out" }); b.onfinish = () => { delete f.dataset.busy; }; };
  });
  on("kgPeek", () => {
    const dk = ((g.ex || {}).deck || []).slice(), ord = { y: 1, g: 2, p: 3, b: 4 };
    dk.sort((a, b) => { const A = kgInfo(a), B = kgInfo(b); return (A.t === "num" ? ord[A.s] * 100 + A.r : 1000 + A.t.charCodeAt(0)) - (B.t === "num" ? ord[B.s] * 100 + B.r : 1000 + B.t.charCodeAt(0)); });
    openSheet("残りの山札（配られていないカード）", `<p class="note">${dk.length}枚。ほかの人には見えません</p><div class="kgpeek">${dk.map(c => kgCard(c, "mini")).join("")}</div>`);
  });
  on("kgAbGo", act(async () => {
    if (!pend) return;
    if (pend.k === "bendt"){ const v = kgDisc.slice(); kgDisc = []; await kgAbil(v); }
    else if (pend.k === "juanita") await kgAbil(null);
    else { const v = kgAbSel; kgAbSel = null; if (v != null) await kgAbil(v); }
  }));
  el.querySelectorAll("[data-kd]").forEach(b => b.onclick = () => { const c = b.dataset.kd, k = ((pend && pend.drew) || []).length; if (kgDisc.includes(c)) kgDisc = kgDisc.filter(x => x !== c); else if (kgDisc.length < k) kgDisc = [...kgDisc, c]; else kgDisc = [...kgDisc.slice(1), c]; drawKg(); });
  el.querySelectorAll("[data-kv]").forEach(b => b.onclick = () => { const v = JSON.parse(b.dataset.kv); kgAbSel = kgAbSel === v ? null : v; drawKg(); });
  el.querySelectorAll("[data-kb]").forEach(b => b.onclick = () => { const v = Number(b.dataset.kb); kgBidSel = kgBidSel === v ? null : v; drawKg(); });
  el.querySelectorAll("[data-kc]").forEach(b => b.onclick = () => { kgSel = kgSel === b.dataset.kc ? null : b.dataset.kc; drawKg(); });
}
function kgMenu(g){
  const s = openSheet("スカルキングのメニュー", `<div class="menu"><button data-x="rule">ルールを見る<span></span></button><button data-x="score">得点表を見る<span></span></button><button data-x="abort">この対戦をやめる<span></span></button></div>`);
  s.querySelector('[data-x="rule"]').onclick = () => openGameRules("kg");
  s.querySelector('[data-x="score"]').onclick = () => {
    const h = g.history || [];
    openSheet("得点表", `<div class="kgsheet"><table><tr><th>R</th>${g.players.map(p => `<th style="color:${pcolor(p)}">${esc(pname(p))}</th>`).join("")}</tr>
      ${h.map(r => `<tr><td>${r.round}</td>${g.players.map(p => { const x = r.rows[p]; return `<td class="${x.bid === x.won ? "hit" : "miss"}"><small>${x.bid}/${x.won}</small>${x.pts >= 0 ? "+" : ""}${x.pts}</td>`; }).join("")}</tr>`).join("")}
      <tr class="tot"><td>計</td>${g.players.map(p => `<td>${(g.scores || {})[p] || 0}</td>`).join("")}</tr></table><p class="note">小さい数字は「予想/獲得」</p></div>`);
  };
  s.querySelector('[data-x="abort"]').onclick = async () => { if (!confirm("この対戦をやめますか？")) return; closeSheet(); await kgCommit(g.id, () => ({ patch: { status: "aborted" }, log: "対戦が中止されました" })); closeKg(); };
}

/* ---------- 起動 ---------- */
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
$("#gearBtn").onclick = openSettings;
$("#neuIco").onclick = openGames;
async function shareLink(){
  const url = location.origin + location.pathname;
  const data = { url };  // URLだけを渡すと、共有シートの「コピー」でリンクだけが保存される
  try {
    if (navigator.share){ await navigator.share(data); return; }
    await navigator.clipboard.writeText(url); toast("リンクをコピーしました");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    try { await navigator.clipboard.writeText(url); toast("リンクをコピーしました"); } catch (_) { prompt("このリンクを共有してください", url); }
  }
}
$("#meBtn").onclick = openMe;
async function clearBadge(){
  // アプリを開いたら通知の未読は0に。オーナーは未処理の編集リクエスト数だけバッジを残す
  try {
    let n = 0;
    try { if (loaded && me && me === hostId()) n = Object.keys(setting("rule_requests") || {}).length; } catch (_) {}
    if (n > 0 && navigator.setAppBadge) await navigator.setAppBadge(n); else if (navigator.clearAppBadge) await navigator.clearAppBadge();
    const c = await caches.open("ojk-badge"); await c.put("/badge", new Response(String(n)));
  } catch (e) {}
}
let lastBadgeN = null;
clearBadge();
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) return;
  clearBadge();
  try { await loadAll(); render(); syncArena(); drawNeu(); drawCs(); drawSb(); drawSk(); drawCo(); drawKg(); } catch (e) { console.error(e); }
});
(async () => {

  render(); subscribe();
  if (db.players.length && !player(me)) openMe();
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
