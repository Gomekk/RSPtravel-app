<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="男気じゃんけん旅">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<title>男気じゃんけん旅</title>
<style>
:root{
  --ink:#1B1838; --paper:#F1F2F6; --card:#FFFFFF; --line:#D3D8E3; --mute:#69708A;
  --gold:#E8B12A; --crimson:#E2364F; --aqua:#1FB3BF;
  --metal:linear-gradient(135deg,#FFF1B8 0%,#E8B12A 38%,#FFE38A 62%,#B9821A 100%);
  --disp:"Dela Gothic One","Hiragino Kaku Gothic StdN","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{color:var(--ink);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.55;
  background:linear-gradient(165deg,#FFFFFF 0%,#F1F2F6 45%,#D2D7E2 100%) fixed}
/* 背景：中央からの放射光と、四隅のドット */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:repeating-conic-gradient(from 3deg at 50% 22%,rgba(243,206,110,.16) 0 6.4deg,transparent 6.4deg 12.8deg);
  -webkit-mask-image:radial-gradient(circle at 50% 22%,#000 0,#000 30%,transparent 85%);mask-image:radial-gradient(circle at 50% 22%,#000 0,#000 30%,transparent 85%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,rgba(110,120,148,.42) 1.4px,transparent 1.8px) 0 0/11px 11px;
  -webkit-mask-image:radial-gradient(circle at 0 0,#000,transparent 150px),radial-gradient(circle at 100% 0,#000,transparent 150px),radial-gradient(circle at 0 100%,#000,transparent 170px),radial-gradient(circle at 100% 100%,#000,transparent 170px);
  mask-image:radial-gradient(circle at 0 0,#000,transparent 150px),radial-gradient(circle at 100% 0,#000,transparent 150px),radial-gradient(circle at 0 100%,#000,transparent 170px),radial-gradient(circle at 100% 100%,#000,transparent 170px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,177,42,.2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--disp);font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums}

/* ---------- 枠 ---------- */
header{position:sticky;top:0;z-index:20;padding:calc(var(--safe-t) + 10px) 16px 12px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(255,255,255,.96) 65%,rgba(255,255,255,0))}
.logo{font-family:var(--disp);font-size:20px;line-height:1;letter-spacing:.02em;color:var(--ink);text-shadow:0 0 14px rgba(232,177,42,.55)}
.logo small{display:block;font-family:var(--body);font-size:11px;color:var(--mute);font-weight:700;margin-top:6px;letter-spacing:0;text-shadow:none}
header .sp{flex:1}
.me{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;padding:5px 11px 5px 5px;border-radius:99px;background:#fff;border:2px solid var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.gear{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.gear:active{transform:translateY(3px);box-shadow:none}
main{padding:4px 16px calc(var(--safe-b) + 100px);max-width:560px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:2px solid var(--ink);padding:6px 4px calc(var(--safe-b) + 6px)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:900;color:var(--mute);padding:6px 0}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] svg{color:#C98E12;filter:drop-shadow(0 0 6px rgba(232,177,42,.8))}
nav button[aria-current="page"]::before{content:"";position:absolute;top:-8px;left:30%;right:30%;height:4px;border-radius:0 0 4px 4px;background:var(--metal)}

/* ---------- 共通の飾り：金の角飾り ---------- */
.framed{position:relative}
.framed::before,.framed::after{content:"";position:absolute;width:26px;height:26px;pointer-events:none}
.framed::before{top:-5px;left:-5px;border-top:4px solid var(--gold);border-left:4px solid var(--gold);border-radius:4px 0 0 0}
.framed::after{bottom:-5px;right:-5px;border-bottom:4px solid var(--gold);border-right:4px solid var(--gold);border-radius:0 0 4px 0}

/* ---------- ホーム ---------- */
.trip{margin:8px 0 18px;padding:16px 16px 14px;border-radius:16px;background:rgba(255,255,255,.75);border:2px solid var(--ink)}
.trip .t{font-family:var(--disp);font-size:25px;line-height:1.2}
.trip .s{color:var(--mute);font-size:13px;font-weight:700;margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dayflag{display:inline-block;background:var(--metal);color:var(--ink);font-family:var(--disp);font-size:13px;padding:2px 10px;border-radius:6px;border:2px solid var(--ink);transform:skewX(-8deg)}
.live{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:14px;border-radius:14px;background:linear-gradient(120deg,#FF5A6E,var(--crimson) 55%,#A8122A);color:#fff;border:2px solid var(--ink);box-shadow:0 0 0 0 rgba(226,54,79,.5);animation:pulse 1.6s ease-in-out infinite}
.live b{font-family:var(--disp);font-weight:400;font-size:16px}
.live span{font-size:12px;opacity:.95}
@keyframes pulse{50%{box-shadow:0 0 22px 4px rgba(226,54,79,.45)}}
.acts{display:grid;grid-template-columns:1fr 94px;gap:12px;margin-bottom:22px}
.big{position:relative;overflow:hidden;font-family:var(--disp);font-size:23px;padding:18px 0;border-radius:16px;background:var(--metal);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink),0 0 24px rgba(232,177,42,.55);transform:skewX(-6deg)}
.big>span{display:inline-block;transform:skewX(6deg)}
.big::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-40%}100%{left:130%}}
.big:active{transform:skewX(-6deg) translateY(5px);box-shadow:0 0 0 var(--ink),0 0 24px rgba(232,177,42,.55)}
.sub{font-family:var(--disp);font-size:16px;border-radius:16px;background:#fff;border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink),0 0 18px rgba(31,179,191,.35)}
.sub:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.h2{font-family:var(--disp);font-size:17px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
.h2::before{content:"";align-self:center;width:12px;height:12px;background:var(--metal);border:2px solid var(--ink);transform:rotate(45deg);flex:none}
.h2 small{font-family:var(--body);font-size:12px;color:var(--mute);font-weight:700}
.rank{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:4px 10px;padding:12px 14px 12px 8px;border-radius:14px;background:#fff;margin-bottom:10px;border:2px solid var(--ink);box-shadow:inset 6px 0 0 var(--c,var(--line))}
.rank .r{font-family:var(--disp);font-size:30px;text-align:center;line-height:1;color:#A3A9BA;padding-left:4px}
.rank.top{background:linear-gradient(105deg,#FFF6D6,#fff 60%);box-shadow:inset 6px 0 0 var(--c),0 0 22px rgba(232,177,42,.55)}
.rank.top .r{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 var(--ink)) drop-shadow(0 0 8px rgba(232,177,42,.7))}
.rank .n{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px}
.rank .n .mine{font-size:10px;font-weight:900;padding:1px 6px;border-radius:5px;background:var(--aqua);color:#fff}
.rank .a{font-family:var(--disp);font-size:21px;text-align:right}
.rank .m{grid-column:2/4;font-size:12px;color:var(--mute);font-weight:700;display:flex;flex-wrap:wrap;gap:2px 12px}
.plus{color:var(--crimson)}.minus{color:#108C96}
.pend{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:2px dashed #9AA1B4;background:rgba(255,255,255,.6);margin-bottom:8px}
.pend .l{flex:1;min-width:0}
.pend .l b{display:block;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pend .l span{font-size:12px;color:var(--mute);font-weight:700}
.chipbtn{flex:none;font-family:var(--disp);font-size:13px;padding:7px 12px;border-radius:10px;background:var(--crimson);color:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.chipbtn:active{transform:translateY(3px);box-shadow:none}

/* ---------- 一覧 ---------- */
.row{display:grid;grid-template-columns:30px 1fr auto;gap:0 10px;align-items:center;width:100%;text-align:left;padding:6px 10px 6px 4px;line-height:1.4;border-radius:12px;background:rgba(255,255,255,.7);margin-bottom:6px;border:1.5px solid var(--line)}
.row .q{font-family:var(--disp);font-size:13px;color:#A3A9BA;text-align:center}
.row .l{font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{font-family:var(--disp);font-size:16px;text-align:right}
.row .m{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-weight:700}
.tag{font-size:11px;font-weight:900;padding:1px 7px;border-radius:5px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.tag.gold{background:var(--metal);border-color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.who .dot{width:11px;height:11px;border-width:1.5px}
.filter{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:2px 16px 8px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;font-size:12px;font-weight:900;padding:6px 12px;border-radius:99px;background:#fff;border:2px solid var(--line)}
.filter button[aria-pressed="true"]{background:var(--metal);border-color:var(--ink)}
.empty{text-align:center;color:var(--mute);font-weight:700;padding:36px 14px;border:2px dashed #9AA1B4;border-radius:16px;background:rgba(255,255,255,.6)}
.empty b{display:block;font-family:var(--disp);font-weight:400;color:var(--ink);font-size:19px;margin-bottom:6px}
.soon{text-align:center;padding:60px 16px;color:var(--mute);font-weight:700}
.soon b{display:block;font-family:var(--disp);font-weight:400;font-size:26px;color:var(--ink);margin-bottom:8px;text-shadow:0 0 16px rgba(232,177,42,.6)}

/* ---------- シート ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(27,24,56,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .in{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:linear-gradient(170deg,#fff,#F1F2F6);border-radius:22px 22px 0 0;border:2.5px solid var(--ink);border-bottom:0;padding:20px 18px calc(var(--safe-b) + 20px);transform:translateY(30px);transition:transform .22s}
.sheet .in::before{content:"";position:absolute;top:8px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:var(--metal)}
.sheet.on .in{transform:none}
.sheet h3{font-family:var(--disp);font-weight:400;font-size:21px;margin:6px 0 14px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;font-family:var(--body);font-size:13px;color:var(--mute);font-weight:700;padding:6px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12px;font-weight:900;color:var(--mute);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:13px;padding:8px 12px;border-radius:10px;background:#fff;border:2px solid var(--line)}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:#FFF6D6;box-shadow:0 0 12px rgba(232,177,42,.5)}
.chips button.pc[aria-pressed="true"]{background:color-mix(in srgb,var(--pc) 24%,#fff);box-shadow:none;color:var(--ink)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:4px}
.stepper button{width:34px;height:34px;border-radius:8px;border:2px solid var(--ink);background:#fff;font-weight:900}
.stepper b{font-size:14px;letter-spacing:.04em;white-space:nowrap}
.chips.terms{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.chips.terms button{justify-content:center;padding:11px 0}
.chips.terms button[data-term="春"][aria-pressed="true"]{background:#FFE6F1;box-shadow:0 0 14px rgba(255,111,181,.75)}
.chips.terms button[data-term="夏"][aria-pressed="true"]{background:#FFF6CC;box-shadow:0 0 14px rgba(245,200,66,.85)}
.chips.terms button[data-term="秋"][aria-pressed="true"]{background:#FFE9D6;box-shadow:0 0 14px rgba(255,138,61,.8)}
.chips.terms button[data-term="冬"][aria-pressed="true"]{background:#DDF7F9;box-shadow:0 0 14px rgba(63,193,201,.8)}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.period input{-webkit-appearance:none;appearance:none;flex:0 0 auto;width:9.4em;min-width:0;min-height:42px;padding:8px 10px;font-size:15px;text-align:left}
.period input::-webkit-date-and-time-value{text-align:left}
.period span{font-weight:900;color:var(--mute)}
.trip .tedit{position:absolute;right:12px;bottom:12px}
.chips button[aria-pressed="false"]{color:var(--mute)}
.chips button[aria-pressed="false"] .dot{opacity:.35}
.chips button:disabled{opacity:.4}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:#fff;border:2px solid var(--line);margin-bottom:12px;font-weight:900}
.toggle small{display:block;font-size:12px;color:var(--mute);font-weight:700}
.sw{position:relative;width:50px;height:30px;flex:none;border-radius:99px;background:#C6CBD8;border:2px solid var(--ink);transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--gold)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;font-weight:900;padding:12px 0;border-radius:12px;background:var(--metal);color:var(--ink);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.danger{background:#fff;color:var(--crimson);border-color:var(--crimson);box-shadow:0 4px 0 var(--crimson)}
.btn:disabled{opacity:.45}
.note{font-size:12px;color:var(--mute);font-weight:700;margin:4px 0 12px}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;border-bottom:1.5px solid var(--line);font-weight:900;text-align:left}
.menu button span{color:var(--mute);font-size:12px;font-weight:700}
.plist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px solid var(--line)}
.plist b{flex:1}
.mini{white-space:nowrap;flex:none;font-size:12px;font-weight:900;padding:6px 10px;border-radius:8px;border:2px solid var(--ink);background:#fff}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold)}
.colors button{position:relative}
.colors button:disabled{opacity:.45;cursor:not-allowed}
.colors button:disabled::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:4px;margin-left:-2px;border-radius:2px;background:var(--crimson);transform:rotate(45deg);box-shadow:0 0 0 1.5px #fff}

/* ---------- じゃんけん画面 ---------- */
.arena{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 14px);
  background:repeating-conic-gradient(from 0deg at 50% 46%,rgba(243,206,110,.15) 0 5deg,transparent 5deg 10deg),radial-gradient(circle at 50% 46%,#fff 0,#fff 18%,transparent 60%),linear-gradient(165deg,#FFFFFF,#ECEEF3 50%,#C9CED9)}
.arena[hidden]{display:none}
.atop{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.85);border:2px solid var(--ink)}
.atop .lbl{flex:1;min-width:0}
.atop .lbl b{display:block;font-family:var(--disp);font-weight:400;font-size:21px;line-height:1.25;word-break:break-all}
.atop .lbl span{font-size:12px;font-weight:700;color:var(--mute)}
.atop .amt{font-family:var(--disp);font-size:27px;white-space:nowrap;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 var(--ink)) drop-shadow(0 0 6px rgba(232,177,42,.6))}
.hint{text-align:center;font-weight:900;font-size:13px;color:var(--mute);margin:14px 0 10px}
.hint b{color:var(--ink)}
.fighters{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start;overflow-y:auto;padding:16px 16px 18px;margin:-12px -16px 0}
.fighter{position:relative;overflow:hidden;text-align:left;padding:16px 12px 12px;border-radius:16px;background:#fff;border:2.5px solid var(--ink);box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent),inset 0 6px 0 var(--c);min-height:132px;transition:transform .12s,opacity .25s,filter .25s}
.fighter::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)}
.fighter:active{transform:scale(.95)}
.fighter .fn{position:relative;z-index:1;font-weight:900;font-size:17px;line-height:1.3}
.fighter .lives{position:relative;z-index:1;display:flex;gap:6px;margin-top:12px}
.fighter .lives i{width:24px;height:15px;transform:skewX(-14deg);background:var(--c);border:2px solid var(--ink);border-radius:3px;box-shadow:0 0 10px var(--c)}
.fighter .lives i.lost{background:#fff;box-shadow:none;border-style:dashed;opacity:.6}
.fighter .st{position:absolute;z-index:1;right:10px;bottom:10px;font-family:var(--disp);font-size:11px;color:var(--mute)}
.fighter.out{opacity:.55;filter:grayscale(1);box-shadow:inset 0 6px 0 #B9BFCC}
.fighter.out .stamp{position:absolute;z-index:2;right:2px;top:30px;transform:rotate(-14deg);font-family:var(--disp);font-size:24px;color:#108C96;border:3px solid #108C96;border-radius:8px;padding:0 10px;background:rgba(255,255,255,.8)}
.fighter.hit{animation:hit .35s}
@keyframes hit{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}}
.abar{display:flex;gap:10px}
.abar .btn{flex:1}
.verdict{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:2;
  background:repeating-conic-gradient(from 0deg at 50% 44%,color-mix(in srgb,var(--c) 22%,transparent) 0 6deg,transparent 6deg 12deg),radial-gradient(circle at 50% 44%,#fff 0,rgba(255,255,255,.96) 35%,rgba(236,238,243,.97) 100%)}
.verdict[hidden]{display:none}
.verdict .k{font-family:var(--disp);font-size:22px;letter-spacing:.3em;padding:2px 16px 2px 22px;border-radius:8px;background:var(--metal);border:2px solid var(--ink);transform:skewX(-8deg);animation:fadein .4s both}
.verdict .p{font-family:var(--disp);font-size:clamp(46px,13vw,74px);line-height:1.15;margin:16px 0 8px;color:var(--c);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 0 18px var(--c));animation:slam .5s cubic-bezier(.2,1.6,.4,1) .15s both;word-break:break-all}
.verdict .y{font-weight:900;font-size:16px;animation:fadein .4s .45s both}
.verdict .y .num{font-size:28px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 var(--ink))}
.verdict .btns{width:100%;max-width:360px;margin-top:30px;animation:fadein .4s .6s both}
@keyframes slam{from{transform:scale(2.6) rotate(-6deg);opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-weight:900;font-size:14px;padding:10px 16px;border-radius:12px;border:2px solid var(--gold);box-shadow:0 0 16px rgba(232,177,42,.5);transition:all .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{text-align:center;padding:80px 0;color:var(--mute);font-family:var(--disp)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 装飾（赤・青・ギザギザ・稲妻・きらめき） ===== */
.deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.deco i{position:absolute;background:center/contain no-repeat}
.deco .g1{top:86px;right:18px;width:18px;height:18px;background-image:var(--glint-gold)}
.deco .g2{top:150px;left:10px;width:12px;height:12px;background-image:var(--glint-aqua)}
.deco .g3{top:44%;right:8px;width:14px;height:14px;background-image:var(--glint-red)}
.deco .g4{bottom:130px;left:16px;width:20px;height:20px;background-image:var(--glint-gold)}
.deco .g5{bottom:200px;right:22px;width:11px;height:11px;background-image:var(--glint-aqua)}
.deco .g6{top:62%;left:6px;width:10px;height:10px;background-image:var(--glint-red)}
.deco .b1{top:66px;left:-14px;width:70px;height:70px;background-image:var(--bolt-red);opacity:.55;transform:rotate(-8deg)}
.deco .b2{bottom:84px;right:-16px;width:80px;height:80px;background-image:var(--bolt-aqua);opacity:.55;transform:rotate(170deg)}
.deco .s1{top:120px;right:-18px;width:86px;height:86px;background-image:var(--hand-paa);opacity:.32;transform:rotate(-24deg)}
.deco .s2{bottom:40px;left:-40px;width:130px;height:130px;background-image:var(--burst-glow-aqua);opacity:.22}

header::after{content:"";position:absolute;left:16px;right:16px;bottom:4px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--crimson) 0 33%,var(--gold) 33% 66%,var(--aqua) 66%)}
.logo{white-space:nowrap}

/* 電気が走る動き */
@keyframes zap{0%,100%{opacity:1;filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}8%{opacity:.35}10%{opacity:1}12%{opacity:.5}14%{opacity:1}52%{opacity:1}54%{opacity:.4}56%{opacity:1;filter:drop-shadow(0 0 10px rgba(255,255,255,1))}}
.deco .b1,.deco .b2,.trip .tb2,.big .bz,.live::before,.atop::after,.verdict .bl{animation:zap 2.4s steps(1,end) infinite}
.deco .b2,.big .bz{animation-delay:.9s}
.trip .tb2,.verdict .bl.r{animation-delay:1.5s}
@keyframes zigrun{to{background-position:24px 0}}
.h2::after{animation:zigrun 1.2s linear infinite}
@keyframes glintpulse{50%{transform:scale(.55) rotate(45deg);opacity:.55}}
.deco .g1,.deco .g3,.deco .g5{animation:glintpulse 2.2s ease-in-out infinite}
.deco .g2,.deco .g4,.deco .g6{animation:glintpulse 2.8s ease-in-out .7s infinite}

/* 旅カード */
.trip{overflow:visible}
.framed::after{border-color:var(--crimson)}
.trip .gem{position:absolute;width:10px;height:10px;border:2px solid var(--ink);transform:rotate(45deg)}
.trip .gem.a{top:-7px;left:34px;background:var(--aqua)}
.trip .gem.r{bottom:-7px;right:34px;background:var(--gold)}
.trip .tb{position:absolute;top:-22px;right:-10px;width:76px;height:76px;background:var(--burst-glow-gold) center/contain no-repeat;filter:drop-shadow(0 0 8px rgba(232,177,42,.6));animation:spin 18s linear infinite}
.trip .tb2{position:absolute;top:22px;right:18px;width:34px;height:34px;background:var(--bolt-aqua) center/contain no-repeat;transform:scaleX(-1) rotate(-10deg)}
.trip .t{padding-right:58px}
@keyframes spin{to{transform:rotate(360deg)}}
.dayflag{background:var(--crimson);color:#fff}

/* 進行中バナー */
.live{position:relative;overflow:hidden;padding-left:52px}
.live::before{content:"";position:absolute;left:10px;top:50%;width:34px;height:34px;margin-top:-17px;background:var(--bolt-gold) center/contain no-repeat;filter:drop-shadow(0 0 4px rgba(255,255,255,.8))}
.live::after{content:"";position:absolute;right:6px;top:50%;width:54px;height:54px;margin-top:-27px;background:var(--hand-choki) center/contain no-repeat;animation:wobble 1.2s ease-in-out infinite}
@keyframes wobble{50%{transform:rotate(-14deg) scale(1.08)}}
.live{padding-right:66px}

/* ボタン */
.big::before{content:"";position:absolute;left:-6px;top:50%;width:54px;height:54px;margin-top:-27px;transform:skewX(6deg) rotate(-18deg);background:var(--hand-guu) center/contain no-repeat;opacity:.9}
.big>span{position:relative;text-shadow:0 1px 0 rgba(255,255,255,.7);padding-left:30px}
.big .bz{position:absolute;right:10px;top:8px;width:26px;height:26px;background:var(--bolt-pink) center/contain no-repeat;transform:skewX(6deg) scaleX(-1)}
.sub{position:relative;overflow:hidden;box-shadow:0 5px 0 var(--ink),0 0 18px rgba(31,179,191,.45);background:linear-gradient(180deg,#fff 60%,#DDF7F9)}
.sub::before{content:"";display:block;width:32px;height:32px;margin:0 auto 4px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%2219%22%20fill%3D%22%239BF1F4%22%20stroke%3D%22%231B1838%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%2212.5%22%20fill%3D%22%23fff%22%20stroke%3D%22%231B1838%22%20stroke-width%3D%222.5%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%224.5%22%20fill%3D%22%231FB3BF%22%20stroke%3D%22%231B1838%22%20stroke-width%3D%222.5%22/%3E%3Cpath%20d%3D%22M11.8%2021.5h7.7M28.5%2021.5h7.7M24%2028.5v7.8%22%20stroke%3D%22%231B1838%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E") center/contain no-repeat;animation:steer 2.4s ease-in-out infinite}
@keyframes steer{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}

/* 見出しのひし形を色分け */
.h2.red::before{background:var(--crimson)}
.h2.aqua::before{background:var(--aqua)}
.h2::after{content:"";flex:1;align-self:center;height:6px;margin-left:6px;background:var(--zig-ink) 0 0/12px 6px repeat-x;opacity:.18}

/* 序列 */
.rank .r{position:relative;z-index:0}
.rank .r::before{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;background:center/contain no-repeat;opacity:.35}
.rank.r1 .r::before{background-image:var(--burst-glow-gold);opacity:1;width:56px;height:56px;margin:-28px 0 0 -28px;animation:spin 14s linear infinite}
.rank.top .r{background:none;color:var(--ink);filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff)}
.rank.r2 .r::before{background-image:var(--burst-glow-aqua)}
.rank.r3 .r::before{background-image:var(--burst-glow-red)}
.rank.r2 .r{color:#108C96}
.rank.r3 .r{color:var(--crimson)}
.rank.top::after{content:"";position:absolute;right:8px;top:-9px;width:22px;height:22px;background:var(--glint-gold) center/contain no-repeat}
.rank{position:relative}

/* 未決着 */
.pend{border-color:rgba(226,54,79,.55);background:linear-gradient(90deg,rgba(226,54,79,.08),rgba(255,255,255,.6) 40%)}

/* タブの印 */
nav button[aria-current="page"]::before{background:linear-gradient(90deg,var(--crimson),var(--gold),var(--aqua))}

/* シート */
.sheet .in::before{width:60px;margin-left:-30px;background:linear-gradient(90deg,var(--crimson) 0 33%,var(--gold) 33% 66%,var(--aqua) 66%)}
.sheet h3::before{content:"";width:28px;height:28px;flex:none;background:var(--hand-choki) center/contain no-repeat;transform:rotate(-10deg)}
.sheet h3.hd1::before{background-image:var(--hand-guu);transform:rotate(-20deg)}
.sheet h3.hd2::before{background-image:var(--hand-paa);transform:rotate(-14deg)}

/* 空の状態 */
.empty::before,.soon::before{content:"";display:block;width:56px;height:56px;margin:0 auto 10px;background:var(--burst-glow-gold) center/contain no-repeat;animation:spin 16s linear infinite}

/* じゃんけん画面 */
.atop{position:relative;overflow:visible}
.atop::before{content:"";position:absolute;left:-12px;top:-16px;width:40px;height:40px;background:var(--hand-paa) center/contain no-repeat;transform:rotate(-20deg)}
.atop::after{content:"";position:absolute;right:-8px;bottom:-14px;width:34px;height:34px;background:var(--bolt-aqua) center/contain no-repeat}
.arena .deco-a{position:absolute;inset:0;pointer-events:none;z-index:0}
.arena>*{position:relative;z-index:1}
.arena>.verdict{position:absolute}
.hint{display:flex;align-items:center;justify-content:center;gap:8px}
.hint::before,.hint::after{content:"";width:18px;height:18px;background:var(--glint-red) center/contain no-repeat}
.hint::after{background-image:var(--glint-aqua)}
.fighter .gem{position:absolute;z-index:1;right:12px;top:16px;width:14px;height:14px;background:var(--c);border:2px solid var(--ink);transform:rotate(45deg)}
.fighter.out .gem{display:none}
.verdict .vb{position:absolute;left:50%;top:44%;width:min(118vw,620px);height:min(118vw,620px);transform:translate(-50%,-50%);background:var(--burst-glow-gold) center/contain no-repeat;opacity:.55;animation:spinc 20s linear infinite;pointer-events:none}
@keyframes spinc{to{transform:translate(-50%,-50%) rotate(360deg)}}
.verdict>*:not(.vb){position:relative}
.verdict .sp{position:absolute;width:26px;height:26px;background:center/contain no-repeat;animation:twinkle 1.4s ease-in-out infinite}
.verdict .sp.a{left:16%;top:28%;background-image:var(--glint-red)}
.verdict .sp.b{right:14%;top:24%;background-image:var(--glint-aqua);animation-delay:.4s}
.verdict .sp.c{left:20%;top:62%;background-image:var(--glint-gold);animation-delay:.8s}
.verdict .sp.d{right:18%;top:66%;background-image:var(--glint-red);animation-delay:.2s}
.verdict .bl{position:absolute;width:90px;height:90px;background:center/contain no-repeat}
.verdict .bl.l{left:4%;top:36%;background-image:var(--bolt-red)}
.verdict .bl.r{right:4%;top:46%;background-image:var(--bolt-aqua);transform:scaleX(-1)}
@keyframes twinkle{50%{transform:scale(.4) rotate(45deg);opacity:.5}}
.toast{border-color:var(--crimson);box-shadow:0 0 16px rgba(226,54,79,.45)}


/* ===== 段階2：券・特権 ===== */
.card{background:rgba(255,255,255,.9);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tic{display:inline-flex;align-items:center;font-family:var(--disp);font-size:10.5px;line-height:1.5;padding:0 6px;border-radius:6px;border:1.5px solid var(--ink);white-space:nowrap}
.tic.n{background:var(--crimson);color:#fff;box-shadow:0 0 8px rgba(226,54,79,.45)}
.tic.s{background:var(--metal);color:var(--ink);box-shadow:0 0 8px rgba(232,177,42,.5)}
.rank .n .tic{margin-left:2px}
.tkrow{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1.5px solid var(--line)}
.tkrow:last-child{border-bottom:0}
.tkrow b{flex:1;min-width:0;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkrow .tkc{display:flex;align-items:center;gap:3px}
.tkrow .tkc+.tkc{margin-left:6px}
.tkrow .num{min-width:16px;text-align:center;font-size:16px}
.pm{width:26px;height:26px;border-radius:7px;border:2px solid var(--ink);background:#fff;font-weight:900;line-height:1;font-size:13px}
.pm:active{transform:translateY(2px)}
ul.plan{list-style:none;margin:0;padding:0}
ul.plan li{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:900;border-bottom:1px dashed var(--line)}
ul.plan li small{margin-left:auto;font-size:11px;color:var(--mute);font-weight:700}
.privcard{position:relative;display:flex;gap:12px;width:100%;text-align:left;align-items:flex-start;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:inset 6px 0 0 var(--c,var(--aqua))}
.privcard .pk,.todaypriv .pk,.privpick .pk{flex:none;display:grid;place-items:center;width:44px;height:44px;font-family:var(--disp);font-size:22px;color:var(--ink);background:var(--burst-glow-aqua) center/contain no-repeat;margin-left:4px}
.privcard .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.privcard .pb small{font-size:11px;font-weight:900;color:var(--mute)}
.privcard .pb b{font-weight:900}
.privcard .pb span{font-size:12px;color:var(--mute);font-weight:700}
.privcard .pb em{font-style:normal;font-size:12px;font-weight:900;color:#108C96}
.privcard .pa{display:flex;gap:6px;margin-top:6px}
.privcard.empty-p{border-style:dashed;background:rgba(255,255,255,.6);box-shadow:none}
.privcard.empty-p .pk{background-image:var(--burst-glow-gold)}
.todaypriv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:-6px 0 14px;padding:8px 12px;border-radius:12px;background:linear-gradient(100deg,#DDF7F9,#fff 70%);border:2px solid var(--ink)}
.todaypriv div{display:flex;flex-direction:column}
.todaypriv b{font-weight:900;font-size:14px}
.todaypriv span{font-size:12px;color:var(--mute);font-weight:700}
.todaypriv.ask{background:linear-gradient(100deg,#FFE7EA,#fff 70%);border-style:dashed}
.todaypriv.ask .pk{background-image:var(--burst-glow-gold)}
.privpick{display:flex;flex-direction:column;gap:8px}
.privpick button{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:#fff}
.privpick button span:last-child{display:flex;flex-direction:column}
.privpick button small{font-size:11.5px;color:var(--mute);font-weight:700}
.privpick button[aria-pressed="true"]{border-color:var(--ink);background:#FFF6D6;box-shadow:0 0 12px rgba(232,177,42,.5)}
.privpick button:disabled{opacity:.4}
.rres{display:flex;align-items:center;gap:12px}
.rres .num{font-size:52px;line-height:1;color:var(--crimson);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 0 10px rgba(226,54,79,.5))}
.rres small{display:block;font-size:12px;color:var(--mute);font-weight:700}
.rres div{font-weight:900}
.wheel{position:relative;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:200px;height:200px;margin:6px auto 0}
.wheel::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--burst-glow-gold) center/contain no-repeat;animation:spin 6s linear infinite}
.wheel .num{font-size:78px;line-height:1;color:var(--ink)}
.wheel small{font-weight:900}
.wheel .num.tick{animation:pop .12s}
.wheel .num.hitn{color:var(--crimson);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;font-size:96px}
@keyframes pop{from{transform:scale(1.35)}}
.predrow{display:grid;grid-template-columns:16px 1fr 110px;gap:4px 8px;align-items:center;padding:8px 0;border-bottom:1.5px solid var(--line)}
.predrow input{padding:8px 10px}
.predrow .pr{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-weight:700}
.predrow .pr:empty{display:none}
.stbl{width:100%;border-collapse:collapse;font-size:13px}
.stbl th{font-size:11px;color:var(--mute);font-weight:900;text-align:right;padding:6px 4px;border-bottom:2px solid var(--ink)}
.stbl th:first-child,.stbl td:first-child{text-align:left}
.stbl td{padding:8px 4px;border-bottom:1px solid var(--line);font-weight:900;text-align:right}
.stbl td .dot{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.stbl .num{font-size:14px}
.txrow{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:8px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:900}
.txrow span{display:inline-flex;align-items:center;gap:5px}
.txrow .dot{width:12px;height:12px}
.txrow .arrow{color:var(--crimson);font-family:var(--disp)}
.txrow b{margin-left:auto;font-size:17px}

/* じゃんけん画面：宣言 */
.astrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.astrip span{font-size:11.5px;font-weight:900;padding:3px 8px;border-radius:8px;background:#fff;border:1.5px solid var(--ink)}
.fighter .tics{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:18px}
.fighter.decl{min-height:0;display:flex;flex-direction:column}
.dstat{position:relative;z-index:1;margin-top:10px;font-family:var(--disp);font-size:15px;color:var(--mute)}
.dstat small{display:block;font-family:var(--body);font-size:11px;font-weight:900;color:var(--crimson)}
.dstat.ok{color:#108C96}
.dstat.wait{color:var(--crimson);animation:blink 1.2s steps(2,end) infinite}
@keyframes blink{50%{opacity:.35}}
.dbtns{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dbtns button{font-weight:900;font-size:12.5px;padding:8px 6px;border-radius:10px;border:2px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink)}
.dbtns button:active{transform:translateY(3px);box-shadow:none}
.dbtns button.n{background:var(--crimson);color:#fff}
.dbtns button.s{background:var(--metal);color:var(--ink)}
.dbtns button:disabled{opacity:.35;box-shadow:none}
.dbtns.big{margin:14px 0 4px}
.dbtns.big button{font-size:15px;padding:13px}
.flash{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95) 0,rgba(255,255,255,.75) 40%,rgba(255,255,255,0) 75%);animation:flashout 1.9s forwards}
.flash::before{content:"";position:absolute;left:50%;top:50%;width:min(110vw,560px);height:min(110vw,560px);transform:translate(-50%,-50%);background:var(--burst-glow-red) center/contain no-repeat;opacity:.45;animation:spinc 6s linear infinite;z-index:-1}
.flash b{font-family:var(--disp);font-weight:400;font-size:clamp(28px,9vw,44px);line-height:1.2;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 0 14px rgba(232,177,42,.8));animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
.flash span{font-weight:900;font-size:15px;max-width:90vw}
@keyframes flashout{0%,75%{opacity:1}100%{opacity:0}}


/* ===== わちゃわちゃ ===== */
.deco .fh{width:44px;height:44px;opacity:.5;animation:floaty var(--fd,6s) ease-in-out infinite}
.deco .f1{top:30%;left:-6px;background-image:var(--hand-guu);--fd:5.2s}
.deco .f2{top:56%;right:-4px;background-image:var(--hand-choki);--fd:6.4s;animation-delay:-2s}
.deco .f3{bottom:22%;left:8%;background-image:var(--hand-paa);--fd:7s;animation-delay:-4s;width:36px;height:36px}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-26px) rotate(14deg)}}
.deco .pt{bottom:-20px;width:var(--sz);height:var(--sz);background-image:var(--img);animation:rise var(--d) linear var(--dl) infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0) scale(.6);opacity:0}10%{opacity:.9}100%{transform:translateY(-105vh) rotate(360deg) scale(1.1);opacity:0}}
.marquee{position:relative;overflow:hidden;margin:-4px -16px 16px;padding:7px 0;background:var(--ink);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-1.5deg)}
.marquee .mq{display:flex;width:max-content;animation:mq 16s linear infinite}
.marquee span{display:inline-flex;align-items:center;gap:10px;padding-right:22px;font-family:var(--disp);font-size:15px;color:#fff;white-space:nowrap}
.marquee span:nth-child(3n+1) b{color:var(--gold)}
.marquee span:nth-child(3n+2) b{color:#FF5A6E}
.marquee span:nth-child(3n) b{color:#3FE0E8}
.marquee b{font-weight:400}
.marquee i{display:inline-block;width:26px;height:26px;background:center/contain no-repeat;animation:bob 1s ease-in-out infinite}
.marquee i.g{background-image:var(--hand-guu)}.marquee i.c{background-image:var(--hand-choki);animation-delay:.33s}.marquee i.p{background-image:var(--hand-paa);animation-delay:.66s}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-12deg)}}
.big{animation:wiggle 4.5s ease-in-out infinite}
@keyframes wiggle{0%,86%,100%{transform:skewX(-6deg)}89%{transform:skewX(-6deg) rotate(-2deg) scale(1.03)}92%{transform:skewX(-6deg) rotate(2deg) scale(1.03)}95%{transform:skewX(-6deg) rotate(-1deg)}}
.big:active{animation:none}
.big::before{animation:punch 1.6s ease-in-out infinite}
@keyframes punch{0%,100%{transform:skewX(6deg) rotate(-18deg) translateX(0)}50%{transform:skewX(6deg) rotate(-6deg) translateX(6px) scale(1.12)}}
.h2::before{animation:dspin 3.5s ease-in-out infinite}
@keyframes dspin{0%,70%{transform:rotate(45deg)}85%{transform:rotate(225deg) scale(1.2)}100%{transform:rotate(405deg)}}
.dayflag{animation:flagpop 2.4s ease-in-out infinite}
@keyframes flagpop{0%,80%,100%{transform:skewX(-8deg) scale(1)}88%{transform:skewX(-8deg) scale(1.15)}}
.rank.top{animation:topglow 2s ease-in-out infinite}
@keyframes topglow{50%{box-shadow:inset 6px 0 0 var(--c),0 0 34px rgba(232,177,42,.85)}}
.rank.top .a{animation:amtpulse 2s ease-in-out infinite}
@keyframes amtpulse{50%{transform:scale(1.06);text-shadow:0 0 12px rgba(232,177,42,.8)}}
.todaypriv .pk{position:relative;background:none!important;z-index:0}
.todaypriv .pk::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--burst-glow-aqua) center/contain no-repeat;animation:spin 10s linear infinite}
.todaypriv.ask .pk::before{background-image:var(--burst-glow-gold)}
.pend .chipbtn{animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:none}85%{transform:translateX(-3px) rotate(-3deg)}90%{transform:translateX(3px) rotate(3deg)}}

/* ===== 通知・リマインド ===== */
.remind{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:-4px 0 14px;border-radius:12px;background:linear-gradient(100deg,#FFF3D6,#fff 70%);border:2px solid var(--ink);animation:remindin .5s cubic-bezier(.2,1.5,.4,1) both}
.remind .ri{font-size:24px;animation:bob 1.4s ease-in-out infinite}
.remind div{flex:1;min-width:0;display:flex;flex-direction:column}
.remind b{font-weight:900;font-size:14px}
.remind div span{font-size:12px;color:var(--mute);font-weight:700}
@keyframes remindin{from{transform:translateY(-8px) scale(.96);opacity:0}}
.ntime{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1.5px solid var(--line);font-weight:900;font-size:13px}
.ntime input{width:auto;flex:none;-webkit-appearance:none;appearance:none;min-height:40px;padding:6px 10px}

/* ===== 段階3：集計・歴代 ===== */
.scope{margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.kpis div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;text-align:center}
.kpis small{display:block;font-size:11px;font-weight:900;color:var(--mute)}
.kpis b{font-size:18px}
.chartcard{padding:10px 8px 8px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart .grid{stroke:#E1E4EC;stroke-width:1}
svg.chart .zero{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
svg.chart .band{stroke:#C9CED9;stroke-width:1;stroke-dasharray:3 3}
svg.chart .ax{font-size:9.5px;font-weight:700;fill:var(--mute);font-family:var(--body)}
svg.chart .ln{filter:drop-shadow(0 0 3px rgba(255,255,255,.9))}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:900}
.legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--ink)}
.stack .srow{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:8px;margin-bottom:8px}
.stack .sn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack .sn i,.srank .nm i,.srow2 i,.ptbl i,.hw i,.vs i,.dotc{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.sbar{display:flex;height:20px;border-radius:5px;overflow:hidden;border:2px solid var(--ink);min-width:4px}
.sbar i{display:block;height:100%;border-right:1px solid rgba(27,24,56,.35)}
.stack b{font-size:13px}
.donut{display:flex;align-items:center;gap:12px}
.donut svg{width:150px;flex:none}
.donut .dc1{font-size:11px;font-weight:900;fill:var(--mute);font-family:var(--body)}
.donut .dc2{font-size:13px;fill:var(--ink);font-family:var(--disp)}
.donut .dl{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.donut .dl span{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900}
.donut .dl i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--ink)}
.donut .dl b{margin-left:auto;font-family:var(--disp);font-weight:400}
.sgroup{background:rgba(255,255,255,.9);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.sgt{font-family:var(--disp);font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sgt::before{content:"";width:16px;height:16px;background:var(--hand-choki) center/contain no-repeat}
.sgroup:nth-of-type(3n+1) .sgt::before{background-image:var(--hand-guu)}
.sgroup:nth-of-type(3n+2) .sgt::before{background-image:var(--hand-paa)}
.srank{padding:8px 0;border-top:1px dashed var(--line)}
.srank:first-of-type{border-top:0}
.srank .sl{font-size:12px;font-weight:900;color:var(--mute);margin-bottom:4px}
.sv{display:grid;grid-template-columns:18px 84px 1fr auto;align-items:center;gap:6px;font-size:12.5px;font-weight:900;margin:2px 0}
.sv .sp2{font-size:12px;text-align:center}
.sv .nm{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv .br{height:8px;border-radius:4px;background:#EEF0F5;overflow:hidden}
.sv .br i{display:block;height:100%;border-radius:4px}
.sv b{font-size:13px;min-width:62px;text-align:right}
.sv.best b{color:var(--crimson)}
details.sgroup>summary{list-style:none;cursor:pointer;margin-bottom:0}
details.sgroup>summary::-webkit-details-marker{display:none}
details.sgroup>summary::after{content:"＋";margin-left:auto;font-family:var(--body);font-weight:900;color:var(--mute)}
details.sgroup[open]>summary::after{content:"−"}
details.sgroup[open]>summary{margin-bottom:6px}
.vs{overflow-x:auto}
.vs table{border-collapse:collapse;font-size:12px;font-weight:900}
.vs th,.vs td{padding:6px 8px;border:1px solid var(--line);text-align:center;white-space:nowrap}
.vs th{background:#F6F7FA}
.rec{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.rec:first-of-type{border-top:0}
.rec span{color:var(--mute);font-weight:900;display:inline-flex;align-items:center;gap:5px}
.rec b{font-weight:900;text-align:right}
.honor{padding:4px 10px}
.hrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 2px;border-bottom:1.5px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hn{flex:none;width:34px;height:34px;display:grid;place-items:center;font-size:16px;background:var(--burst-glow-gold) center/contain no-repeat}
.hm{flex:1;min-width:0;display:flex;flex-direction:column}
.hm b{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm small{font-size:11px;color:var(--mute);font-weight:700}
.hw{display:flex;flex-direction:column;align-items:flex-end;font-weight:900;font-size:13px}
.hw small{font-size:12px;color:var(--mute)}
.hw i{display:none}
.hw.muted{color:var(--mute)}
.xlab{display:flex;justify-content:space-between;padding:0 10px 0 44px;font-family:var(--disp);font-size:10px;color:var(--mute)}
.ptbl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}
.ptbl div,.srow2{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px}
.ptbl b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptbl .r,.srow2 .r{width:18px;text-align:center;color:var(--mute);font-size:14px}
.season{box-shadow:inset 6px 0 0 var(--sc)}
.season .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.season .sh b{font-family:var(--disp);font-weight:400;font-size:17px;color:var(--ink);text-shadow:0 0 10px var(--sc)}
.season .sh small{font-size:11px;color:var(--mute);font-weight:700}
.srow2{padding:6px 0;border-top:1px dashed var(--line)}
.srow2 b{flex:1;min-width:0}
.srow2 small{font-size:11px;color:var(--mute);width:34px;text-align:right}
.jmap svg{display:block;width:100%;height:auto}
.jmap .tt{font-size:8.5px;font-weight:900;fill:#9AA1B4;font-family:var(--body)}
.jmap .tt.on{fill:var(--ink)}
.jmap .tc{font-size:8px;font-family:var(--disp);fill:var(--ink)}
.jmap .tl.on rect{animation:tilepop 3s ease-in-out infinite}
@keyframes tilepop{50%{opacity:.82}}

/* ===== 歴代（改） ===== */
.trophies{display:flex;flex-direction:column;gap:4px;padding:8px 2px 10px;border-bottom:2px solid var(--ink);margin-bottom:4px}
.trophies span{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px}
.trophies i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:var(--pc);flex:none}
.trophies b{min-width:84px}
.trophies em{font-style:normal;flex:1;letter-spacing:-1px}
.trophies small{color:var(--mute)}
.hw b{padding:2px 9px;border-radius:8px;border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 16%,#fff);font-weight:900}
.showall{display:block;width:100%;margin-top:6px;padding:8px;font-size:12.5px;font-weight:900;color:var(--ink);border-top:1.5px dashed var(--line)}
.mapf button.pc[aria-pressed="true"]{background:color-mix(in srgb,var(--pc) 24%,#fff);border-color:var(--ink)}
.jmap .tl{cursor:pointer}
.prefc{box-shadow:inset 6px 0 0 var(--sc)}
.prefc>b{display:block;font-weight:900}
.prefc>small{display:block;font-size:11px;color:var(--mute);font-weight:700;margin-bottom:4px}
.rules .rh{font-family:var(--disp);font-weight:400;font-size:17px;margin:18px 0 6px;padding:6px 10px;border-radius:8px;background:var(--ink);color:#fff}
.rules .rc{font-size:12px;font-weight:900;color:var(--mute);margin-top:12px}
.rules .ra{font-family:var(--disp);font-size:14px;margin-top:2px;color:#C98E12}
.rules .rp{margin:3px 0;font-size:14px;line-height:1.7}
.roster .rh2{font-family:var(--disp);font-size:15px;margin-bottom:4px}
.roster .rr{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px dashed var(--line);font-size:12.5px;font-weight:900}
.roster .rr .num{width:18px;text-align:center;color:var(--mute)}

.stdprice span{font-size:12px;font-weight:900;color:var(--mute)}
.stdprice b{font-size:18px}
.stdprice small{font-size:11px;color:var(--mute);font-weight:700}
.rank{grid-template-columns:46px minmax(0,1fr) auto auto}
.rank .n{min-width:0;flex-wrap:nowrap}
.rank .n .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .tk2{display:flex;flex-direction:column;gap:3px;align-items:stretch}
.rank .tk2 .tic{display:flex;justify-content:center;min-width:46px;font-size:10.5px;font-weight:400;gap:0}
.rank .m{grid-column:2/5}
.trip .tbtns{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.trip .tedit{display:none}
.mini.fin{background:var(--ink);color:#fff}
.trip .s:last-of-type{padding-right:0}
.trip{padding-bottom:52px}
.done-card{position:relative;margin:8px 0 18px;padding:18px 16px;border-radius:16px;background:rgba(255,255,255,.85);border:2px solid var(--ink);text-align:center}
.done-card small{font-size:12px;font-weight:900;color:var(--mute)}
.done-card .t{font-family:var(--disp);font-size:24px;margin:4px 0 12px}
.done-card .champ{display:inline-flex;flex-direction:column;align-items:center;padding:12px 26px;border-radius:14px;border:2.5px solid var(--ink);background:color-mix(in srgb,var(--c) 18%,#fff);box-shadow:0 0 24px color-mix(in srgb,var(--c) 70%,transparent)}
.done-card .champ span{font-weight:900;font-size:13px}
.done-card .champ b{font-family:var(--disp);font-weight:400;font-size:30px;color:var(--c);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.done-card .champ em{font-style:normal;font-family:var(--disp);font-size:18px}
.mini-rank{display:flex;flex-direction:column;gap:4px;margin:14px auto 0;max-width:300px}
.mini-rank span{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px}
.mini-rank i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink)}
.mini-rank em{margin-left:auto;font-style:normal}
.linkbtn{margin-top:12px;font-size:12px;font-weight:900;color:var(--mute);text-decoration:underline}
.warn{font-size:12.5px;font-weight:900;color:var(--crimson);background:#FFE7EA;border-radius:10px;padding:8px 10px}
.stickybar{position:sticky;top:calc(var(--safe-t) + 72px);z-index:15;margin:0 -16px 10px;padding:6px 16px 4px;background:linear-gradient(rgba(255,255,255,.97) 80%,rgba(255,255,255,0))}
.stickybar .filter{margin:0;padding:2px 0 6px}
.viewing{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:900;margin-bottom:6px;padding:6px 10px;border-radius:10px;background:#FFF6D6;border:1.5px solid var(--ink)}
.sortsw{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:4px}
.sortsw button{font-size:12px;font-weight:900;padding:5px 12px;background:#fff}
.sortsw button[aria-pressed="true"]{background:var(--ink);color:#fff}
.row.won{border:2px solid var(--pc);box-shadow:inset 5px 0 0 var(--pc)}
.btn.solo{flex:1.3;background:#fff;color:var(--ink);border-color:var(--aqua);box-shadow:0 4px 0 var(--aqua)}
.btn.solo.on{background:var(--aqua);color:#fff}
.solohint{color:#108C96}
.abar .btn{padding:12px 0;font-size:13px}
.sl small{font-size:10.5px;margin-left:6px;color:var(--crimson)}

/* ---------- データ ---------- */
async function loadTable(t){
  const { data, error } = await sb.from(t).select("*");
  if (error && t === "neu_games"){ db[t] = []; return; }  // NEUのテーブルが未作成でもアプリは動かす
  if (error) throw error;
  db[t] = data || [];
}
async function loadAll(){
  await Promise.all(TABLES.map(loadTable));
  loaded = true;
}
let reloadTimer = {};
function subscribe(){
  sb.channel("ojk-all")
    .on("postgres_changes", { event: "*", schema: "public" }, payload => {
      const t = payload.table;
      if (!TABLES.includes(t)) return;
      clearTimeout(reloadTimer[t]);
      reloadTimer[t] = setTimeout(async () => {
        try { await loadTable(t); render(); if (t === "jankens") syncArena(); if (t === "neu_games") drawNeu(); } catch (e) { console.error(e); }
      }, 120);
    })
    .subscribe();
}
async function q(promise, what){
  const { data, error } = await promise;
  if (error){ fail(error, what); return null; }
  return data ?? true;
}
async function putSetting(key, value){
  return q(sb.from("app_settings").upsert({ key, value }), "保存");
}

/* ---------- 集計（ホームの序列） ---------- */
function standings(t){
  const pays = tripPays(t).filter(p => p.payer_id);
  const rows = (t ? t.members : []).map(id => ({ id, paid: 0, std: 0, wins: 0, joins: 0, drives: 0 }));
  const by = Object.fromEntries(rows.map(r => [r.id, r]));
  pays.forEach(p => {
    const parts = p.participants || [];
    parts.forEach(id => { if (by[id]){ by[id].joins++; by[id].std += p.amount / parts.length; } });
    if (by[p.payer_id]){ by[p.payer_id].paid += p.amount; by[p.payer_id].wins++; }
  });
  db.drives.filter(d => t && d.trip_id === t.id).forEach(d => { if (by[d.player_id]) by[d.player_id].drives++; });
  const out = t ? t.champion_out : null;
  rows.sort((a, b) => (a.id === out) - (b.id === out) || b.paid - a.paid);
  let rank = 0, prev = null;
  rows.forEach((r, i) => { if (r.id === out){ r.rank = "–"; return; } if (r.paid !== prev){ rank = i + 1; prev = r.paid; } r.rank = rank; });
  return rows;
}

      <span class="q ${multi ? "qt" : ""}">${multi ? tripTag(p) : p.seq}</span><span class="l">${esc(p.label)}</span><span class="a">${yen(p.amount)}</span>
      <span class="m"><span class="tag">${esc(p.category)}</span>${p.payer_id ? `<span class="who"><span class="dot" style="background:${pcolor(p.payer_id)}"></span>${esc(pname(p.payer_id))}</span>` : `<span style="color:var(--crimson)">未決着</span>`}<span>${(p.participants || []).length}人</span></span>
    </button>`).join("");
  const drives = db.drives.filter(d => trips.some(x => x.id === d.trip_id)).sort((a, b) => a.created_at.localeCompare(b.created_at));
  h += `<div class="h2 aqua">運転の記録<small>${drives.length}回・記録した時間順</small></div>`;
  h += drives.length ? drives.map(d => `<div class="plist"><span class="dot" style="background:${pcolor(d.player_id)}"></span><b>${esc(pname(d.player_id))}</b><span class="note" style="margin:0">${multi ? `第${(db.trips.find(x => x.id === d.trip_id) || {}).no}回・` : ""}${d.source === "import" ? "過去データ" : fmtTime(d.created_at)}</span><button class="mini" data-deldrive="${d.id}">削除</button></div>`).join("") : `<div class="note">ホームの「運転」から記録します。</div>`;
  return h;
}

/* ---------- 自分 ---------- */
/* 端末ごとのログイン：同じプレイヤーを複数の端末で同時に使えないようにする */
const DEVICE = localStorage.getItem("ojk:device") || (() => { const d = crypto.randomUUID(); localStorage.setItem("ojk:device", d); return d; })();
const claims = () => setting("claims") || {};
const claimedByOther = id => { const c = claims()[id]; return !!(c && c.device !== DEVICE); };
async function writeClaim(id){
  await loadTable("app_settings");
  if (id && claimedByOther(id)){ toast(`${pname(id)}は別の端末で使用中です`, 3000); return false; }
  const c = { ...claims() };
  Object.keys(c).forEach(k => { if (c[k] && c[k].device === DEVICE) delete c[k]; });
  if (id) c[id] = { device: DEVICE, at: new Date().toISOString() };
  const ok = await putSetting("claims", c);
  if (ok) await loadTable("app_settings");
  return ok;
}
async function syncPushOwner(){
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (!sub) return;
    if (me) await sb.from("push_subs").update({ player_id: me }).eq("endpoint", sub.endpoint);
    else { await sb.from("push_subs").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
  } catch (e) { console.error(e); }
}
let claimChecking = false;
async function checkClaim(){
  if (claimChecking || !loaded || !me) return;
  const c = claims()[me];
  if (c && c.device === DEVICE) return;
  claimChecking = true;
  if (c && c.device !== DEVICE){
    const name = pname(me);
    me = ""; localStorage.removeItem("ojk:me"); render();
    toast(`${name}は別の端末で使用中のため、ログアウトしました`, 3500);
  } else if (player(me)) await writeClaim(me);
  claimChecking = false;
}
/* ---------- オーナー（ごめ）のパスワード ---------- */
async function pinHash(pin){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ojk-owner:" + pin));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
const pinOk = p => /^[A-Za-z0-9 ]{4,16}$/.test(p) && /[A-Za-z0-9]/.test(p);  // 英数字とスペース（前後のスペースもそのまま使う）
function askOwnerPin(onOk){
  const has = !!setting("owner_pin");
  const s = openSheet("オーナー認証", `<p class="note">${has ? `オーナー（${esc(pname(hostId()))}）のパスワードを入力してください。` : "はじめてなので、オーナー用のパスワード（英数字とスペースで4〜16文字）を決めてください。スペースも1文字として数えます。"}</p>
    <label class="f"><span>パスワード</span><input id="pin1" type="password" maxlength="16" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"></label>
    ${has ? "" : `<label class="f"><span>確認のため、もう一度</span><input id="pin2" type="password" maxlength="16" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"></label>`}
    <div class="btns"><button class="btn ghost" id="pinBack">戻る</button><button class="btn" id="pinGo">${has ? "認証する" : "設定してログイン"}</button></div>`);
  $("#pinBack").onclick = openMe;
  setTimeout(() => $("#pin1").focus(), 250);
  $("#pinGo").onclick = async () => {
    const p1 = $("#pin1").value;
    if (!pinOk(p1)){ toast("英数字とスペースで4〜16文字にしてください（英数字を1文字以上含めてください）", 3200); return; }
    await loadTable("app_settings");
    if (setting("owner_pin")){
      if ((await pinHash(p1)) !== setting("owner_pin")){ toast("パスワードが違います", 2600); $("#pin1").value = ""; return; }
    } else {
      if (p1 !== $("#pin2").value){ toast("2回の入力が一致しません"); return; }
      if (!(await putSetting("owner_pin", await pinHash(p1)))) return;
      await loadTable("app_settings");
    }
    onOk();
  };
}
function openPinChange(){
  const s = openSheet("パスワードを変更", `<label class="f"><span>今のパスワード</span><input id="pc0" type="password" maxlength="16" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="f"><span>新しいパスワード（英数字とスペースで4〜16文字）</span><input id="pc1" type="password" maxlength="16" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="f"><span>確認のため、もう一度</span><input id="pc2" type="password" maxlength="16" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <div class="btns"><button class="btn ghost" id="pcBack">戻る</button><button class="btn" id="pcGo">変更する</button></div>`);
  $("#pcBack").onclick = openMe;
  $("#pcGo").onclick = async () => {
    await loadTable("app_settings");
    if (setting("owner_pin") && (await pinHash($("#pc0").value)) !== setting("owner_pin")){ toast("今のパスワードが違います"); return; }
    const p = $("#pc1").value;
    if (!pinOk(p)){ toast("英数字とスペースで4〜16文字にしてください（英数字を1文字以上含めてください）", 3200); return; }
    if (p !== $("#pc2").value){ toast("2回の入力が一致しません"); return; }
    if (await putSetting("owner_pin", await pinHash(p))){ await loadTable("app_settings"); toast("パスワードを変更しました"); openMe(); }
  };
}
function openMe(){
  if (!db.players.length){ openPlayers(); return; }
  const cl = claims(), isHost = !!me && me === hostId();
  const s = openSheet("この端末の自分", `<p class="note">この端末を使う人を選んでください。1人のプレイヤーは1台の端末でしか使えません。</p>
    <div class="chips">${db.players.map(p => { const other = claimedByOther(p.id); return `<button type="button" class="pc" style="--pc:${p.color}" data-p="${p.id}" aria-pressed="${p.id === me}" ${other ? "disabled" : ""}><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${other ? `<small class="inuse">使用中</small>` : ""}</button>`; }).join("")}</div>
    ${isHost && Object.keys(cl).some(id => claimedByOther(id)) ? `<div class="card hostc" style="margin-top:12px"><b class="hc">オーナー：ログインの解除</b><p class="note" style="margin:2px 0 6px">端末をなくしたときなどに、別の端末のログインを解除できます。</p>${Object.keys(cl).filter(id => claimedByOther(id) && player(id)).map(id => `<div class="plist"><span class="dot" style="background:${pcolor(id)}"></span><b>${esc(pname(id))}</b><button class="mini" data-release="${id}">解除</button></div>`).join("")}</div>` : ""}
    <div class="btns"><button class="btn ghost" data-back>戻る</button>${me ? `<button class="btn danger" id="meOut">ログアウト</button>` : ""}<button class="btn" id="meOk">決定</button></div>
    ${isHost ? `<button class="linkbtn" id="pinChange">オーナーのパスワードを変更</button>` : `<p class="note" style="margin-top:10px">オーナー（${esc(pname(hostId()) || "ごめ")}）を選ぶときだけ、パスワードの入力が必要です。</p>`}`);
  s.querySelector("[data-back]").onclick = openSettings;
  bindChips(s, "data-p", false);
  const login = async id => {
    if (!(await writeClaim(id))) return;
    me = id; localStorage.setItem("ojk:me", id); syncPushOwner(); closeSheet(); render(); toast(`${pname(id)}として使います`);
  };
  $("#meOk").onclick = async () => {
    const [id] = picked(s, "data-p"); if (!id) return;
    if (id === me){ closeSheet(); return; }
    if (claimedByOther(id)){ toast(`${pname(id)}は別の端末で使用中です`, 3000); return; }
    if (id === hostId()) return askOwnerPin(() => login(id));
    login(id);
  };
  const pc = s.querySelector("#pinChange"); if (pc) pc.onclick = openPinChange;
  const out = s.querySelector("#meOut");
  if (out) out.onclick = async () => {
    if (!confirm(`${pname(me)}からログアウトしますか？\nこの端末の通知も止まります。`)) return;
    if (!(await writeClaim(null))) return;
    me = ""; localStorage.removeItem("ojk:me"); await syncPushOwner(); closeSheet(); render(); toast("ログアウトしました");
  };
  s.querySelectorAll("[data-release]").forEach(b => b.onclick = async () => {
    const id = b.dataset.release;
    if (!confirm(`${pname(id)}のログインを解除しますか？`)) return;
    await loadTable("app_settings");
    const c = { ...claims() }; delete c[id];
    if (await putSetting("claims", c)){ await loadTable("app_settings"); toast(`${pname(id)}のログインを解除しました`); openMe(); }
  });
}

const PLACE_ALIAS = { ソウル: "韓国", 釜山: "韓国", プサン: "韓国", 済州島: "韓国", ホノルル: "ハワイ", オアフ島: "ハワイ", ワイキキ: "ハワイ", 函館: "北海道", 札幌: "北海道", 小樽: "北海道", 屋久島: "鹿児島", 奄美: "鹿児島", 石垣: "沖縄", 宮古島: "沖縄", 那覇: "沖縄", 金沢: "石川", 仙台: "宮城", 名古屋: "愛知", 横浜: "神奈川", 博多: "福岡", 別府: "大分", 箱根: "神奈川", 軽井沢: "長野", 伊勢: "三重", 日光: "栃木" };
function parsePrefs(place){
  const out = [];
  String(place || "").split(/[・、,，\/／\s（）()]+/).map(x => x.trim()).filter(Boolean).forEach(w => {
    const k = w.replace(/(都|府|県)$/, "");
    const p = PREFS.includes(k) ? k : PREFS.includes(w) || ABROAD.includes(w) ? w : PLACE_ALIAS[w] || PLACE_ALIAS[k];
    if (p && !out.includes(p)) out.push(p);
  });
  return out;
}

const nextSeq = t => tripPays(t).reduce((m, p) => Math.max(m, p.seq), 0) + 1;

async function createJanken(base, opts = {}){
  const t = db.trips.find(x => x.id === base.trip_id);
  const out4 = priv4Out(t, base.amount);
  let parts = base.participants;
  if (out4 && parts.includes(out4)){ parts = parts.filter(id => id !== out4); toast(`特権四：${pname(out4)}は不参加です`, 2600); }
  if (parts.length < 2){ toast("参加者が2人未満になりました"); return null; }
  const lives = {};
  parts.forEach(id => { lives[id] = opts.priv3 && id !== opts.priv3 ? 2 : 1; });
  const holders = parts.filter(id => tcount(t, id) > 0);
  const needDeclare = base.amount >= threshold() && holders.length > 0;
  const declare = needDeclare ? Object.fromEntries(parts.map(id => [id, holders.includes(id) ? null : "none"])) : {};
  const row = { ...base, participants: parts, lives, max_lives: lives, history: [], status: "live", started_by: me || null,
    phase: needDeclare ? "declare" : "play", declare, proxy: {}, exempt: [], exempt_done: [], supers: [], tickets_used: [], priv3_by: opts.priv3 || null };
  const res = await q(sb.from("jankens").insert(row).select().single(), "開始");
  if (res && needDeclare) pushCall({ type: "declare", janken_id: res.id });
  if (res && opts.priv3){
    const p = privOf(t, 3);
    await q(sb.from("privileges").update({ uses: (p.uses || 0) + 1, uses_detail: [...(p.uses_detail || []), travelType(base.category)] }).eq("id", p.id), "記録");
    await loadTable("privileges");
  }
  if (res){ await loadTable("jankens"); render(); }
  return res;
}
function bindPriv3(s, t, getCat){
  let on = false;
  const box = s.querySelector("#p3box");
  const refresh = () => {
    const p = privOf(t, 3);
    if (!p || !box){ if (box) box.innerHTML = ""; return; }
    const type = travelType(getCat()), used = p.uses_detail || [];
    const can = (p.uses || 0) < 2 && !used.includes(type);
    if (!can) on = false;
    box.innerHTML = `<div class="toggle"><div>特権三：${esc(pname(p.player_id))}以外に一機追加<small>${can ? `${type}枠で使えます（残り${2 - (p.uses || 0)}回）` : `${type}枠は使用済みです`}</small></div><button type="button" class="sw" id="p3sw" role="switch" aria-checked="${on}" ${can ? "" : "disabled"} aria-label="特権三を使う"></button></div>`;
    const sw = box.querySelector("#p3sw");
    sw.onclick = () => { on = !on; sw.setAttribute("aria-checked", String(on)); };
  };
  refresh();
  return { refresh, on: () => on ? privOf(t, 3).player_id : null };
}

/* 宿泊費のじゃんけん前に、その日のルーレットのsuper免除券が付与されているか確認（第十四条） */
function rouletteGuard(t, cat, go){
  const d = dayOf(t);
  if (cat !== "宿" || !d) return go();
  const granted = db.tickets.some(x => x.trip_id === t.id && (x.source || "").startsWith(`ルーレット：${d}日目`));
  if (granted) return go();
  const rk = setting(`roulette:${t.id}:${d}`), holder = rk ? rankHolder(t, rk) : null;
  const s = openSheet("super免除券の付与がまだです", `<p class="note">宿泊費のじゃんけんの前に、${d}日目のルーレットで決まった順位の人へsuper免除券を付与します（第十四条）。付与するまで、宿泊費のじゃんけんは始められません。</p>
    ${rk ? `<div class="rres"><span class="num">${rk}</span><div>位が獲得<small>今の${rk}位：${holder ? esc(pname(holder)) : "該当なし"}</small></div></div>` : ""}
    <div class="btns">${rk ? `<button class="btn" id="rgG" ${holder ? "" : "disabled"}>付与してから始める</button>` : `<button class="btn" id="rgR">ルーレットを回す</button>`}</div>`);
  const r = s.querySelector("#rgR"); if (r) r.onclick = () => openRoulette(t, d, () => rouletteGuard(t, cat, go));
  const g = s.querySelector("#rgG"); if (g) g.onclick = async () => {
    if (await q(sb.from("tickets").insert({ trip_id: t.id, player_id: holder, kind: "super", source: `ルーレット：${d}日目・${rk}位` }), "付与")){
      await loadTable("tickets"); flash("super免除券 獲得！", pname(holder)); go();
    }
  };
}

/* ---------- じゃんけん：進行 ---------- */
let arenaId = null, busy = false;
function openArena(id){ arenaId = id; $("#arena").hidden = false; document.body.style.overflow = "hidden"; drawArena(); }
function closeArena(){ arenaId = null; $("#arena").hidden = true; document.body.style.overflow = ""; render(); }
const seenReset = {}, seenPhase = {};
function syncArena(){
  if (!arenaId) return;
  const j = jById(arenaId);
  if (!j || j.status !== "live"){ closeArena(); if (j && j.status === "done") toast(`決着：${pname(j.payer_id)}が支払い`); return; }
  const n = (j.exempt_done || []).length;
  if (seenReset[j.id] !== undefined && n > seenReset[j.id]) flash(`${pname(j.exempt_done[n - 1])}の免除券発動！`, "やり直し");
  seenReset[j.id] = n;
  if (seenPhase[j.id] && seenPhase[j.id] !== "play" && j.phase === "play"){
    const u = j.tickets_used || [];
    flash("一斉オープン！", u.length ? u.map(x => `${pname(x.pid)}：${x.kind === "super" ? "super免除券" : "免除券"}`).join("　") : "誰も使いませんでした");
  }
  seenPhase[j.id] = j.phase;
  drawArena();
}
function flash(big, small){

  el.innerHTML = `<b>${esc(big).split("\n").map(x => `<span class="fl">${x}</span>`).join("")}</b><span>${esc(small || "")}</span>`;
  document.body.appendChild(el);

const declStatus = (j, id) => {
  const v = (j.declare || {})[id];
  if (v === undefined || v === "none") return (j.declare || {})[id] === "none" && j.phase === "declare" ? "nonholder" : "none";
  return v === null ? "pending" : "done";
};
function drawArena(){
  const j = jById(arenaId); if (!j) return closeArena();
  const t = tripOfJ(j);
  seenReset[j.id] = seenReset[j.id] ?? (j.exempt_done || []).length;
  seenPhase[j.id] = seenPhase[j.id] || j.phase;
  const supers = j.supers || [], exempt = j.exempt || [], exDone = j.exempt_done || [];
  const alive = j.participants.filter(id => (j.lives[id] || 0) > 0);
  const phase = j.phase || "play";
  const declared = Object.keys(j.declare || {}).length > 0 || (j.tickets_used || []).length > 0;
  const done = phase === "play" && alive.length === 1;
  const p1 = privOf(t, 1), p5 = privOf(t, 5);
  const a = $("#arena");
  let hint, cards, bar;
  if (phase === "declare"){
    const pend = j.participants.filter(id => j.declare[id] === null).length;
    hint = `<span class="h2l"><b>免除券の宣言</b><span>残り <b class="num">${pend}</b> 人がそろうと一斉オープン</span></span>`;
    cards = j.participants.map(id => {
      const st = j.declare[id];
      const hasN = tcount(t, id, "normal"), hasS = tcount(t, id, "super");
      let body;
      if (st === "none" && !(hasN || hasS)) body = `<div class="dstat">券なし</div>`;
      else if (st !== null) body = `<div class="dstat ok">宣言済み${j.proxy && j.proxy[id] ? `<small>${j.proxy[id] === "特権五" ? "特権五で強制" : `代理：${esc(pname(j.proxy[id]))}`}</small>` : ""}</div>`;
      else if (id === me) body = `<div class="dbtns"><button data-dec="${id}|none">使わない</button><button class="n" data-dec="${id}|normal" ${hasN ? "" : "disabled"}>免除券を使う（${hasN}）</button><button class="s" data-dec="${id}|super" ${hasS ? "" : "disabled"}>superを使う（${hasS}）</button></div>`;

    }).join("");
    bar = `${p5 && j.participants.includes(p5.player_id) && (p5.uses || 0) < 6 ? `<button class="btn" id="aForce">特権五</button>` : ""}<button class="btn ghost" id="aMin">閉じる</button><button class="btn danger" id="aStop">中止</button>`;
  } else if (phase === "conflict"){
    const c = (j.conflict && j.conflict.cands) || [];
    const cp1 = j.conflict && j.conflict.p1u;
    hint = `<span class="h2l"><span class="dup"><b>重複！</b>じゃんけんの勝者をタップ</span>${cp1 && c.some(u => u.pid === cp1.pid) ? `<span style="font-size:12px">特権一：${esc(pname(cp1.pid))}は負けても使えます</span>` : ""}</span>`;
    cards = c.map(u => `<button class="fighter" data-win="${u.pid}|${u.kind}" style="--c:${pcolor(u.pid)}"><i class="gem"></i><div class="fn">${esc(pname(u.pid))}</div><div class="dstat ok">${u.kind === "super" ? "super免除券" : "免除券"}</div><div class="st">勝ったらタップ</div></button>`).join("");

    cards = j.participants.map(id => {
      const l = j.lives[id] || 0, m = j.max_lives[id] || 1, isS = supers.includes(id);
      const badge = isS ? `<span class="tic s">super使用</span>` : exempt.includes(id) ? `<span class="tic n">${exDone.includes(id) ? "免除券 発動済み" : "免除券 使用中"}</span>` : "";
      const pills = ticketPills(t, id, declared || j.history.length > 0);
      return `<button class="fighter ${l <= 0 ? "out" : ""}" data-f="${id}" style="--c:${pcolor(id)}" ${l <= 0 || done ? "disabled" : ""}>
        <i class="gem"></i><div class="fn">${esc(pname(id))}</div><div class="tics">${badge || pills}</div>
        <div class="lives">${isS ? "" : Array.from({length: m}, (_, i) => `<i class="${i < l ? "" : "lost"}"></i>`).join("")}</div>
        <div class="st">${l > 0 ? `残機 ${l}` : ""}</div>${l <= 0 ? `<span class="stamp">${isS ? "免除" : "抜け"}</span>` : ""}</button>`;
    }).join("");
    const canUse = !declared && !j.history.length && !done && j.participants.some(id => !supers.includes(id) && tcount(t, id) > 0);
    bar = `<button class="btn ghost" id="aUndo" ${j.history.length ? "" : "disabled"}>戻す</button><button class="btn ghost" id="aUse" ${canUse ? "" : "disabled"}>券</button><button class="btn ghost" id="aMin">閉じる</button><button class="btn danger" id="aStop">中止</button>`;
  }
  const used = j.tickets_used || [];
  const strip = [
    j.priv3_by ? `<span class="pstr" style="--pc:${pcolor(j.priv3_by)}">特権三：${esc(pname(j.priv3_by))}以外は2機</span>` : "",
    used.length ? `宣言オープン：${used.map(u => `${esc(pname(u.pid))}＝${u.kind === "super" ? "super" : "免除券"}`).join("、")}` : (phase === "play" && Object.keys(j.declare || {}).length ? "宣言オープン：使用者なし" : ""),
    p1 && j.participants.includes(p1.player_id) ? `<span class="pstr" style="--pc:${pcolor(p1.player_id)}">特権一：${esc(pname(p1.player_id))}は重ねて使用可</span>` : ""
  ].filter(Boolean);
