<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="男気じゃんけん旅">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<title>男気じゃんけん旅</title>
<style>
:root{
  --ink:#1B1838; --paper:#F1F2F6; --card:#FFFFFF; --line:#D3D8E3; --mute:#69708A;
  --gold:#E8B12A; --crimson:#E2364F; --aqua:#1FB3BF;
  --metal:linear-gradient(135deg,#FFF1B8 0%,#E8B12A 38%,#FFE38A 62%,#B9821A 100%);
  --disp:"Dela Gothic One","Hiragino Kaku Gothic StdN","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.55;
  background:linear-gradient(165deg,#FFFFFF 0%,#F1F2F6 45%,#D2D7E2 100%) fixed}
/* 背景：中央からの放射光と、四隅のドット */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:repeating-conic-gradient(from 3deg at 50% 22%,rgba(243,206,110,.16) 0 6.4deg,transparent 6.4deg 12.8deg);
  -webkit-mask-image:radial-gradient(circle at 50% 22%,#000 0,#000 30%,transparent 85%);mask-image:radial-gradient(circle at 50% 22%,#000 0,#000 30%,transparent 85%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,rgba(110,120,148,.42) 1.4px,transparent 1.8px) 0 0/11px 11px;
  -webkit-mask-image:radial-gradient(circle at 0 0,#000,transparent 150px),radial-gradient(circle at 100% 0,#000,transparent 150px),radial-gradient(circle at 0 100%,#000,transparent 170px),radial-gradient(circle at 100% 100%,#000,transparent 170px);
  mask-image:radial-gradient(circle at 0 0,#000,transparent 150px),radial-gradient(circle at 100% 0,#000,transparent 150px),radial-gradient(circle at 0 100%,#000,transparent 170px),radial-gradient(circle at 100% 100%,#000,transparent 170px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,177,42,.2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--disp);font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums}

/* ---------- 枠 ---------- */
header{position:sticky;top:0;z-index:20;padding:calc(var(--safe-t) + 10px) 16px 12px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(255,255,255,.96) 65%,rgba(255,255,255,0))}
.logo{font-family:var(--disp);font-size:20px;line-height:1;letter-spacing:.02em;color:var(--ink);text-shadow:0 0 14px rgba(232,177,42,.55)}
.logo small{display:block;font-family:var(--body);font-size:11px;color:var(--mute);font-weight:700;margin-top:6px;letter-spacing:0;text-shadow:none}
header .sp{flex:1}
.me{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;padding:5px 11px 5px 5px;border-radius:99px;background:#fff;border:2px solid var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.gear{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.gear:active{transform:translateY(3px);box-shadow:none}
main{padding:4px 16px calc(var(--safe-b) + 100px);max-width:560px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:2px solid var(--ink);padding:6px 4px calc(var(--safe-b) + 6px)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:900;color:var(--mute);padding:6px 0}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] svg{color:#C98E12;filter:drop-shadow(0 0 6px rgba(232,177,42,.8))}
nav button[aria-current="page"]::before{content:"";position:absolute;top:-8px;left:30%;right:30%;height:4px;border-radius:0 0 4px 4px;background:var(--metal)}

/* ---------- 共通の飾り：金の角飾り ---------- */
.framed{position:relative}
.framed::before,.framed::after{content:"";position:absolute;width:26px;height:26px;pointer-events:none}
.framed::before{top:-5px;left:-5px;border-top:4px solid var(--gold);border-left:4px solid var(--gold);border-radius:4px 0 0 0}
.framed::after{bottom:-5px;right:-5px;border-bottom:4px solid var(--gold);border-right:4px solid var(--gold);border-radius:0 0 4px 0}

/* ---------- ホーム ---------- */
.trip{margin:8px 0 18px;padding:16px 16px 14px;border-radius:16px;background:rgba(255,255,255,.75);border:2px solid var(--ink)}
.trip .t{font-family:var(--disp);font-size:25px;line-height:1.2}
.trip .s{color:var(--mute);font-size:13px;font-weight:700;margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dayflag{display:inline-block;background:var(--metal);color:var(--ink);font-family:var(--disp);font-size:13px;padding:2px 10px;border-radius:6px;border:2px solid var(--ink);transform:skewX(-8deg)}
.live{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:14px;border-radius:14px;background:linear-gradient(120deg,#FF5A6E,var(--crimson) 55%,#A8122A);color:#fff;border:2px solid var(--ink);box-shadow:0 0 0 0 rgba(226,54,79,.5);animation:pulse 1.6s ease-in-out infinite}
.live b{font-family:var(--disp);font-weight:400;font-size:16px}
.live span{font-size:12px;opacity:.95}
@keyframes pulse{50%{box-shadow:0 0 22px 4px rgba(226,54,79,.45)}}
.acts{display:grid;grid-template-columns:1fr 94px;gap:12px;margin-bottom:22px}
.big{position:relative;overflow:hidden;font-family:var(--disp);font-size:23px;padding:18px 0;border-radius:16px;background:var(--metal);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink),0 0 24px rgba(232,177,42,.55);transform:skewX(-6deg)}
.big>span{display:inline-block;transform:skewX(6deg)}
.big::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-40%}100%{left:130%}}
.big:active{transform:skewX(-6deg) translateY(5px);box-shadow:0 0 0 var(--ink),0 0 24px rgba(232,177,42,.55)}
.sub{font-family:var(--disp);font-size:16px;border-radius:16px;background:#fff;border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink),0 0 18px rgba(31,179,191,.35)}
.sub:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.h2{font-family:var(--disp);font-size:17px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
.h2::before{content:"";align-self:center;width:12px;height:12px;background:var(--metal);border:2px solid var(--ink);transform:rotate(45deg);flex:none}
.h2 small{font-family:var(--body);font-size:12px;color:var(--mute);font-weight:700}
.rank{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:4px 10px;padding:12px 14px 12px 8px;border-radius:14px;background:#fff;margin-bottom:10px;border:2px solid var(--ink);box-shadow:inset 6px 0 0 var(--c,var(--line))}
.rank .r{font-family:var(--disp);font-size:30px;text-align:center;line-height:1;color:#A3A9BA;padding-left:4px}
.rank.top{background:linear-gradient(105deg,#FFF6D6,#fff 60%);box-shadow:inset 6px 0 0 var(--c),0 0 22px rgba(232,177,42,.55)}
.rank.top .r{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 var(--ink)) drop-shadow(0 0 8px rgba(232,177,42,.7))}
.rank .n{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px}
.rank .n .mine{font-size:10px;font-weight:900;padding:1px 6px;border-radius:5px;background:var(--aqua);color:#fff}
.rank .a{font-family:var(--disp);font-size:21px;text-align:right}
.rank .m{grid-column:2/4;font-size:12px;color:var(--mute);font-weight:700;display:flex;flex-wrap:wrap;gap:2px 12px}
.plus{color:var(--crimson)}.minus{color:#108C96}
.pend{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:2px dashed #9AA1B4;background:rgba(255,255,255,.6);margin-bottom:8px}
.pend .l{flex:1;min-width:0}
.pend .l b{display:block;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pend .l span{font-size:12px;color:var(--mute);font-weight:700}
.chipbtn{flex:none;font-family:var(--disp);font-size:13px;padding:7px 12px;border-radius:10px;background:var(--crimson);color:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.chipbtn:active{transform:translateY(3px);box-shadow:none}

/* ---------- 一覧 ---------- */
.row{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;padding:11px 10px 11px 4px;border-radius:12px;background:rgba(255,255,255,.7);margin-bottom:6px;border:1.5px solid var(--line)}
.row .q{font-family:var(--disp);font-size:13px;color:#A3A9BA;text-align:center}
.row .l{font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{font-family:var(--disp);font-size:16px;text-align:right}
.row .m{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-weight:700}
.tag{font-size:11px;font-weight:900;padding:1px 7px;border-radius:5px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.tag.gold{background:var(--metal);border-color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.who .dot{width:11px;height:11px;border-width:1.5px}
.filter{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:2px 16px 8px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;font-size:12px;font-weight:900;padding:6px 12px;border-radius:99px;background:#fff;border:2px solid var(--line)}
.filter button[aria-pressed="true"]{background:var(--metal);border-color:var(--ink)}
.empty{text-align:center;color:var(--mute);font-weight:700;padding:36px 14px;border:2px dashed #9AA1B4;border-radius:16px;background:rgba(255,255,255,.6)}
.empty b{display:block;font-family:var(--disp);font-weight:400;color:var(--ink);font-size:19px;margin-bottom:6px}
.soon{text-align:center;padding:60px 16px;color:var(--mute);font-weight:700}
.soon b{display:block;font-family:var(--disp);font-weight:400;font-size:26px;color:var(--ink);margin-bottom:8px;text-shadow:0 0 16px rgba(232,177,42,.6)}

/* ---------- シート ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(27,24,56,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .in{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:linear-gradient(170deg,#fff,#F1F2F6);border-radius:22px 22px 0 0;border:2.5px solid var(--ink);border-bottom:0;padding:20px 18px calc(var(--safe-b) + 20px);transform:translateY(30px);transition:transform .22s}
.sheet .in::before{content:"";position:absolute;top:8px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:var(--metal)}
.sheet.on .in{transform:none}
.sheet h3{font-family:var(--disp);font-weight:400;font-size:21px;margin:6px 0 14px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;font-family:var(--body);font-size:13px;color:var(--mute);font-weight:700;padding:6px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12px;font-weight:900;color:var(--mute);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:13px;padding:8px 12px;border-radius:10px;background:#fff;border:2px solid var(--line)}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:#FFF6D6;box-shadow:0 0 12px rgba(232,177,42,.5)}
.chips button[aria-pressed="false"]{color:var(--mute)}
.chips button[aria-pressed="false"] .dot{opacity:.35}
.chips button:disabled{opacity:.4}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:#fff;border:2px solid var(--line);margin-bottom:12px;font-weight:900}
.toggle small{display:block;font-size:12px;color:var(--mute);font-weight:700}
.sw{position:relative;width:50px;height:30px;flex:none;border-radius:99px;background:#C6CBD8;border:2px solid var(--ink);transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--gold)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;font-weight:900;padding:12px 0;border-radius:12px;background:var(--metal);color:var(--ink);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.danger{background:#fff;color:var(--crimson);border-color:var(--crimson);box-shadow:0 4px 0 var(--crimson)}
.btn:disabled{opacity:.45}
.note{font-size:12px;color:var(--mute);font-weight:700;margin:4px 0 12px}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;border-bottom:1.5px solid var(--line);font-weight:900;text-align:left}
.menu button span{color:var(--mute);font-size:12px;font-weight:700}
.plist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px solid var(--line)}
.plist b{flex:1}
.mini{font-size:12px;font-weight:900;padding:6px 10px;border-radius:8px;border:2px solid var(--ink);background:#fff}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold)}

/* ---------- じゃんけん画面 ---------- */
.arena{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 14px);
  background:repeating-conic-gradient(from 0deg at 50% 46%,rgba(243,206,110,.15) 0 5deg,transparent 5deg 10deg),radial-gradient(circle at 50% 46%,#fff 0,#fff 18%,transparent 60%),linear-gradient(165deg,#FFFFFF,#ECEEF3 50%,#C9CED9)}
.arena[hidden]{display:none}
.atop{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.85);border:2px solid var(--ink)}
.atop .lbl{flex:1;min-width:0}
.atop .lbl b{display:block;font-family:var(--disp);font-weight:400;font-size:21px;line-height:1.25;word-break:break-all}
.atop .lbl span{font-size:12px;font-weight:700;color:var(--mute)}
.atop .amt{font-family:var(--disp);font-size:27px;white-space:nowrap;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 var(--ink)) drop-shadow(0 0 6px rgba(232,177,42,.6))}
.hint{text-align:center;font-weight:900;font-size:13px;color:var(--mute);margin:14px 0 10px}
.hint b{color:var(--ink)}
.fighters{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start;overflow-y:auto;padding:16px 16px 18px;margin:-12px -16px 0}
.fighter{position:relative;overflow:hidden;text-align:left;padding:16px 12px 12px;border-radius:16px;background:#fff;border:2.5px solid var(--ink);box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent),inset 0 6px 0 var(--c);min-height:132px;transition:transform .12s,opacity .25s,filter .25s}
.fighter::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)}
.fighter:active{transform:scale(.95)}
.fighter .fn{position:relative;z-index:1;font-weight:900;font-size:17px;line-height:1.3}
.fighter .lives{position:relative;z-index:1;display:flex;gap:6px;margin-top:12px}
.fighter .lives i{width:24px;height:15px;transform:skewX(-14deg);background:var(--c);border:2px solid var(--ink);border-radius:3px;box-shadow:0 0 10px var(--c)}
.fighter .lives i.lost{background:#fff;box-shadow:none;border-style:dashed;opacity:.6}
.fighter .st{position:absolute;z-index:1;right:10px;bottom:10px;font-family:var(--disp);font-size:11px;color:var(--mute)}
.fighter.out{opacity:.55;filter:grayscale(1);box-shadow:inset 0 6px 0 #B9BFCC}
.fighter.out .stamp{position:absolute;z-index:2;right:2px;top:30px;transform:rotate(-14deg);font-family:var(--disp);font-size:24px;color:#108C96;border:3px solid #108C96;border-radius:8px;padding:0 10px;background:rgba(255,255,255,.8)}
.fighter.hit{animation:hit .35s}
@keyframes hit{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}}
.abar{display:flex;gap:10px}
.abar .btn{flex:1}
.verdict{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:2;
  background:repeating-conic-gradient(from 0deg at 50% 44%,color-mix(in srgb,var(--c) 22%,transparent) 0 6deg,transparent 6deg 12deg),radial-gradient(circle at 50% 44%,#fff 0,rgba(255,255,255,.96) 35%,rgba(236,238,243,.97) 100%)}
.verdict[hidden]{display:none}
.verdict .k{font-family:var(--disp);font-size:22px;letter-spacing:.3em;padding:2px 16px 2px 22px;border-radius:8px;background:var(--metal);border:2px solid var(--ink);transform:skewX(-8deg);animation:fadein .4s both}
.verdict .p{font-family:var(--disp);font-size:clamp(46px,13vw,74px);line-height:1.15;margin:16px 0 8px;color:var(--c);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 0 18px var(--c));animation:slam .5s cubic-bezier(.2,1.6,.4,1) .15s both;word-break:break-all}
.verdict .y{font-weight:900;font-size:16px;animation:fadein .4s .45s both}
.verdict .y .num{font-size:28px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 var(--ink))}
.verdict .btns{width:100%;max-width:360px;margin-top:30px;animation:fadein .4s .6s both}
@keyframes slam{from{transform:scale(2.6) rotate(-6deg);opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-weight:900;font-size:14px;padding:10px 16px;border-radius:12px;border:2px solid var(--gold);box-shadow:0 0 16px rgba(232,177,42,.5);transition:all .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{text-align:center;padding:80px 0;color:var(--mute);font-family:var(--disp)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 装飾（赤・青・ギザギザ・稲妻・きらめき） ===== */
.deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.deco i{position:absolute;background:center/contain no-repeat}
.deco .g1{top:86px;right:18px;width:18px;height:18px;background-image:var(--glint-gold)}
.deco .g2{top:150px;left:10px;width:12px;height:12px;background-image:var(--glint-aqua)}
.deco .g3{top:44%;right:8px;width:14px;height:14px;background-image:var(--glint-red)}
.deco .g4{bottom:130px;left:16px;width:20px;height:20px;background-image:var(--glint-gold)}
.deco .g5{bottom:200px;right:22px;width:11px;height:11px;background-image:var(--glint-aqua)}
.deco .g6{top:62%;left:6px;width:10px;height:10px;background-image:var(--glint-red)}
.deco .b1{top:66px;left:-14px;width:70px;height:70px;background-image:var(--bolt-red);opacity:.55;transform:rotate(-8deg)}
.deco .b2{bottom:84px;right:-16px;width:80px;height:80px;background-image:var(--bolt-aqua);opacity:.55;transform:rotate(170deg)}
.deco .s1{top:-26px;right:-26px;width:110px;height:110px;background-image:var(--burst-glow-red);opacity:.28}
.deco .s2{bottom:40px;left:-40px;width:130px;height:130px;background-image:var(--burst-glow-aqua);opacity:.22}

header::after{content:"";position:absolute;left:16px;right:16px;bottom:4px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--crimson) 0 33%,var(--gold) 33% 66%,var(--aqua) 66%)}
.logo{position:relative;padding-left:30px}
.logo::before{content:"";position:absolute;left:-2px;top:-5px;width:28px;height:28px;background:var(--burst-red) center/contain no-repeat}
.logo small{margin-left:-30px}

/* 旅カード */
.trip{overflow:visible}
.framed::after{border-color:var(--crimson)}
.trip .gem{position:absolute;width:10px;height:10px;border:2px solid var(--ink);transform:rotate(45deg)}
.trip .gem.a{top:-7px;left:34px;background:var(--aqua)}
.trip .gem.r{bottom:-7px;right:34px;background:var(--gold)}
.trip .tb{position:absolute;top:-22px;right:-10px;width:76px;height:76px;background:var(--burst-glow-gold) center/contain no-repeat;filter:drop-shadow(0 0 8px rgba(232,177,42,.6));animation:spin 18s linear infinite}
.trip .tb2{position:absolute;top:22px;right:18px;width:34px;height:34px;background:var(--bolt-red) center/contain no-repeat}
.trip .t{padding-right:58px}
@keyframes spin{to{transform:rotate(360deg)}}
.dayflag{background:var(--crimson);color:#fff}

/* 進行中バナー */
.live{position:relative;overflow:hidden;padding-left:52px}
.live::before{content:"";position:absolute;left:10px;top:50%;width:34px;height:34px;margin-top:-17px;background:var(--bolt-gold) center/contain no-repeat;filter:drop-shadow(0 0 4px rgba(255,255,255,.8))}
.live::after{content:"";position:absolute;right:-18px;top:-18px;width:80px;height:80px;background:var(--burst-glow-gold) center/contain no-repeat;opacity:.55;animation:spin 8s linear infinite}

/* ボタン */
.big::before{content:"";position:absolute;left:-30px;top:50%;width:66px;height:66px;margin-top:-33px;background:var(--burst-glow-red) center/contain no-repeat;opacity:.9}
.big>span{position:relative;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.big .bz{position:absolute;right:10px;top:8px;width:26px;height:26px;background:var(--bolt-aqua) center/contain no-repeat;transform:skewX(6deg)}
.sub{position:relative;overflow:hidden;box-shadow:0 5px 0 var(--ink),0 0 18px rgba(31,179,191,.45);background:linear-gradient(180deg,#fff 60%,#DDF7F9)}
.sub::before{content:"";display:block;width:30px;height:30px;margin:0 auto 4px;background:var(--bolt-aqua) center/contain no-repeat}

/* 見出しのひし形を色分け */
.h2.red::before{background:var(--crimson)}
.h2.aqua::before{background:var(--aqua)}
.h2::after{content:"";flex:1;align-self:center;height:6px;margin-left:6px;background:var(--zig-ink) 0 0/12px 6px repeat-x;opacity:.18}

/* 序列 */
.rank .r{position:relative;z-index:0}
.rank .r::before{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;background:center/contain no-repeat;opacity:.35}
.rank.r1 .r::before{background-image:var(--burst-glow-gold);opacity:1;width:56px;height:56px;margin:-28px 0 0 -28px;animation:spin 14s linear infinite}
.rank.top .r{background:none;color:var(--ink);filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff)}
.rank.r2 .r::before{background-image:var(--burst-glow-aqua)}
.rank.r3 .r::before{background-image:var(--burst-glow-red)}
.rank.r2 .r{color:#108C96}
.rank.r3 .r{color:var(--crimson)}
.rank.top::after{content:"";position:absolute;right:8px;top:-9px;width:22px;height:22px;background:var(--glint-gold) center/contain no-repeat}
.rank{position:relative}

/* 未決着 */
.pend{border-color:rgba(226,54,79,.55);background:linear-gradient(90deg,rgba(226,54,79,.08),rgba(255,255,255,.6) 40%)}

/* タブの印 */
nav button[aria-current="page"]::before{background:linear-gradient(90deg,var(--crimson),var(--gold),var(--aqua))}

/* シート */
.sheet .in::before{width:60px;margin-left:-30px;background:linear-gradient(90deg,var(--crimson) 0 33%,var(--gold) 33% 66%,var(--aqua) 66%)}
.sheet h3::before{content:"";width:22px;height:22px;flex:none;background:var(--burst-red) center/contain no-repeat}

/* 空の状態 */
.empty::before,.soon::before{content:"";display:block;width:56px;height:56px;margin:0 auto 10px;background:var(--burst-glow-gold) center/contain no-repeat;animation:spin 16s linear infinite}

/* じゃんけん画面 */
.atop{position:relative;overflow:visible}
.atop::before{content:"";position:absolute;left:-10px;top:-12px;width:34px;height:34px;background:var(--burst-red) center/contain no-repeat}
.atop::after{content:"";position:absolute;right:-8px;bottom:-14px;width:34px;height:34px;background:var(--bolt-aqua) center/contain no-repeat}
.arena .deco-a{position:absolute;inset:0;pointer-events:none;z-index:0}
.arena>*{position:relative;z-index:1}
.arena>.verdict{position:absolute}
.hint{display:flex;align-items:center;justify-content:center;gap:8px}
.hint::before,.hint::after{content:"";width:18px;height:18px;background:var(--glint-red) center/contain no-repeat}
.hint::after{background-image:var(--glint-aqua)}
.fighter .gem{position:absolute;z-index:1;right:12px;top:16px;width:14px;height:14px;background:var(--c);border:2px solid var(--ink);transform:rotate(45deg)}
.fighter.out .gem{display:none}
.verdict .vb{position:absolute;left:50%;top:44%;width:min(118vw,620px);height:min(118vw,620px);transform:translate(-50%,-50%);background:var(--burst-glow-gold) center/contain no-repeat;opacity:.55;animation:spinc 20s linear infinite;pointer-events:none}
@keyframes spinc{to{transform:translate(-50%,-50%) rotate(360deg)}}
.verdict>*:not(.vb){position:relative}
.verdict .sp{position:absolute;width:26px;height:26px;background:center/contain no-repeat;animation:twinkle 1.4s ease-in-out infinite}
.verdict .sp.a{left:16%;top:28%;background-image:var(--glint-red)}
.verdict .sp.b{right:14%;top:24%;background-image:var(--glint-aqua);animation-delay:.4s}
.verdict .sp.c{left:20%;top:62%;background-image:var(--glint-gold);animation-delay:.8s}
.verdict .sp.d{right:18%;top:66%;background-image:var(--glint-red);animation-delay:.2s}
.verdict .bl{position:absolute;width:90px;height:90px;background:center/contain no-repeat}
.verdict .bl.l{left:4%;top:36%;background-image:var(--bolt-red)}
.verdict .bl.r{right:4%;top:46%;background-image:var(--bolt-aqua);transform:scaleX(-1)}
@keyframes twinkle{50%{transform:scale(.4) rotate(45deg);opacity:.5}}
.toast{border-color:var(--crimson);box-shadow:0 0 16px rgba(226,54,79,.45)}

<header>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
"use strict";
const SUPABASE_URL = "https://mspzgfkommmuucjvdvbm.supabase.co";
const SUPABASE_KEY = "sb_publishable_sj2rETV0MdsP1hA56C70kQ_F5eS1Via";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const KINDS = ["飛行機", "新幹線", "宿", "車", "おみや代", "無駄枠"];
const SPLIT_KINDS = ["飛行機", "新幹線", "宿"];
const COLORS = ["#E8B931", "#E2364F", "#3FC1C9", "#8B6CFF", "#5BD67A", "#FF8A3D", "#FF6FB5", "#5A6378"];
const TABLES = ["players", "trips", "payments", "drives", "jankens", "app_settings"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => "¥" + Math.round(n || 0).toLocaleString("ja-JP");
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };

const db = { players: [], trips: [], payments: [], drives: [], jankens: [], app_settings: [] };
let tab = "home", listFilter = "all", loaded = false;
let me = localStorage.getItem("ojk:me") || "";

/* ---------- 便利関数 ---------- */
const player = id => db.players.find(p => p.id === id);
const pname = id => (player(id) || {}).name || "（不明）";
const pcolor = id => (player(id) || {}).color || "#3A4585";
const setting = k => (db.app_settings.find(s => s.key === k) || {}).value;
const curTrip = () => db.trips.find(t => t.id === setting("current_trip")) || null;
const tripPays = t => t ? db.payments.filter(p => p.trip_id === t.id).sort((a, b) => a.seq - b.seq) : [];
const liveJanken = t => t ? db.jankens.find(j => j.trip_id === t.id && j.status === "live") : null;
const dayOf = t => {
  if (!t || !t.start_date) return null;
  const d = Math.floor((new Date(todayStr()) - new Date(t.start_date)) / 864e5) + 1;
  return d >= 1 && d <= t.days ? d : null;
};
const categoriesFor = t => [...Array.from({length: (t && t.days) || 3}, (_, i) => `${i+1}日目`), ...KINDS];
const activeMembers = t => (t ? t.members : []).filter(id => id !== t.champion_out);

function toast(msg, ms = 2200){
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), ms);
}
const fail = (e, what) => { console.error(e); toast(`${what}できませんでした：${(e && e.message) || e}`, 4000); };

/* ---------- データ ---------- */
async function loadTable(t){
  const { data, error } = await sb.from(t).select("*");
  if (error) throw error;
  db[t] = data || [];
}
async function loadAll(){
  await Promise.all(TABLES.map(loadTable));
  loaded = true;
}
let reloadTimer = {};
function subscribe(){
  sb.channel("ojk-all")
    .on("postgres_changes", { event: "*", schema: "public" }, payload => {
      const t = payload.table;
      if (!TABLES.includes(t)) return;
      clearTimeout(reloadTimer[t]);
      reloadTimer[t] = setTimeout(async () => {
        try { await loadTable(t); render(); if (t === "jankens") syncArena(); } catch (e) { console.error(e); }
      }, 120);
    })
    .subscribe();
}
async function q(promise, what){
  const { data, error } = await promise;
  if (error){ fail(error, what); return null; }
  return data ?? true;
}
async function putSetting(key, value){
  return q(sb.from("app_settings").upsert({ key, value }), "保存");
}

/* ---------- 集計（ホームの序列） ---------- */
function standings(t){
  const pays = tripPays(t).filter(p => p.payer_id);
  const rows = (t ? t.members : []).map(id => ({ id, paid: 0, std: 0, wins: 0, joins: 0, drives: 0 }));
  const by = Object.fromEntries(rows.map(r => [r.id, r]));
  pays.forEach(p => {
    const parts = p.participants || [];
    parts.forEach(id => { if (by[id]){ by[id].joins++; by[id].std += p.amount / parts.length; } });
    if (by[p.payer_id]){ by[p.payer_id].paid += p.amount; by[p.payer_id].wins++; }
  });
  db.drives.filter(d => t && d.trip_id === t.id).forEach(d => { if (by[d.player_id]) by[d.player_id].drives++; });
  const out = t ? t.champion_out : null;
  rows.sort((a, b) => (a.id === out) - (b.id === out) || b.paid - a.paid);
  let rank = 0, prev = null;
  rows.forEach((r, i) => { if (r.id === out){ r.rank = "–"; return; } if (r.paid !== prev){ rank = i + 1; prev = r.paid; } r.rank = rank; });
  return rows;
}

/* ---------- 描画 ---------- */
function render(){
  const v = $("#view");
  const t = curTrip();
  $("#tripsub").textContent = t ? t.name : "";
  const mp = player(me);
  $("#meBtn").innerHTML = mp ? `<span class="dot" style="background:${mp.color}"></span><span>${esc(mp.name)}</span>` : `<span class="dot" style="background:var(--line)"></span><span>自分を選ぶ</span>`;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  if (!loaded){ v.innerHTML = `<div class="loading">読み込み中…</div>`; return; }
  v.innerHTML = tab === "home" ? viewHome(t) : tab === "list" ? viewList(t)
    : tab === "stats" ? soon("集計", "グラフと〇〇数・〇〇率は段階3で追加します")
    : tab === "tickets" ? soon("券・特権", "免除券・特権・ルーレットは段階2で追加します")
    : soon("歴代", "歴代名簿・シーズン・地図は段階3で追加します");
  bindView();
}
const soon = (t, s) => `<div class="soon"><b>${t}</b>${s}</div>`;

function viewHome(t){
  if (!db.players.length) return `<div class="empty"><b>まずはプレイヤー登録</b>右上の歯車から、旅のメンバーを登録してください。<div class="btns"><button class="btn" data-act="players">プレイヤーを登録する</button></div></div>`;
  if (!t) return `<div class="empty"><b>旅を作成しましょう</b>歯車の「旅」から、今回の旅を作成して「今の旅」に選んでください。<div class="btns"><button class="btn" data-act="trips">旅を作成する</button></div></div>`;
  const day = dayOf(t), lj = liveJanken(t);
  const rows = standings(t);
  const pending = tripPays(t).filter(p => !p.payer_id);
  const champ = t.champion_out ? `<span class="tag gold">3連覇達成者 ${esc(pname(t.champion_out))}</span>` : "";
  let h = `<div class="trip framed"><i class="gem a"></i><i class="gem r"></i><span class="tb" aria-hidden="true"></span><span class="tb2" aria-hidden="true"></span><div class="t">${esc(t.name)}</div>
    <div class="s">${day ? `<span class="dayflag">${day}日目</span>` : ""}第${t.no}回・シーズン${t.season}・${t.members.length}人 ${champ}</div></div>`;
  if (lj) h += `<button class="live" data-act="openLive"><div><b>じゃんけん進行中</b><br><span>${esc(lj.label)}（${yen(lj.amount)}）・タップで入る</span></div></button>`;
  h += `<div class="acts"><button class="big" data-act="newJanken"><span>じゃんけん開始</span><i class="bz" aria-hidden="true"></i></button><button class="sub" data-act="drive">運転</button></div>`;
  if (pending.length){
    h += `<div class="h2 red">未決着<small>${pending.length}件</small></div>`;
    h += pending.slice(0, 5).map(p => `<div class="pend"><div class="l"><b>${esc(p.label)}</b><span>${esc(p.category)}・${yen(p.amount)}</span></div><button class="chipbtn" data-play="${p.id}">じゃんけん</button></div>`).join("");
  }
  const total = tripPays(t).filter(p => p.payer_id).reduce((s, p) => s + p.amount, 0);
  h += `<div class="h2">序列<small>合計 ${yen(total)}</small></div>`;
  h += rows.map(r => {
    const diff = r.paid - r.std;
    return `<div class="rank ${r.rank === 1 && r.paid > 0 ? "top" : ""} ${r.paid > 0 && typeof r.rank === "number" && r.rank <= 3 ? "r" + r.rank : ""}" style="--c:${pcolor(r.id)}">
      <div class="r">${r.rank}</div>
      <div class="n">${esc(pname(r.id))}${r.id === me ? `<span class="mine">自分</span>` : ""}${r.id === t.champion_out ? `<span class="tag">免除中</span>` : ""}</div>
      <div class="a">${yen(r.paid)}</div>
      <div class="m"><span>標準との差 <b class="${diff > 0 ? "plus" : diff < 0 ? "minus" : ""}">${signed(diff)}</b></span><span>支払 ${r.wins}/${r.joins}回</span><span>運転 ${r.drives}回</span></div>
    </div>`;
  }).join("");
  return h;
}

function viewList(t){
  if (!t) return `<div class="empty"><b>今の旅がありません</b>歯車の「旅」から作成してください。</div>`;
  const cats = categoriesFor(t);
  const all = tripPays(t);
  const pays = listFilter === "all" ? all : all.filter(p => p.category === listFilter);
  let h = `<div class="filter">${["all", ...cats].map(c => `<button data-filter="${esc(c)}" aria-pressed="${listFilter === c}">${c === "all" ? "すべて" : esc(c)}</button>`).join("")}</div>`;
  if (!all.length) h += `<div class="empty"><b>まだ支払いがありません</b>ホームの「じゃんけん開始」から記録します。</div>`;
  else if (!pays.length) h += `<div class="empty">この区分の支払いはありません</div>`;
  h += pays.map(p => `<button class="row" data-edit="${p.id}">
      <span class="q">${p.seq}</span><span class="l">${esc(p.label)}</span><span class="a">${yen(p.amount)}</span>
      <span class="m"><span class="tag">${esc(p.category)}</span>${p.payer_id ? `<span class="who"><span class="dot" style="background:${pcolor(p.payer_id)}"></span>${esc(pname(p.payer_id))}</span>` : `<span style="color:#FF8A9A">未決着</span>`}<span>${(p.participants || []).length}人</span></span>
    </button>`).join("");
  const drives = db.drives.filter(d => d.trip_id === t.id).sort((a, b) => a.created_at.localeCompare(b.created_at));
  h += `<div class="h2 aqua">運転の記録<small>${drives.length}回</small></div>`;
  h += drives.length ? drives.map((d, i) => `<div class="plist"><span class="dot" style="background:${pcolor(d.player_id)}"></span><b>${esc(pname(d.player_id))}</b><span class="note" style="margin:0">${fmtTime(d.created_at)}</span><button class="mini" data-deldrive="${d.id}">削除</button></div>`).join("") : `<div class="note">ホームの「運転」から記録します。</div>`;
  return h;
}
const fmtTime = iso => { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

function bindView(){
  const v = $("#view");
  v.querySelectorAll("[data-act]").forEach(b => b.onclick = () => ({
    players: openPlayers, trips: openTrips, newJanken: openNewJanken, drive: openDrive, openLive: () => openArena(liveJanken(curTrip()).id)
  })[b.dataset.act]());
  v.querySelectorAll("[data-play]").forEach(b => b.onclick = () => startFromPayment(b.dataset.play));
  v.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { listFilter = b.dataset.filter; render(); });
  v.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openEditPayment(b.dataset.edit));
  v.querySelectorAll("[data-deldrive]").forEach(b => b.onclick = async () => {
    if (!confirm("この運転の記録を削除しますか？")) return;
    if (await q(sb.from("drives").delete().eq("id", b.dataset.deldrive), "削除")){ await loadTable("drives"); render(); }
  });
}

/* ---------- シート ---------- */
function openSheet(title, html){
  $("#sheetIn").innerHTML = `<h3>${title}<button class="x" data-close>閉じる</button></h3>${html}`;
  $("#sheet").classList.add("on");
  $("#sheetIn").querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet);
  return $("#sheetIn");
}
function closeSheet(){ $("#sheet").classList.remove("on"); }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

const chipPlayers = (ids, selected, attr = "data-p") => `<div class="chips">${ids.map(id => `<button type="button" ${attr}="${id}" aria-pressed="${selected.includes(id)}"><span class="dot" style="background:${pcolor(id)}"></span>${esc(pname(id))}</button>`).join("")}</div>`;
function bindChips(root, attr, multi, onChange){
  root.querySelectorAll(`[${attr}]`).forEach(b => b.onclick = () => {
    if (!multi) root.querySelectorAll(`[${attr}]`).forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", multi ? String(b.getAttribute("aria-pressed") !== "true") : "true");
    onChange && onChange();
  });
}
const picked = (root, attr) => [...root.querySelectorAll(`[${attr}][aria-pressed="true"]`)].map(b => b.getAttribute(attr));
const catChips = (t, cur) => `<div class="chips">${categoriesFor(t).map(c => `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === cur}">${esc(c)}</button>`).join("")}</div>`;

/* ---------- 自分 ---------- */
function openMe(){
  if (!db.players.length){ openPlayers(); return; }
  const s = openSheet("この端末の自分", `<p class="note">この端末を使う人を選んでください。一斉宣言や通知で使います（この端末にだけ保存されます）。</p>${chipPlayers(db.players.map(p => p.id), [me])}<div class="btns"><button class="btn" id="meOk">決定</button></div>`);
  bindChips(s, "data-p", false);
  $("#meOk").onclick = () => { const [id] = picked(s, "data-p"); if (!id) return; me = id; localStorage.setItem("ojk:me", id); closeSheet(); render(); toast(`${pname(id)}として使います`); };
}

/* ---------- 設定 ---------- */
function openSettings(){
  const t = curTrip();
  const s = openSheet("設定", `<div class="menu">
    <button data-m="me">この端末の自分<span>${esc(player(me)?.name || "未設定")}</span></button>
    <button data-m="players">プレイヤー<span>${db.players.length}人</span></button>
    <button data-m="trips">旅<span>${esc(t ? t.name : "未選択")}</span></button>
  </div><p class="note" style="margin-top:14px">券・特権、通知、要綱の設定は次の段階で追加します。</p>`);
  s.querySelectorAll("[data-m]").forEach(b => b.onclick = () => ({ me: openMe, players: openPlayers, trips: openTrips })[b.dataset.m]());
}

function openPlayers(){
  const list = [...db.players].sort((a, b) => a.sort - b.sort || a.created_at.localeCompare(b.created_at));
  const s = openSheet("プレイヤー", `${list.map(p => `<div class="plist"><span class="dot" style="background:${p.color}"></span><b>${esc(p.name)}</b><button class="mini" data-pe="${p.id}">編集</button></div>`).join("") || `<p class="note">まだ登録がありません。</p>`}
    <div class="btns"><button class="btn ghost" data-back>戻る</button><button class="btn" id="addP">追加する</button></div>`);
  s.querySelector("[data-back]").onclick = openSettings;
  $("#addP").onclick = () => editPlayer(null);
  s.querySelectorAll("[data-pe]").forEach(b => b.onclick = () => editPlayer(b.dataset.pe));
}
function editPlayer(id){
  const p = id ? player(id) : null;
  let color = p ? p.color : COLORS[db.players.length % COLORS.length];
  const s = openSheet(p ? "プレイヤーを編集" : "プレイヤーを追加", `
    <label class="f"><span>ニックネーム</span><input id="pn" value="${esc(p ? p.name : "")}" maxlength="12" placeholder="例：くろごめ"></label>
    <div class="f"><span>カラー</span><div class="colors">${COLORS.map(c => `<button type="button" data-c="${c}" style="background:${c}" aria-pressed="${c === color}" aria-label="${c}"></button>`).join("")}</div></div>
    <div class="btns">${p ? `<button class="btn danger" id="pdel">削除</button>` : `<button class="btn ghost" data-back>戻る</button>`}<button class="btn" id="psave">保存</button></div>`);
  s.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { color = b.dataset.c; s.querySelectorAll("[data-c]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
  const back = s.querySelector("[data-back]"); if (back) back.onclick = openPlayers;
  $("#psave").onclick = async () => {
    const name = $("#pn").value.trim(); if (!name){ toast("ニックネームを入力してください"); return; }
    const ok = p ? await q(sb.from("players").update({ name, color }).eq("id", p.id), "保存")
                 : await q(sb.from("players").insert({ name, color, sort: db.players.length }), "保存");
    if (ok){ await loadTable("players"); render(); openPlayers(); toast("保存しました"); }
  };
  const del = $("#pdel");
  if (del) del.onclick = async () => {
    if (db.payments.some(x => x.payer_id === p.id || (x.participants || []).includes(p.id))){ toast("支払いの記録があるプレイヤーは削除できません", 3200); return; }
    if (!confirm(`${p.name}を削除しますか？`)) return;
    if (await q(sb.from("players").delete().eq("id", p.id), "削除")){ await loadTable("players"); render(); openPlayers(); }
  };
}

function openTrips(){
  const cur = setting("current_trip");
  const list = [...db.trips].sort((a, b) => b.no - a.no);
  const s = openSheet("旅", `${list.map(t => `<div class="plist"><b>第${t.no}回 ${esc(t.name)}${t.id === cur ? ` <span class="tag gold">今の旅</span>` : ""}</b>${t.id === cur ? "" : `<button class="mini" data-cur="${t.id}">今の旅にする</button>`}<button class="mini" data-te="${t.id}">編集</button></div>`).join("") || `<p class="note">まだ旅がありません。</p>`}
    <div class="btns"><button class="btn ghost" data-back>戻る</button><button class="btn" id="addT">旅を作成</button></div>`);
  s.querySelector("[data-back]").onclick = openSettings;
  $("#addT").onclick = () => editTrip(null);
  s.querySelectorAll("[data-te]").forEach(b => b.onclick = () => editTrip(b.dataset.te));
  s.querySelectorAll("[data-cur]").forEach(b => b.onclick = async () => { if (await putSetting("current_trip", b.dataset.cur)){ await loadTable("app_settings"); render(); openTrips(); toast("今の旅を切り替えました"); } });
}
function editTrip(id){
  if (!db.players.length){ toast("先にプレイヤーを登録してください"); openPlayers(); return; }
  const t = id ? db.trips.find(x => x.id === id) : null;
  const last = [...db.trips].sort((a, b) => b.no - a.no)[0];
  const members = t ? t.members : db.players.map(p => p.id);
  const s = openSheet(t ? "旅を編集" : "旅を作成", `
    <div class="two"><label class="f"><span>開催回</span><input id="tno" type="number" inputmode="numeric" value="${t ? t.no : (last ? last.no + 1 : 0)}"></label>
    <label class="f"><span>シーズン</span><input id="tse" type="number" inputmode="numeric" value="${t ? t.season : (last ? last.season : 1)}"></label></div>
    <label class="f"><span>名称</span><input id="tna" value="${esc(t ? t.name : "")}" placeholder="例：2027冬 長崎・佐賀"></label>
    <div class="two"><label class="f"><span>開始日</span><input id="tsd" type="date" value="${t ? (t.start_date || "") : ""}"></label>
    <label class="f"><span>日数</span><input id="tdy" type="number" inputmode="numeric" min="1" max="9" value="${t ? t.days : 3}"></label></div>
    <div class="f"><span>参加者</span>${chipPlayers(db.players.map(p => p.id), members)}</div>
    <div class="f"><span>3連覇達成者（この旅はじゃんけんに参加しない）</span><select id="tch"><option value="">なし</option>${db.players.map(p => `<option value="${p.id}" ${t && t.champion_out === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>
    <label class="f"><span>行った都道府県（読点区切り。地図は段階3で表示）</span><input id="tpr" value="${esc(t ? (t.prefectures || []).join("、") : "")}" placeholder="例：長崎、佐賀"></label>
    <div class="btns">${t ? `<button class="btn danger" id="tdel">削除</button>` : `<button class="btn ghost" data-back>戻る</button>`}<button class="btn" id="tsave">保存</button></div>`);
  bindChips(s, "data-p", true);
  const back = s.querySelector("[data-back]"); if (back) back.onclick = openTrips;
  $("#tsave").onclick = async () => {
    const row = {
      no: parseInt($("#tno").value, 10) || 0, season: parseInt($("#tse").value, 10) || 1,
      name: $("#tna").value.trim(), start_date: $("#tsd").value || null,
      days: Math.max(1, Math.min(9, parseInt($("#tdy").value, 10) || 3)),
      members: picked(s, "data-p"), champion_out: $("#tch").value || null,
      prefectures: $("#tpr").value.split(/[、,，\s]+/).map(x => x.trim()).filter(Boolean)
    };
    if (!row.name){ toast("名称を入力してください"); return; }
    if (row.members.length < 2){ toast("参加者を2人以上選んでください"); return; }
    let ok;
    if (t) ok = await q(sb.from("trips").update(row).eq("id", t.id), "保存");
    else {
      const res = await q(sb.from("trips").insert(row).select().single(), "保存");
      ok = res && await putSetting("current_trip", res.id);
    }
    if (ok){ await Promise.all([loadTable("trips"), loadTable("app_settings")]); render(); openTrips(); toast(t ? "保存しました" : "旅を作成して、今の旅にしました"); }
  };
  const del = $("#tdel");
  if (del) del.onclick = async () => {
    if (!confirm(`「${t.name}」と、その支払い・運転の記録をすべて削除しますか？`)) return;
    if (await q(sb.from("trips").delete().eq("id", t.id), "削除")){ await Promise.all(["trips", "payments", "drives", "jankens"].map(loadTable)); render(); openTrips(); }
  };
}

/* ---------- 運転 ---------- */
function openDrive(){
  const t = curTrip(); if (!t) return;
  const s = openSheet("誰が運転する？", `<p class="note">じゃんけんで運転が決まった人をタップ。勝率の計算に入ります。</p>${chipPlayers(activeMembers(t), [])}`);
  s.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => {
    if (await q(sb.from("drives").insert({ trip_id: t.id, player_id: b.dataset.p }), "記録")){
      await loadTable("drives"); closeSheet(); render(); toast(`運転：${pname(b.dataset.p)}`);
    }
  });
}

/* ---------- じゃんけん：準備 ---------- */
function openNewJanken(){
  const t = curTrip(); if (!t) return;
  if (liveJanken(t)){ toast("進行中のじゃんけんがあります"); openArena(liveJanken(t).id); return; }
  const day = dayOf(t);
  let cat = day ? `${day}日目` : categoriesFor(t)[0];
  const members = activeMembers(t);
  const s = openSheet("じゃんけん開始", `
    <label class="f"><span>内訳</span><input id="jl" placeholder="例：昼ご飯(稲庭うどん)" maxlength="40"></label>
    <label class="f"><span>金額（全員分の合計）</span><input id="ja" type="number" inputmode="numeric" placeholder="0"></label>
    <div class="f"><span>カテゴリー</span>${catChips(t, cat)}</div>
    <div class="toggle"><div>人数分に分ける<small id="splitInfo">旅費・宿泊費は参加人数ぶんじゃんけん</small></div><button type="button" class="sw" id="jsp" role="switch" aria-checked="false" aria-label="人数分に分ける"></button></div>
    <div class="f"><span>参加者（抜ける人をタップで外す）</span>${chipPlayers(members, members)}</div>
    ${t.champion_out ? `<p class="note">3連覇達成者の${esc(pname(t.champion_out))}は参加しません。</p>` : ""}
    <div class="btns"><button class="btn" id="jgo">開始</button></div>`);
  const sw = $("#jsp");
  const info = () => { const n = picked(s, "data-p").length, a = parseInt($("#ja").value, 10) || 0; $("#splitInfo").textContent = sw.getAttribute("aria-checked") === "true" ? `${n}回に分けて、1回 ${yen(Math.floor(a / Math.max(n, 1)))}` : "旅費・宿泊費は参加人数ぶんじゃんけん"; };
  sw.onclick = () => { sw.setAttribute("aria-checked", String(sw.getAttribute("aria-checked") !== "true")); info(); };
  bindChips(s, "data-cat", false, () => { cat = picked(s, "data-cat")[0]; sw.setAttribute("aria-checked", String(SPLIT_KINDS.includes(cat))); info(); });
  bindChips(s, "data-p", true, info);
  $("#ja").oninput = info;
  $("#jgo").onclick = async () => {
    const label = $("#jl").value.trim(), amount = parseInt($("#ja").value, 10) || 0, parts = picked(s, "data-p");
    if (!label){ toast("内訳を入力してください"); return; }
    if (amount <= 0){ toast("金額を入力してください"); return; }
    if (parts.length < 2){ toast("参加者を2人以上にしてください"); return; }
    $("#jgo").disabled = true;
    if (sw.getAttribute("aria-checked") === "true"){
      const n = parts.length, base = Math.floor(amount / n), rest = amount - base * n;
      const group = crypto.randomUUID(), seq0 = nextSeq(t);
      const rows = Array.from({length: n}, (_, i) => ({ trip_id: t.id, seq: seq0 + i, label: `${label} ${i+1}/${n}`, amount: base + (i < rest ? 1 : 0), category: cat, participants: parts, split_group: group }));
      const res = await q(sb.from("payments").insert(rows).select(), "登録");
      if (!res){ $("#jgo").disabled = false; return; }
      await loadTable("payments");
      const first = res.sort((a, b) => a.seq - b.seq)[0];
      closeSheet(); render(); toast(`${n}回に分けて登録しました`);
      startFromPayment(first.id);
    } else {
      const j = await createJanken({ trip_id: t.id, label, amount, category: cat, participants: parts });
      $("#jgo").disabled = false;
      if (j){ closeSheet(); openArena(j.id); }
    }
  };
  setTimeout(() => $("#jl").focus(), 250);
}
const nextSeq = t => tripPays(t).reduce((m, p) => Math.max(m, p.seq), 0) + 1;

async function createJanken(base){
  const lives = Object.fromEntries(base.participants.map(id => [id, 1]));
  const res = await q(sb.from("jankens").insert({ ...base, lives, max_lives: lives, history: [], status: "live", started_by: me || null }).select().single(), "開始");
  if (res){ await loadTable("jankens"); render(); }
  return res;
}
async function startFromPayment(pid){
  const p = db.payments.find(x => x.id === pid), t = curTrip();
  if (!p || !t) return;
  if (liveJanken(t)){ toast("先に進行中のじゃんけんを終わらせてください"); openArena(liveJanken(t).id); return; }
  const s = openSheet(esc(p.label), `<p class="note">${esc(p.category)}・${yen(p.amount)}</p><div class="f"><span>参加者（抜ける人をタップで外す）</span>${chipPlayers(activeMembers(t), (p.participants || []).filter(id => activeMembers(t).includes(id)))}</div><div class="btns"><button class="btn" id="jgo">開始</button></div>`);
  bindChips(s, "data-p", true);
  $("#jgo").onclick = async () => {
    const parts = picked(s, "data-p");
    if (parts.length < 2){ toast("参加者を2人以上にしてください"); return; }
    const j = await createJanken({ trip_id: t.id, payment_id: p.id, label: p.label, amount: p.amount, category: p.category, participants: parts });
    if (j){ closeSheet(); openArena(j.id); }
  };
}

/* ---------- じゃんけん：進行 ---------- */
let arenaId = null, busy = false;
function openArena(id){ arenaId = id; $("#arena").hidden = false; document.body.style.overflow = "hidden"; drawArena(); }
function closeArena(){ arenaId = null; $("#arena").hidden = true; document.body.style.overflow = ""; render(); }
function syncArena(){
  if (!arenaId) return;
  const j = db.jankens.find(x => x.id === arenaId);
  if (!j || j.status !== "live"){ closeArena(); if (j && j.status === "done") toast(`決着：${pname(j.payer_id)}が支払い`); return; }
  drawArena();
}
function drawArena(){
  const j = db.jankens.find(x => x.id === arenaId); if (!j) return closeArena();
  const alive = j.participants.filter(id => (j.lives[id] || 0) > 0);
  const done = alive.length === 1;
  const a = $("#arena");
  a.innerHTML = `
    <div class="atop"><div class="lbl"><b>${esc(j.label)}</b><span>${esc(j.category)}・${j.participants.length}人参加</span></div><div class="amt num">${yen(j.amount)}</div></div>
    <div class="hint">${done ? "決着！" : `<b>負けた人</b>をタップ　残り <b class="num">${alive.length}</b> 人`}</div>
    <div class="fighters">${j.participants.map(id => {
      const l = j.lives[id] || 0, m = j.max_lives[id] || 1;
      return `<button class="fighter ${l <= 0 ? "out" : ""}" data-f="${id}" style="--c:${pcolor(id)}" ${l <= 0 || done ? "disabled" : ""}>
        <i class="gem"></i><div class="fn">${esc(pname(id))}</div>
        <div class="lives">${Array.from({length: m}, (_, i) => `<i class="${i < l ? "" : "lost"}"></i>`).join("")}</div>
        <div class="st">${l > 0 ? `残機 ${l}` : ""}</div>${l <= 0 ? `<span class="stamp">抜け</span>` : ""}</button>`;
    }).join("")}</div>
    <div class="abar"><button class="btn ghost" id="aUndo" ${j.history.length ? "" : "disabled"}>1つ戻す</button><button class="btn ghost" id="aMin">閉じる</button><button class="btn danger" id="aStop">中止</button></div>
    <div class="verdict" id="verdict" ${done ? "" : "hidden"} style="--c:${done ? pcolor(alive[0]) : "#fff"}">
      <span class="vb"></span><span class="sp a"></span><span class="sp b"></span><span class="sp c"></span><span class="sp d"></span><span class="bl l"></span><span class="bl r"></span>
      <div class="k">決着</div><div class="p">${done ? esc(pname(alive[0])) : ""}</div>
      <div class="y"><span class="num">${yen(j.amount)}</span><br>男気を見せる</div>
      <div class="btns"><button class="btn ghost" id="vBack">1つ戻す</button><button class="btn" id="vOk">確定</button></div>
    </div>`;
  a.querySelectorAll("[data-f]").forEach(b => b.onclick = () => lose(j, b.dataset.f, b));
  $("#aUndo").onclick = () => undo(j);
  $("#vBack").onclick = () => undo(j);
  $("#aMin").onclick = closeArena;
  $("#aStop").onclick = () => stop(j);
  $("#vOk").onclick = () => settle(j, alive[0]);
}
async function patchJanken(j, patch){
  busy = true;
  Object.assign(j, patch); drawArena();
  const ok = await q(sb.from("jankens").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", j.id), "保存");
  busy = false;
  if (!ok){ await loadTable("jankens"); syncArena(); }
  return ok;
}
async function lose(j, id, el){
  if (busy) return;
  el.classList.add("hit"); if (navigator.vibrate) navigator.vibrate(30);
  const lives = { ...j.lives, [id]: Math.max(0, (j.lives[id] || 0) - 1) };
  await patchJanken(j, { lives, history: [...j.history, j.lives] });
}
async function undo(j){
  if (busy || !j.history.length) return;
  const history = j.history.slice(0, -1);
  await patchJanken(j, { lives: j.history[j.history.length - 1], history });
}
async function stop(j){
  if (!confirm("このじゃんけんを中止しますか？（支払いは記録されません）")) return;
  if (await q(sb.from("jankens").update({ status: "cancel" }).eq("id", j.id), "中止")){ await loadTable("jankens"); closeArena(); toast("中止しました"); }
}
async function settle(j, payer){
  if (busy) return; busy = true;
  const t = db.trips.find(x => x.id === j.trip_id);
  let ok;
  if (j.payment_id) ok = await q(sb.from("payments").update({ payer_id: payer, participants: j.participants }).eq("id", j.payment_id), "確定");
  else ok = await q(sb.from("payments").insert({ trip_id: j.trip_id, seq: nextSeq(t), label: j.label, amount: j.amount, category: j.category, payer_id: payer, participants: j.participants }), "確定");
  if (ok) ok = await q(sb.from("jankens").update({ status: "done", payer_id: payer }).eq("id", j.id), "確定");
  busy = false;
  if (!ok) return;
  await Promise.all([loadTable("payments"), loadTable("jankens")]);
  closeArena();
  toast(`${pname(payer)}が ${yen(j.amount)} を支払い`);
  const next = j.payment_id && nextSplit(j.payment_id);
  if (next && confirm(`続けて「${next.label}」のじゃんけんをしますか？`)) startFromPayment(next.id);
}
function nextSplit(pid){
  const p = db.payments.find(x => x.id === pid);
  if (!p || !p.split_group) return null;
  return db.payments.filter(x => x.split_group === p.split_group && !x.payer_id).sort((a, b) => a.seq - b.seq)[0] || null;
}

/* ---------- 支払いの編集 ---------- */
function openEditPayment(id){
  const p = db.payments.find(x => x.id === id), t = curTrip();
  if (!p || !t) return;
  let cat = p.category;
  const s = openSheet("支払いを編集", `
    <label class="f"><span>内訳</span><input id="el" value="${esc(p.label)}"></label>
    <div class="two"><label class="f"><span>金額</span><input id="ea" type="number" inputmode="numeric" value="${p.amount}"></label>
    <label class="f"><span>支払順</span><input id="eq" type="number" inputmode="numeric" value="${p.seq}"></label></div>
    <div class="f"><span>カテゴリー</span>${catChips(t, cat)}</div>
    <div class="f"><span>払った人</span>${chipPlayers(t.members, p.payer_id ? [p.payer_id] : [], "data-payer")}</div>
    <div class="f"><span>参加者</span>${chipPlayers(t.members, p.participants || [])}</div>
    <div class="btns"><button class="btn danger" id="edel">削除</button>${p.payer_id ? "" : `<button class="btn ghost" id="eplay">じゃんけん</button>`}<button class="btn" id="esave">保存</button></div>`);
  bindChips(s, "data-cat", false, () => cat = picked(s, "data-cat")[0]);
  bindChips(s, "data-payer", false);
  bindChips(s, "data-p", true);
  const pl = $("#eplay"); if (pl) pl.onclick = () => startFromPayment(p.id);
  $("#esave").onclick = async () => {
    const row = { label: $("#el").value.trim(), amount: parseInt($("#ea").value, 10) || 0, seq: parseInt($("#eq").value, 10) || p.seq, category: cat, payer_id: picked(s, "data-payer")[0] || null, participants: picked(s, "data-p") };
    if (!row.label){ toast("内訳を入力してください"); return; }
    if (row.payer_id && !row.participants.includes(row.payer_id)) row.participants.push(row.payer_id);
    if (await q(sb.from("payments").update(row).eq("id", p.id), "保存")){ await loadTable("payments"); closeSheet(); render(); toast("保存しました"); }
  };
  $("#edel").onclick = async () => {
    if (!confirm(`「${p.label}」を削除しますか？`)) return;
    if (await q(sb.from("payments").delete().eq("id", p.id), "削除")){ await loadTable("payments"); closeSheet(); render(); }
  };
}

/* ---------- 起動 ---------- */
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
$("#gearBtn").onclick = openSettings;
$("#meBtn").onclick = openMe;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) return;
  try { await loadAll(); render(); syncArena(); } catch (e) { console.error(e); }
});
(async () => {
  try { await loadAll(); }
  catch (e) { $("#view").innerHTML = `<div class="empty"><b>データを読み込めませんでした</b>${esc(e.message || e)}<br>Supabaseでテーブルを作成したか確認してください。</div>`; return; }
  render(); subscribe();
  if (db.players.length && !player(me)) openMe();
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
