    ${strip.length ? `<div class="astrip">${strip.map(x => x.startsWith("<span") ? x : `<span>${x}</span>`).join("")}</div>` : ""}
    <div class="hint">${hint}</div>
    <div class="fighters">${cards}</div>
    ${phase === "play" && !done ? `<button class="solobtn ${soloMode ? "on" : ""}" id="aSolo">${soloMode ? "1人勝ちした人をタップ（やめる）" : "1人勝ち"}</button>` : ""}
    <div class="abar">${bar}</div>
    <div class="verdict" id="verdict" ${done ? "" : "hidden"} style="--c:${done ? pcolor(alive[0]) : "#fff"}">
      <span class="vb"></span><span class="sp a"></span><span class="sp b"></span><span class="sp c"></span><span class="sp d"></span><span class="bl l"></span><span class="bl r"></span>
      <div class="k">決着</div><div class="p">${done ? esc(pname(alive[0])) : ""}</div>
      <div class="y"><span class="num">${yen(j.amount)}</span><br>${PRAISE[[...j.id].reduce((a, c) => a + c.charCodeAt(0), (j.history || []).length) % PRAISE.length]}</div>
      <div class="btns"><button class="btn ghost" id="vBack">1つ戻す</button><button class="btn" id="vOk">確定</button></div>
    </div>`;
  a.querySelectorAll("[data-f]").forEach(b => b.onclick = () => lose(j, b.dataset.f, b));
  a.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { const [pid, kind] = b.dataset.dec.split("|"); declareTicket(j, pid, kind, null); });
  a.querySelectorAll("[data-proxy]").forEach(b => b.onclick = () => openProxy(j, b.dataset.proxy));
  a.querySelectorAll("[data-win]").forEach(b => b.onclick = () => { const [pid, kind] = b.dataset.win.split("|"); resolveConflict(j, { pid, kind }); });
  const on = (id, fn) => { const el = a.querySelector("#" + id); if (el) el.onclick = fn; };
  on("aUndo", () => undo(j)); on("vBack", () => undo(j)); on("aMin", closeArena); on("aStop", () => stop(j));
  on("vOk", () => settle(j, alive[0])); on("aSolo", () => { soloMode = !soloMode; drawArena(); }); on("aUse", () => openManualUse(j)); on("aForce", () => openForce(j));
}
async function patchJanken(j, patch){
  busy = true;
  Object.assign(j, patch); drawArena();
  const body = { ...patch, updated_at: new Date().toISOString() };
  let { error } = await sb.from("jankens").update(body).eq("id", j.id);
  // 古いテーブル（列が足りない）でも動くよう、無い列は外して保存し直す
  for (let i = 0; error && i < 3; i++){
    const m = /'(\w+)' column/.exec(error.message || "");
    if (!m || !(m[1] in body)) break;
    delete body[m[1]];
    ({ error } = await sb.from("jankens").update(body).eq("id", j.id));
  }
  busy = false;
  if (error){ fail(error, "保存"); await loadTable("jankens"); syncArena(); return false; }
  return true;
}
const snap = j => ({ l: j.lives, e: j.exempt_done || [], s: j.solos || [] });
let soloMode = false;
async function applyLives(j, lives, extra = {}){
  const alive = j.participants.filter(x => lives[x] > 0);
  const exempt = j.exempt || [], exDone = j.exempt_done || [];
  if (alive.length === 1 && exempt.includes(alive[0]) && !exDone.includes(alive[0])){
    const reset = {};
    j.participants.forEach(x => { reset[x] = (j.supers || []).includes(x) ? 0 : (j.max_lives[x] || 1); });
    seenReset[j.id] = exDone.length + 1;
    flash(`${pname(alive[0])}の免除券発動！`, "全員でやり直し");
    await patchJanken(j, { lives: reset, history: [...j.history, snap(j)], exempt_done: [...exDone, alive[0]], ...extra });
    return;
  }
  await patchJanken(j, { lives, history: [...j.history, snap(j)], ...extra });
}
async function lose(j, id, el){
  if (busy) return;
  el.classList.add("hit"); if (navigator.vibrate) navigator.vibrate(30);
  if (soloMode){ soloMode = false; return soloWin(j, id); }
  await applyLives(j, { ...j.lives, [id]: Math.max(0, (j.lives[id] || 0) - 1) });
}
async function soloWin(j, id){
  const lives = { ...j.lives };
  j.participants.forEach(x => { if (x !== id && (lives[x] || 0) > 0) lives[x]--; });
  flash("1人勝ち！", pname(id));
  await applyLives(j, lives, { solos: [...(j.solos || []), id] });
}
async function undo(j){
  if (busy || !j.history.length) return;
  const last = j.history[j.history.length - 1];
  const patch = { history: j.history.slice(0, -1) };
  if (last && last.l){ patch.lives = last.l; patch.exempt_done = last.e || []; patch.solos = last.s || []; seenReset[j.id] = patch.exempt_done.length; }
  else patch.lives = last;
  await patchJanken(j, patch);
}

/* ---------- 一斉宣言 ---------- */
async function declareTicket(j, pid, kind, proxyBy){
  if (busy) return;
  const declare = { ...j.declare, [pid]: kind };
  const proxy = proxyBy ? { ...(j.proxy || {}), [pid]: proxyBy } : (j.proxy || {});
  const ok = await patchJanken(j, { declare, proxy });
  if (ok && Object.values(declare).every(v => v !== null)) await reveal(j.id);
}
function openProxy(j, pid){
  const t = tripOfJ(j);
  const hasN = tcount(t, pid, "normal"), hasS = tcount(t, pid, "super");
  const s = openSheet(`${esc(pname(pid))}の代理宣言`, `<p class="note">本人のスマホが使えないときに、代わりに宣言します。代理で宣言したことは全員の画面に表示されます。</p>
    <div class="dbtns big"><button data-k="none">使わない</button><button class="n" data-k="normal" ${hasN ? "" : "disabled"}>免除券を使う（${hasN}）</button><button class="s" data-k="super" ${hasS ? "" : "disabled"}>superを使う（${hasS}）</button></div>`);
  s.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { closeSheet(); const jj = jById(j.id); if (jj && jj.declare[pid] === null) declareTicket(jj, pid, b.dataset.k, me || "代理"); });
}
async function reveal(id){
  const { data, error } = await sb.from("jankens").update({ phase: "reveal" }).eq("id", id).eq("phase", "declare").select();
  if (error || !data || !data.length) return;
  const j = data[0]; Object.assign(jById(id) || {}, j);
  const t = tripOfJ(j), p1 = privOf(t, 1);
  const users = Object.entries(j.declare).filter(([, k]) => k && k !== "none").map(([pid, kind]) => ({ pid, kind }));
  // 重なったら：superが優先。同じ種類どうしはじゃんけんで1人。
  // 特権一の持ち主がじゃんけんに勝てば持ち主だけ、負けても持ち主は使える（勝者と両方）。
  const p1u = p1 ? users.find(u => u.pid === p1.player_id) || null : null;
  const cands = users.some(u => u.kind === "super") ? users.filter(u => u.kind === "super") : users;
  if (cands.length > 1){ await patchJanken(jById(id), { phase: "conflict", conflict: { cands, p1u } }); return; }
  await finishTickets(jById(id), users, cands[0] || null, p1u, false);
}
async function resolveConflict(j, winner){
  const users = Object.entries(j.declare || {}).filter(([, k]) => k && k !== "none").map(([pid, kind]) => ({ pid, kind }));
  await finishTickets(j, users, winner, (j.conflict && j.conflict.p1u) || null, true);
}
async function finishTickets(j, users, winner, p1u, hadJanken){
  const list = winner ? [winner] : [];
  if (p1u && !list.some(u => u.pid === p1u.pid)) list.push(p1u);
  const blocked = users.filter(u => !list.some(x => x.pid === u.pid));
  const why = !hadJanken ? "superが優先のため" : blocked.some(u => u.kind === "normal") && winner && winner.kind === "super" ? "superが優先・じゃんけんの結果" : "じゃんけんの結果";
  await applyTickets(j, list, blocked.length ? `${why}、${blocked.map(u => pname(u.pid)).join("・")}の${blocked.every(u => u.kind === "super") ? "super" : "券"}は使えません（券は手元に残ります）` : "");
}
async function applyTickets(j, list, note){
  const t = tripOfJ(j);
  const exempt = [...(j.exempt || [])], supers = [...(j.supers || [])], lives = { ...j.lives }, used = [...(j.tickets_used || [])];
  for (const u of list){
    const tk = ownTickets(t, u.pid, u.kind)[0]; if (!tk) continue;
    if (!(await q(sb.from("tickets").update({ status: "used", janken_id: j.id }).eq("id", tk.id), "記録"))) continue;
    used.push(u);
    if (u.kind === "super"){ supers.push(u.pid); lives[u.pid] = 0; } else exempt.push(u.pid);
  }
  await loadTable("tickets");
  seenPhase[j.id] = "play";
  await patchJanken(j, { phase: "play", conflict: null, exempt, supers, lives, tickets_used: used });
  flash(list.length ? "一斉オープン！" : "一斉オープン", list.length ? list.map(u => `${pname(u.pid)}：${u.kind === "super" ? "super免除券" : "免除券"}`).join("　") : "誰も使いませんでした");
  if (note) setTimeout(() => toast(note, 4000), 1900);
}
function openManualUse(j){
  const t = tripOfJ(j), p1 = privOf(t, 1);
  const holders = j.participants.filter(id => !(j.supers || []).includes(id) && tcount(t, id) > 0);
  const s = openSheet("券を使う", `<p class="note">じゃんけんを始める前に宣言してください。一度使った券は返ってきません。</p>${chipPlayers(holders, [])}
    <div class="dbtns big"><button class="n" data-k="normal">免除券を使う</button><button class="s" data-k="super">superを使う</button></div>`);
  bindChips(s, "data-p", false);
  s.querySelectorAll("[data-k]").forEach(b => b.onclick = async () => {
    const [pid] = picked(s, "data-p"); if (!pid){ toast("使う人を選んでください"); return; }
    const kind = b.dataset.k;
    if (!tcount(t, pid, kind)){ toast("その券を持っていません"); return; }
    const others = (j.tickets_used || []).filter(u => !(p1 && u.pid === p1.player_id));
    if (kind === "normal" && p1 && (j.tickets_used || []).some(u => u.pid === p1.player_id && u.kind === "super") && pid !== p1.player_id){ toast("特権一の持ち主がsuperを使っているため、免除券は使えません", 3000); return; }
    if (others.length && !(p1 && pid === p1.player_id)){ toast(others.some(u => u.kind === "super") ? "superが使われているため、免除券は使えません" : "免除券等の同時使用はできません（第十三条）", 3000); return; }
    closeSheet(); await applyTickets(jById(j.id), [{ pid, kind }]);
  });
}
function openForce(j){
  const t = tripOfJ(j), p5 = privOf(t, 5);
  const targets = j.participants.filter(id => id !== p5.player_id && j.declare[id] === null && tcount(t, id) > 0);
  if (!targets.length){ toast("強制使用できる相手（未宣言の所持者）がいません"); return; }
  const s = openSheet("特権五：免除券強制使用", `<p class="note">${esc(pname(p5.player_id))}以外の所持者でじゃんけんし、負けた人を選んでください。使う券の種類は本人が選びます。（残り${6 - (p5.uses || 0)}回）</p>${chipPlayers(targets, [])}
    <div class="dbtns big"><button class="n" data-k="normal">免除券を使わせる</button><button class="s" data-k="super">superを使わせる</button></div>`);
  bindChips(s, "data-p", false);
  s.querySelectorAll("[data-k]").forEach(b => b.onclick = async () => {
    const [pid] = picked(s, "data-p"); if (!pid){ toast("負けた人を選んでください"); return; }
    if (!tcount(t, pid, b.dataset.k)){ toast("その券を持っていません"); return; }
    closeSheet();
    await q(sb.from("privileges").update({ uses: (p5.uses || 0) + 1 }).eq("id", p5.id), "記録");
    await loadTable("privileges");
    const jj = jById(j.id); if (jj && jj.declare[pid] === null) declareTicket(jj, pid, b.dataset.k, "特権五");
  });
}
async function stop(j){
  if (!confirm("このじゃんけんを中止しますか？\n支払いは記録されず、このじゃんけんで使った特権・免除券・superは使っていないことになります。")) return;
  if (!(await q(sb.from("jankens").update({ status: "cancel" }).eq("id", j.id), "中止"))) return;
  const t = tripOfJ(j);
  const p3 = j.priv3_by && privOf(t, 3);
  if (p3){ const det = [...(p3.uses_detail || [])]; const k = det.lastIndexOf(travelType(j.category)); if (k >= 0) det.splice(k, 1); await q(sb.from("privileges").update({ uses: Math.max(0, (p3.uses || 0) - 1), uses_detail: det }).eq("id", p3.id), "記録"); }
  const forced = Object.values(j.proxy || {}).filter(v => v === "特権五").length, p5 = privOf(t, 5);
  if (forced && p5) await q(sb.from("privileges").update({ uses: Math.max(0, (p5.uses || 0) - forced) }).eq("id", p5.id), "記録");
  const usedTk = db.tickets.filter(x => x.janken_id === j.id && x.status === "used");
  if (usedTk.length) await q(sb.from("tickets").update({ status: "own", janken_id: null }).in("id", usedTk.map(x => x.id)), "記録");
  await Promise.all([loadTable("jankens"), loadTable("privileges"), loadTable("tickets")]); closeArena();
  toast((p3 || forced || usedTk.length) ? "中止しました（使った特権・免除券・superは元に戻しました）" : "中止しました", 3000);
}
async function settle(j, payer){
  if (busy) return; busy = true;
  const t = db.trips.find(x => x.id === j.trip_id);
  let ok;
  const parts = j.participants.filter(id => !(j.supers || []).includes(id));
  const extra = { tickets_used: j.tickets_used || [] };
  if (j.advanced_by) extra.advanced_by = j.advanced_by;
  if (j.payment_id) ok = await q(sb.from("payments").update({ payer_id: payer, participants: parts, ...extra }).eq("id", j.payment_id), "確定");
  else ok = await q(sb.from("payments").insert({ trip_id: j.trip_id, seq: nextSeq(t), label: j.label, amount: j.amount, category: j.category, payer_id: payer, participants: parts, ...extra }), "確定");
  if (ok) ok = await q(sb.from("jankens").update({ status: "done", payer_id: payer }).eq("id", j.id), "確定");
  busy = false;
  if (!ok) return;
  await Promise.all([loadTable("payments"), loadTable("jankens")]);
  closeArena();
  toast(`${pname(payer)}が ${yen(j.amount)} を支払い`);
  const next = j.payment_id && nextSplit(j.payment_id);
  if (next && confirm(`続けて「${next.label}」のじゃんけんをしますか？`)) startFromPayment(next.id);
}
function nextSplit(pid){
  const p = db.payments.find(x => x.id === pid);
  if (!p || !p.split_group) return null;
  return db.payments.filter(x => x.split_group === p.split_group && !x.payer_id).sort((a, b) => a.seq - b.seq)[0] || null;
}

/* ---------- 券・特権タブ ---------- */
let rouletteDay = null;
function tripWinner(t){
  const rows = standings(t).filter(r => typeof r.rank === "number");
  return rows.length && rows[0].paid > 0 ? rows[0].id : null;
}
function deptStats(trips){
  const st = {};
  const get = id => st[id] || (st[id] = { cats: {}, total: 0, wins: 0, joins: 0, drives: 0 });
  trips.forEach(t => {
    tripPays(t).filter(p => p.payer_id).forEach(p => {
      (p.participants || []).forEach(id => get(id).joins++);
      const s = get(p.payer_id); s.wins++; s.total += p.amount; s.cats[p.category] = (s.cats[p.category] || 0) + p.amount;
    });
    db.drives.filter(d => d.trip_id === t.id).forEach(d => get(d.player_id).drives++);
  });
  return st;
}
function leaders(st, dept){
  let best = 0, ids = [];
  for (const [id, s] of Object.entries(st)){
    const v = dept === "支払勝率" ? (s.joins ? (s.wins + s.drives) / s.joins : 0) : dept === "総合" ? s.total : (s.cats[dept] || 0);
    if (v <= 0) continue;
    if (v > best + 1e-9){ best = v; ids = [id]; } else if (Math.abs(v - best) < 1e-9) ids.push(id);
  }
  return ids;
}
function initialPlan(t){
  const prior = tripsSorted().filter(x => x.season === t.season && x.no < t.no);
  if (!prior.length) return { first: true, items: [] };
  const st = deptStats(prior), ok = activeMembers(t), items = [];
  leaders(st, "総合").forEach(id => ok.includes(id) && items.push({ player_id: id, kind: "super", source: "初期：シーズン総合1位" }));
  DEPTS.forEach(d => leaders(st, d).forEach(id => ok.includes(id) && items.push({ player_id: id, kind: "normal", source: `初期：${d}部門1位` })));
  const pv = prevTrip(t), w = pv && tripWinner(pv);
  if (w && ok.includes(w)){
    items.push({ player_id: w, kind: "super", source: "初期：前回優勝" });
    items.push({ player_id: w, kind: "normal", source: "初期：前回優勝" });
  }
  return { first: false, items };
}
async function giveInitial(t){
  const plan = initialPlan(t);
  if (plan.first){ toast("シーズン最初の旅は配布なしです"); return; }
  const old = db.tickets.filter(x => x.trip_id === t.id && (x.source || "").startsWith("初期"));
  if (old.some(x => x.status === "used")){ toast("初期配布の券がすでに使われているため、配布し直せません", 3200); return; }
  if (old.length && !confirm("初期配布をやり直しますか？（今の初期配布分は消えます）")) return;
  if (old.length && !(await q(sb.from("tickets").delete().in("id", old.map(x => x.id)), "配布"))) return;
  if (plan.items.length && !(await q(sb.from("tickets").insert(plan.items.map(x => ({ ...x, trip_id: t.id }))), "配布"))) return;
  await loadTable("tickets"); render();
  toast(`${plan.items.length}枚を配布しました`);
}

    <div id="tvrows">${rowHtml(n++, "新幹線", "新幹線(行き)")}${rowHtml(n++, "新幹線", "新幹線(帰り)")}${rowHtml(n++, "宿", "宿①")}</div>

    <div class="ttl"><div><small>今回入力した合計</small><b class="num" id="tvsum">¥0</b></div><div><small>旅費総額（登録済み含む）</small><b class="num" id="tvall">${yen(reg.reduce((a, p) => a + p.amount, 0))}</b></div></div>

/* ---------- ルーレット ---------- */
function rankHolder(t, r){
  const rows = standings(t).filter(x => typeof x.rank === "number");
  const hit = rows.find(x => x.rank === Number(r));
  return hit ? hit.id : (rows[Number(r) - 1] || {}).id || null;
}
function openRoulette(t, day, onDone){
  const n = activeMembers(t).length;
  const s = openSheet(`${day}日目のルーレット`, `<div class="wheel"><span class="num" id="rn">?</span><small>位が獲得</small></div><div class="btns"><button class="btn" id="rgo">回す</button></div>`);
  $("#rgo").onclick = () => {
    $("#rgo").disabled = true;
    const final = 1 + Math.floor(Math.random() * n);
    let i = 0, delay = 50; const el = $("#rn");
    const step = () => {
      el.textContent = (i % n) + 1; i++; delay *= 1.12;
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
      if (delay < 420) setTimeout(step, delay);
      else {
        el.textContent = final; el.classList.add("hitn");
        if (navigator.vibrate) navigator.vibrate(80);
        setTimeout(async () => { if (await putSetting(`roulette:${t.id}:${day}`, final)){ await loadTable("app_settings"); flash(`${final}位が獲得！`, `${day}日目のsuper免除券`); if (onDone) onDone(); else { closeSheet(); render(); } } }, 900);
      }
    };
    step();
  };
}
async function grantRoulette(t, day){
  const r = setting(`roulette:${t.id}:${day}`), pid = rankHolder(t, r);
  if (!pid) return;

  if (await q(sb.from("tickets").insert({ trip_id: t.id, player_id: pid, kind: "super", source: `ルーレット：${day}日目・${r}位` }), "付与")){

/* ---------- ピタリ賞・ニアピン賞 ---------- */
function prizeResults(t){
  const paid = Object.fromEntries(standings(t).map(r => [r.id, r.paid]));
  return activeMembers(t).map(id => {
    const pr = db.predictions.find(p => p.trip_id === t.id && p.player_id === id);
    if (!pr || pr.amount == null) return { id, pred: null, paid: paid[id] || 0, exempt: 0 };
    const v = paid[id] || 0, diff = v - pr.amount;
    const v100 = Math.floor(v / 100) * 100, p100 = Math.floor(pr.amount / 100) * 100;  // 判定は100円単位（100円未満は切り捨て）
    const pitari = v100 === p100;
    const near = !pitari && Math.abs(v100 - p100) <= 1000;
    return { id, pred: pr.amount, paid: v, diff, prize: pitari ? "ピタリ賞" : near ? "ニアピン賞" : null, exempt: pitari ? v : near ? Math.round(v / 2) : 0 };
  });
}

}

/* ---------- 精算 ---------- */
function settlement(t){
  const ids = activeMembers(t), rows = standings(t);
  const burden = Object.fromEntries(t.members.map(id => [id, (rows.find(r => r.id === id) || {}).paid || 0]));
  const prizes = prizeResults(t).filter(r => r.exempt > 0);
  prizes.forEach(r => { burden[r.id] -= r.exempt; const others = ids.filter(x => x !== r.id); others.forEach(x => burden[x] += r.exempt / others.length); });
  const outlay = Object.fromEntries(t.members.map(id => [id, 0]));
  tripPays(t).filter(p => p.payer_id).forEach(p => { const who = p.advanced_by || p.payer_id; outlay[who] = (outlay[who] || 0) + p.amount; });
  const bal = t.members.map(id => ({ id, v: Math.round(outlay[id] - burden[id]) }));
  const cred = bal.filter(b => b.v > 0).sort((a, b) => b.v - a.v), debt = bal.filter(b => b.v < 0).map(b => ({ ...b, v: -b.v })).sort((a, b) => b.v - a.v);
  const tx = []; let i = 0, k = 0;
  while (i < debt.length && k < cred.length){
    const m = Math.min(debt[i].v, cred[k].v);
    if (m > 0) tx.push({ from: debt[i].id, to: cred[k].id, amt: m });
    debt[i].v -= m; cred[k].v -= m;
    if (debt[i].v <= 0) i++; if (cred[k].v <= 0) k++;
  }
  return { burden, outlay, tx, prizes };
}

    </tbody></table>
    ${st.prizes.length ? `<p class="note">賞：${st.prizes.map(r => `${esc(pname(r.id))} ${r.prize}（${yen(r.exempt)}免除）`).join("、")}</p>` : ""}
    <div class="h2" style="margin-top:18px">送金<small>${st.tx.length}件</small></div>
    ${st.tx.length ? st.tx.map(x => `<div class="txrow"><span><span class="dot" style="background:${pcolor(x.from)}"></span>${esc(pname(x.from))}</span><span class="arrow">→</span><span><span class="dot" style="background:${pcolor(x.to)}"></span>${esc(pname(x.to))}</span><b class="num">${yen(x.amt)}</b></div>`).join("") : `<p class="note">送金は不要です。立替えや賞の免除がなければ、じゃんけんで決まった人がその場で払って完了です。</p>`}`);
}

function threePeats(){
  const out = []; let prev = null, streak = 0;
  tripsSorted().forEach(t => {

    if (w && w === prev) streak++; else streak = w ? 1 : 0;

  });

}

/* ---------- SVGチャート ---------- */
function lineChart(series, n, opt = {}){
  const W = 340, H = opt.h || 190, L = opt.left || 44, Rr = 10, T = 12, B = 22;
  const vals = series.flatMap(s => s.pts.filter(v => v != null));
  let lo = opt.min ?? Math.min(0, ...vals), hi = opt.max ?? Math.max(1, ...vals);
  if (lo === hi) hi = lo + 1;
  const x = i => L + (n <= 1 ? 0 : i * (W - L - Rr) / (n - 1));
  const y = v => opt.invert ? T + (v - lo) / (hi - lo) * (H - T - B) : H - B - (v - lo) / (hi - lo) * (H - T - B);
  const ticks = opt.ticks || [lo, (lo + hi) / 2, hi];
  let g = ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${opt.fmt ? opt.fmt(v) : v}</text>`).join("");
  if (opt.zero && lo < 0 && hi > 0) g += `<line x1="${L}" x2="${W - Rr}" y1="${y(0)}" y2="${y(0)}" class="zero"/>`;
  (opt.bands || []).forEach(b => g += `<line x1="${x(b.i)}" x2="${x(b.i)}" y1="${T}" y2="${H - B}" class="band"/><text x="${x(b.i) + 3}" y="${H - 6}" class="ax">${esc(b.label)}</text>`);
  const lines = series.map(s => {
    const d = s.pts.map((v, i) => v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);
    if (!d.length) return "";
    const path = opt.step ? s.pts.map((v, i) => v == null ? "" : (i ? `H${x(i).toFixed(1)}V${y(v).toFixed(1)}` : `M${x(i).toFixed(1)},${y(v).toFixed(1)}`)).join("") : "M" + d.join("L");
    const last = s.pts.length - 1;
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="ln"/>` +
      (s.pts[last] != null ? `<circle cx="${x(last)}" cy="${y(s.pts[last])}" r="4.5" fill="${s.color}" stroke="var(--ink)" stroke-width="1.5"/>` : "");
  }).join("");
  const marks = (opt.marks || []).map(m => `<g transform="translate(${x(m.i)},${y(m.v)})"><path d="M0,-8L2.4,-2.4L8,0L2.4,2.4L0,8L-2.4,2.4L-8,0L-2.4,-2.4Z" fill="${m.color}" stroke="var(--ink)" stroke-width="1"/></g>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || "グラフ")}">${g}${lines}${marks}</svg>`;
}
function legend(ids){ return `<div class="legend">${ids.map(id => `<span><i style="background:${pcolor(id)}"></i>${esc(pname(id))}</span>`).join("")}</div>`; }
function donut(items){
  const total = items.reduce((s, x) => s + x.v, 0) || 1;
  let a = -Math.PI / 2, out = "";
  items.filter(x => x.v > 0).forEach(x => {
    const da = x.v / total * Math.PI * 2, a2 = a + da, r = 62, ri = 36, cx = 80, cy = 80;
    const p = (ang, rr) => `${(cx + rr * Math.cos(ang)).toFixed(2)},${(cy + rr * Math.sin(ang)).toFixed(2)}`;
    const big = da > Math.PI ? 1 : 0;
    out += da >= Math.PI * 2 - 1e-6 ? `<circle cx="80" cy="80" r="49" fill="none" stroke="${x.c}" stroke-width="26"/>` :
      `<path d="M${p(a, r)}A${r},${r} 0 ${big} 1 ${p(a2, r)}L${p(a2, ri)}A${ri},${ri} 0 ${big} 0 ${p(a, ri)}Z" fill="${x.c}" stroke="var(--ink)" stroke-width="1.5"/>`;
    a = a2;
  });
  return `<div class="donut"><svg viewBox="0 0 160 160" role="img" aria-label="割合">${out}<text x="80" y="76" text-anchor="middle" class="dc1">合計</text><text x="80" y="96" text-anchor="middle" class="dc2">${yen(total)}</text></svg>
    <div class="dl">${items.filter(x => x.v > 0).sort((a, b) => b.v - a.v).map(x => `<span><i style="background:${x.c}"></i>${esc(x.label)}<b>${(x.v / total * 100).toFixed(1)}%</b></span>`).join("")}</div></div>`;
}
const CAT_COLORS = { "1日目": "#FFD15C", "2日目": "#FFB020", "3日目": "#E8890C", "飛行機": "#3FC1C9", "新幹線": "#1F8FBF", "宿": "#8B6CFF", "車": "#5A6378", "おみや代": "#FF6FB5", "無駄枠": "#E2364F" };
const catColor = c => CAT_COLORS[c] || "#B9BFCC";
function stackBars(ids, data, cats){
  const max = Math.max(1, ...ids.map(id => cats.reduce((s, c) => s + (data[id][c] || 0), 0)));
  return `<div class="stack">${ids.map(id => {
    const tot = cats.reduce((s, c) => s + (data[id][c] || 0), 0);
    return `<div class="srow"><span class="sn"><i style="background:${pcolor(id)}"></i>${esc(pname(id))}</span><div class="sbar" style="width:${(tot / max * 100).toFixed(1)}%">${cats.map(c => data[id][c] ? `<i style="flex:${data[id][c]};background:${catColor(c)}" title="${esc(c)}"></i>` : "").join("")}</div><b class="num">${yen(tot)}</b></div>`;
  }).join("")}</div><div class="legend">${cats.filter(c => ids.some(id => data[id][c])).map(c => `<span><i style="background:${catColor(c)}"></i>${esc(c)}</span>`).join("")}</div>`;
}

/* ---------- 統計の計算 ---------- */
function computeStats(trips){
  const ids = allMembers(trips);
  const S = {}; ids.forEach(id => S[id] = { paid: 0, wins: 0, joins: 0, drives: 0, std: 0, max: 0, cats: {}, catJ: {}, catW: {}, bandJ: [0, 0, 0], bandW: [0, 0, 0], sizeJ: {}, sizeW: {},
    firstJ: 0, firstW: 0, dayFirstJ: 0, dayFirstW: 0, streakW: 0, streakL: 0, curW: 0, curL: 0, duelJ: 0, duelW: 0, vs: {}, oneOut: 0, oneOutJ: 0,
    tUse: 0, sUse: 0, soloW: 0, soloJ: 0, sSaved: 0, exFire: 0, exHit: 0, extra: 0, timeAmt: [0, 0, 0], dayMax: 0, dayMin: null, leadPays: 0, trips: 0, tops: 0, points: 0 });
  const series = {}; ids.forEach(id => series[id] = []);
  const rankSeries = {}; ids.forEach(id => rankSeries[id] = []);
  const diffSeries = {}; ids.forEach(id => diffSeries[id] = []);
  const cum = Object.fromEntries(ids.map(id => [id, 0])), cumStd = Object.fromEntries(ids.map(id => [id, 0]));
  let leader = null, leadChanges = 0, steps = 0, maxComeback = { amt: 0, id: null };
  const leadMarks = [], bands = [];
  let biggestDrop = { amt: 0, id: null };
  trips.forEach((t, ti) => {
    if (trips.length > 1) bands.push({ i: steps, label: `${t.season}-${t.no}` });
    const pays = tripPays(t).filter(p => p.payer_id);
    const dayAmt = {};
    let lastDay = null;
    pays.forEach((p, pi) => {
      const parts = (p.participants || []).filter(id => S[id]);
      const n = parts.length || 1;
      const band = p.amount >= 10000 ? 2 : p.amount >= 3000 ? 1 : 0;
      const d = payDate(p), dkey = d ? d.toDateString() : p.category;
      const isDayFirst = dkey !== lastDay; lastDay = dkey;
      parts.forEach(id => {
        const s = S[id]; s.joins++; s.std += p.amount / n; cumStd[id] += p.amount / n;
        s.catJ[p.category] = (s.catJ[p.category] || 0) + 1; s.bandJ[band]++; s.sizeJ[n] = (s.sizeJ[n] || 0) + 1;
        if (pi === 0) s.firstJ++;
        if (isDayFirst) s.dayFirstJ++;
        if (id === p.payer_id){ s.curW++; s.curL = 0; s.streakW = Math.max(s.streakW, s.curW); }
        else { s.curL++; s.curW = 0; s.streakL = Math.max(s.streakL, s.curL); }
      });
      const w = S[p.payer_id];
      if (w){
        w.paid += p.amount; w.wins++; w.max = Math.max(w.max, p.amount);
        w.cats[p.category] = (w.cats[p.category] || 0) + p.amount; w.catW[p.category] = (w.catW[p.category] || 0) + 1;
        w.bandW[band]++; w.sizeW[n] = (w.sizeW[n] || 0) + 1;
        if (pi === 0) w.firstW++;
        if (isDayFirst) w.dayFirstW++;
        cum[p.payer_id] += p.amount;
        if (d && p.source !== "import"){ const h = d.getHours(); w.timeAmt[h < 11 ? 0 : h < 17 ? 1 : 2] += p.amount; }
        dayAmt[p.payer_id] = dayAmt[p.payer_id] || {}; dayAmt[p.payer_id][dkey] = (dayAmt[p.payer_id][dkey] || 0) + p.amount;
      }
      (p.tickets_used || []).forEach(u => { if (S[u.pid]){ if (u.kind === "super"){ S[u.pid].sUse++; S[u.pid].sSaved += p.amount / (n + 1); } else S[u.pid].tUse++; } });
      // 首位の推移
      const top = ids.slice().sort((a, b) => cum[b] - cum[a])[0];
      const prevRanks = ids.map(id => [id, (rankSeries[id].slice(-1)[0])]);
      if (cum[top] > 0 && top !== leader){
        if (leader){ leadChanges++; leadMarks.push({ i: steps, v: cum[top], color: pcolor(top) });
          const gap = cum[top] - cum[leader]; }
        leader = top;
      }
      if (leader && S[leader]) S[leader].leadPays++;
      const sorted = ids.slice().sort((a, b) => cum[b] - cum[a]);
      ids.forEach(id => {
        series[id].push(cum[id]); diffSeries[id].push(Math.round(cum[id] - cumStd[id]));
        rankSeries[id].push(sorted.indexOf(id) + 1);
      });
      prevRanks.forEach(([id, r]) => { if (r && rankSeries[id].slice(-1)[0] < r){ /* 順位上昇 */ } });
      steps++;
    });
    ids.forEach(id => {
      if (!dayAmt[id] && !t.members.includes(id)) return;
      const days = Object.values(dayAmt[id] || {});
      if (days.length){ S[id].dayMax = Math.max(S[id].dayMax, ...days); }
    });
    tripRanks(t).forEach(r => { if (S[r.id]){ S[r.id].trips++; S[r.id].points += r.pts; if (r.rank === 1 && r.paid > 0) S[r.id].tops++; } });
    db.drives.filter(x => x.trip_id === t.id).forEach(x => { if (S[x.player_id]) S[x.player_id].drives++; });
    // じゃんけんの進行データ（アプリで記録した分）
    db.jankens.filter(j => j.trip_id === t.id && j.status === "done").forEach(j => {
      const hist = [...(j.history || []).map(h => h && h.l ? h.l : h), j.lives].filter(Boolean);
      const parts = j.participants.filter(id => S[id] && !(j.supers || []).includes(id));
      if (j.priv3_by) parts.forEach(id => { if (id !== j.priv3_by) S[id].extra++; });
      parts.forEach(id => S[id].soloJ++);
      (j.solos || []).forEach(id => { if (S[id]) S[id].soloW++; });
      (j.exempt_done || []).forEach(id => { if (S[id]){ S[id].exFire++; if (j.payer_id === id) S[id].exHit++; } });
      // 1回目で抜けた
      if (hist.length >= 2){
        parts.forEach(id => { S[id].oneOutJ++; if ((hist[0][id] || 0) > 0 && (hist[1][id] || 0) === 0 && j.payer_id !== id) S[id].oneOut++; });
      }
      // 一騎打ち（残り2人になった場面）
      for (let k = hist.length - 1; k >= 0; k--){
        const alive = parts.filter(id => (hist[k][id] || 0) > 0);
        if (alive.length === 2){
          alive.forEach(id => { S[id].duelJ++; const op = alive.find(x => x !== id); S[id].vs[op] = S[id].vs[op] || { j: 0, w: 0 }; S[id].vs[op].j++; if (j.payer_id === id){ S[id].duelW++; S[id].vs[op].w++; } });
          break;
        }
      }
    });
  });
  // 最大の逆転：一番大きく離されていた差から首位に立った額
  ids.forEach(id => {
    let worst = 0;
    series[id].forEach((v, i) => {
      const topv = Math.max(...ids.map(x => series[x][i]));
      worst = Math.max(worst, topv - v);
      if (topv === v && v > 0 && worst > maxComeback.amt){ maxComeback = { amt: worst, id }; }
    });
    let peak = 0; let wasTop = false;
    series[id].forEach((v, i) => {
      const topv = Math.max(...ids.map(x => series[x][i]));
      if (topv === v && v > 0){ wasTop = true; peak = 0; }
      if (wasTop) peak = Math.max(peak, topv - v);
    });
    if (peak > biggestDrop.amt) biggestDrop = { amt: peak, id };
  });
  return { ids, S, series, rankSeries, diffSeries, steps, leadChanges, leadMarks, bands, maxComeback, biggestDrop };
}

/* ---------- 集計タブ ---------- */
function viewStats(t){
  if (!db.trips.length) return `<div class="empty"><b>まだ旅がありません</b>旅の記録がたまると、ここに集計が並びます。</div>`;
  const trips = scopeTrips();
  const st = computeStats(trips);
  const ids = st.ids.filter(id => st.S[id].joins > 0 || st.S[id].paid > 0);
  let h = `<div class="stickybar"><div class="filter scope">${[["trip", "今回の旅"], ["season", t ? `SEASON ${t.season}` : "シーズン"], ["all", "全期間"]].map(([k, l]) => `<button data-scope="${k}" aria-pressed="${statScope === k}">${l}</button>`).join("")}</div></div>`;

  h += `<div class="kpis"><div><small>支払い件数</small><b class="num">${st.steps}</b></div><div><small>総額</small><b class="num">${yen(total)}</b></div><div><small>首位交代</small><b class="num">${st.leadChanges}回</b></div></div>`;
  h += `<div class="h2">累計支払額の推移${statScope === "trip" ? "<small>◆＝首位交代</small>" : ""}</div><div class="card chartcard">${lineChart(ids.map(id => ({ color: pcolor(id), pts: st.series[id] })), st.steps, { fmt: v => v >= 10000 ? Math.round(v / 1000) / 10 + "万" : Math.round(v), marks: statScope === "trip" ? st.leadMarks : [], bands: st.bands, label: "累計支払額の推移" })}${legend(sortedIds)}</div>`;

  groups.forEach(([gname, rows], gi) => {
    if (!rows.length) return;
    h += `<details class="sgroup" data-g="${gname}" ${statOpen.has(gname) ? "open" : ""}><summary class="sgt">${gname}</summary>`;

      if (label === "__vs"){ h += vsTable(ids, S); return; }

    });

    h += `<div class="sgroup"><div class="sgt">記録</div>${st.maxComeback.id ? `<div class="rec"><span>最大の逆転</span><b>${esc(pname(st.maxComeback.id))}　${yen(st.maxComeback.amt)}差から首位へ</b></div>` : ""}${st.biggestDrop.id ? `<div class="rec"><span>首位からの最大転落</span><b>${esc(pname(st.biggestDrop.id))}　首位から${yen(st.biggestDrop.amt)}差</b></div>` : ""}</div>`;

    const pr = prizeResults(t).filter(r => r.pred != null);

  }
  return h;
}

function vsTable(ids, S){

const TILE = {"北海道":[11,0,2],"青森":[12,2],"秋田":[11,3],"岩手":[12,3],"山形":[11,4],"宮城":[12,4],"石川":[8,5],"富山":[9,5],"新潟":[10,5],"福島":[11,5],

  "佐賀":[0,9],"長崎":[0,10],"熊本":[1,10],"宮崎":[2,10],"高知":[3,10],"徳島":[4,10],"鹿児島":[1,11],"沖縄":[0,13],
  "韓国":[0,6,1,"x"],"ハワイ":[11,12,2,"x"]};
function japanMap(trips){
  const visits = {};
  trips.forEach(x => (x.prefectures && x.prefectures.length ? x.prefectures : parsePrefs(x.place || x.name)).forEach(p => { (visits[p] = visits[p] || []).push(x); }));
  const colorOf = p => {
    const v = visits[p] || [];
    if (mapMode === "all") return v.length ? seasonColor(v[0].season) : null;
    if (mapMode === "season"){ const w = v.filter(x => x.season === mapSeason); return w.length ? seasonColor(mapSeason) : null; }
    const won = v.map(x => { const r = tripRanks(x)[0]; return r && r.paid > 0 ? r : null; }).filter(Boolean);
    if (mapMode === "player"){ return won.some(r => r.id === mapPlayer) ? pcolor(mapPlayer) : null; }
    if (!won.length) return null;
    return pcolor(won.sort((a, b) => b.paid - a.paid)[0].id);
  };
  const Z = 26, G = 3;
  let cells = "";
  Object.entries(TILE).forEach(([p, [cx, cy, w, ex]]) => {
    const ww = w || 1, sz = ww * Z + (ww - 1) * G, hh = ex ? Z : sz, x = cx * (Z + G), y = cy * (Z + G);
    const col = colorOf(p), cnt = (visits[p] || []).length;
    cells += `<g class="tl ${col ? "on" : ""}" data-pref="${p}"><rect x="${x}" y="${y}" width="${sz}" height="${hh}" rx="${ex ? 13 : 5}" fill="${col || "#fff"}" stroke="var(--ink)" stroke-width="${col ? 2 : 1}" ${ex ? 'stroke-dasharray="3 2"' : ""} ${col ? `style="filter:drop-shadow(0 0 4px ${col})"` : ""}/>
      <text x="${x + sz / 2}" y="${y + hh / 2 + 3.5}" text-anchor="middle" class="tt ${col ? "on" : ""}">${p.length > 2 && !w ? p.slice(0, 2) : p}</text>${cnt > 1 ? `<text x="${x + sz - 3}" y="${y + 9}" text-anchor="end" class="tc">${cnt}</text>` : ""}</g>`;
  });
  const W = 13 * (Z + G), H = 14 * (Z + G);
  const on = Object.keys(TILE).filter(p => colorOf(p));
  const dom = on.filter(p => !TILE[p][3]).length, abroad = on.filter(p => TILE[p][3]).length;
  let leg = "";
  if (mapMode === "all" || mapMode === "season"){ const ss = [...new Set(on.flatMap(p => (visits[p] || []).map(x => x.season)))].filter(sn => mapMode === "all" || sn === mapSeason).sort((a, b) => a - b); leg = ss.map(sn => `<span><i style="background:${seasonColor(sn)}"></i>SEASON ${sn}</span>`).join(""); }
  else { const ps = [...new Set(on.map(p => colorOf(p)))]; leg = db.players.filter(pl => ps.includes(pl.color)).map(pl => `<span><i style="background:${pl.color}"></i>${esc(pl.name)}</span>`).join(""); }
  return `<div class="jmap"><svg viewBox="-4 -4 ${W + 8} ${H + 8}" role="img" aria-label="過去の旅行先の地図">${cells}</svg></div>
    <p class="note mapinfo" style="margin:6px 0 0">${dom}／47都道府県${abroad ? `・海外${abroad}` : ""}${mapMode === "winner" ? `<span class="mapnote">複数回訪れた場所：優勝金額が高いプレイヤー色</span>` : ""}</p>
    <div class="legend">${leg}</div>`;
}

function guessPlayer(name){
  const ps = db.players;
  const exact = ps.find(p => p.name === name); if (exact) return exact.id;
  const inc = ps.find(p => name.includes(p.name) || p.name.includes(name)); if (inc) return inc.id;
  const pre = ps.find(p => p.name.slice(0, 2) === name.slice(0, 2)); return pre ? pre.id : "";
}

function openImportMap(d){
  const names = [...new Set(d.trips.flatMap(t => [...t.members, ...t.payments.map(p => p.payer)]))];
  const exists = new Set(db.trips.map(t => t.no));
  const s = openSheet("過去データの取り込み", `
    <p class="note">ファイルの名前を、登録済みのプレイヤーに対応させてください。いない人は「新しく登録」で追加されます。</p>
    ${names.map((n, i) => `<label class="f"><span>${esc(n)}</span><select data-map="${i}"><option value="">新しく登録する</option>${db.players.map(p => `<option value="${p.id}" ${guessPlayer(n) === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label>`).join("")}
    <div class="h2" style="margin-top:8px">取り込む旅</div>
    ${d.trips.map(t => `<div class="plist"><b>第${t.no}回 ${t.year}${t.term} ${esc(t.place)}</b><span class="note" style="margin:0">${t.payments.length}件${exists.has(t.no) ? "・登録済みのため飛ばす" : ""}</span></div>`).join("")}
    <div class="btns"><button class="btn" id="impgo">取り込む</button></div>`);
  $("#impgo").onclick = async () => {
    const map = {}; const btn = $("#impgo"); btn.disabled = true; btn.textContent = "取り込み中…";
    try {
      const used = db.players.map(p => (p.color || "").toUpperCase());
      for (let i = 0; i < names.length; i++){
        let id = s.querySelector(`[data-map="${i}"]`).value;
        if (!id){
          const color = COLORS.find(c => !used.includes(c.toUpperCase())) || COLORS[i % COLORS.length]; used.push(color.toUpperCase());
          const res = await q(sb.from("players").insert({ name: names[i], color, sort: db.players.length + i }).select().single(), "登録");
          if (!res) throw new Error("プレイヤーを登録できませんでした");
          id = res.id;
        }
        map[names[i]] = id;
      }
      let added = 0;
      for (const t of d.trips){
        if (exists.has(t.no)) continue;
        const members = t.members.map(n => map[n]);
        const row = { no: t.no, season: t.season, year: t.year, term: t.term, place: t.place, name: `${t.year}${t.term} ${t.place}`,
          start_date: t.start_date, end_date: t.end_date, days: Math.round((new Date(t.end_date) - new Date(t.start_date)) / 864e5) + 1,
          members, champion_out: null, prefectures: parsePrefs(t.place) };
        const tr = await q(sb.from("trips").insert(row).select().single(), "取り込み"); if (!tr) throw new Error(`第${t.no}回を登録できませんでした`);
        const pays = t.payments.map(p => ({ trip_id: tr.id, seq: p.seq, label: p.label, amount: p.amount, category: p.category, payer_id: map[p.payer], participants: members, created_at: p.created_at, source: "import" }));
        for (let k = 0; k < pays.length; k += 100) if (!(await q(sb.from("payments").insert(pays.slice(k, k + 100)), "取り込み"))) throw new Error(`第${t.no}回の支払いを登録できませんでした`);
        const drv = Object.entries(t.drives || {}).flatMap(([n, c]) => Array.from({ length: c }, () => ({ trip_id: tr.id, player_id: map[n], created_at: `${t.start_date}T12:00:00+09:00`, source: "import" })));
        if (drv.length && !(await q(sb.from("drives").insert(drv), "取り込み"))) throw new Error(`第${t.no}回の運転を登録できませんでした`);
        added++;
      }
      await Promise.all(TABLES.map(loadTable));
      if (!curTrip()){ const last = tripsSorted().pop(); if (last){ await putSetting("current_trip", last.id); await loadTable("app_settings"); } }
      closeSheet(); render(); flash("取り込み完了！", `${added}回分の旅を登録しました`);
    } catch (e) { toast((e && e.message) || "取り込みに失敗しました", 4000); btn.disabled = false; btn.textContent = "取り込む"; await Promise.all(TABLES.map(loadTable)); render(); }
  };
}
/* シーズンファイナル：同じシーズンで直前3回が同じ優勝者 */
function isFinal(t){
  const prev = tripsSorted().filter(x => x.no < t.no).slice(-3);
  if (prev.length < 3 || prev.some(x => x.season !== t.season)) return false;
  const w = prev.map(tripWinner);
  return w[0] && w.every(x => x === w[0]);
}
function threePeatHolder(){
  const prev = tripsSorted().slice(-3);
  if (prev.length < 3 || prev.some(x => x.season !== prev[0].season)) return null;
  const w = prev.map(tripWinner);
  return w[0] && w.every(x => x === w[0]) ? w[0] : null;
}

const b64u = s => { const p = "=".repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
async function pushState(){
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return isStandalone() ? "unsupported" : "browser";
  if (Notification.permission === "denied") return "denied";
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); return sub ? "on" : "off"; } catch (e) { return "off"; }
}
async function subscribePush(){
  if (!player(me)){ toast("先に「自分」を選んでください"); openMe(); return false; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted"){ toast("通知が許可されませんでした", 3000); return false; }
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const ok = await q(sb.from("push_subs").upsert({ player_id: me, endpoint: j.endpoint, subscription: j }, { onConflict: "endpoint" }), "登録");
    if (ok) toast("この端末で通知を受け取ります");
    return !!ok;
  } catch (e) { fail(e, "通知の登録"); return false; }
}
async function unsubscribePush(){
  try {
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    if (sub){ await q(sb.from("push_subs").delete().eq("endpoint", sub.endpoint), "解除"); await sub.unsubscribe(); }
    toast("この端末の通知を止めました");
  } catch (e) { fail(e, "通知の解除"); }
}

/* ホームのリマインドカード（その日の時刻を過ぎたら表示。「完了」で消せる） */
function reminderCards(t){
  const day = dayOf(t); if (!day) return "";
  const end = tripEnd(t), last = Math.round((new Date(end) - new Date(t.start_date)) / 864e5) + 1;
  const now = new Date(), hm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const tm = notifyTimes(), list = [];
  if (day < last) list.push(["night", "🌙", day === 1 ? "行きの旅費と宿泊費のじゃんけん" : "宿泊費のじゃんけん", "今夜のうちに決めましょう（第八条）"]);
  if (day === last) list.push(["lastday", "🧳", "帰りの旅費と車代のじゃんけん", "旅行終了の直前に（第八条）"], ["prize", "🎯", "ピタリ賞・ニアピン賞の判定", "全部の支払いが終わったら、免除・特権タブで確認"]);
  if (day === 1 && !t.travel_total) list.unshift(["start", "🎯", "旅費総額の提示とピタリ賞の予想", "前回4位の予約者が旅費総額を入力（免除・特権タブ）"]);
  return list.filter(([k]) => (k === "start" || hm >= tm[k]) && !localStorage.getItem(`ojk:done:${t.id}:${day}:${k}`))
    .map(([k, ic, b, sm]) => `<div class="remind"><span class="ri">${ic}</span><div><b>${b}</b><span>${sm}</span></div><button class="mini" data-rdone="${t.id}:${day}:${k}">完了</button></div>`).join("");
}

/* 特権カード（じゃんけん開始画面）：アイコン・持ち主のカラー枠・名前。三はスイッチ、四は自動不参加の表示付き */
function privArea(s, t, getCat){
  const box = s.querySelector("#privarea");
  let on3 = false, amt = 0;
  const draw = () => {
    if (!box) return;
    const ps = tripPrivs(t);
    box.innerHTML = ps.length ? `<div class="f"><span>特権</span></div>` + ps.map(p => {
      const m = PRIVS[p.kind], who = esc(pname(p.player_id));
      let extra = `<small>${m.desc}</small>`, ctl = "";
      if (p.kind === 3){
        const type = travelType(getCat()), used = p.uses_detail || [];
        const can = (p.uses || 0) < 2 && !used.includes(type);
        if (!can) on3 = false;
        extra = `<small>${can ? `${who}以外に一機追加。${type}枠で使えます（残り${2 - (p.uses || 0)}回）` : `${type}枠は使用済みです`}</small>`;
        ctl = `<button type="button" class="sw" id="p3sw" role="switch" aria-checked="${on3}" ${can ? "" : "disabled"} aria-label="特権三を使う"></button>`;
      } else if (p.kind === 4){
        const lim = PRIV4_LIMIT[p.day] || 8000, out = amt > 0 && amt <= lim;
        extra = `<small>${yen(lim)}以下に不参加。${amt > 0 ? (out ? `今回は${yen(amt)}なので不参加` : `今回は${yen(amt)}なので参加`) : "金額を入れると自動で判定"}</small>`;
      }
      return `<div class="pcard" style="--pc:${pcolor(p.player_id)}"><span class="pico" style="--pi:var(--priv-${p.kind})"></span><div class="pcb"><span class="pno">特権${KANJI[p.kind]}・<b>${who}</b></span><b class="pnm">${m.name}</b>${extra}</div>${ctl}</div>`;
    }).join("") : "";
    const sw = box.querySelector("#p3sw"); if (sw) sw.onclick = () => { on3 = !on3; sw.setAttribute("aria-checked", String(on3)); };
  };
  draw();
  return {
    refresh: draw,
    amount: v => {
      amt = v; draw();
      const p = privOf(t, 4); if (!p) return;
      const chip = s.querySelector(`[data-p="${p.player_id}"]`), out = v > 0 && v <= (PRIV4_LIMIT[p.day] || 8000);
      if (chip){ chip.setAttribute("aria-pressed", String(!out)); chip.disabled = out; }
    },
    p3: () => on3 ? (privOf(t, 3) || {}).player_id || null : null
  };

const RULES_DEFAULT = "第一編 総則\n(目的)\n第一条\n本要綱は、男気じゃんけん旅の公正化を図るとともに、各種事務処理の能率化を促進し、もって旅行の健全な実施に資することを目的とする。また、普段の生活では経験することのできない非日常感を味わうことで、より一層の健康、心の幸福感を得ようとするものである。\n\n(定義)\n第二条\nこの旅における「じゃんけん」は、旅中で発生する支払い及び運転全てに適用されるものとする。ただし、参加者に運転免許を取得していない者がいる場合は、この限りでない。なお、詳細な用語の定義は下記のとおりとする。\n一 旅費: 事前に予約した移動交通費、宿泊費、車に係る費用とする。\n二 旅中: 新幹線の場合には改札、飛行機の場合には保安検査場を始点及び終点とする。\n三 一機追加: じゃんけんで負けた場合に、即時復帰する制度のこと。\n\n(参加者)\n第三条\n参加人数は基本四人とし、都度、一から二人程度の追加人員を招集することができる。\n2 前項の規定により追加招集を行うときは、金銭的余裕のある人を選定することとし、必ず本人の同意を得なければならない。\n3 三連覇の者が出た場合の取扱いについては、第十八条で後述する。\n\n(実施時期)\n第四条\n一年間のうちに二回実施することとする。夏及び冬の開催を基本とするが、参加者の都合に応じて、臨機応変に定めることができる。\n\n(役割分担)\n第五条\n参加者は、前条の趣旨に従い、次に掲げる事項について役割を振り分けた上で実施すること。ただし、参加人数の都合上やむを得ない場合には、この限りでない。\n一 宿泊先、移動手段等の予約(立替え払いで対応すること。)\n二 支払実績額及び勝率等の記録\n三 写真撮影\n\n(事前協議)\n第六条\n本要綱に定める事項について、旅中に変更することはできない。ただし、疑義が生じた場合には、参加者全員で協議の上、調整を図ること。\n\n第二編 旅行中\n(金額設定)\n第七条\n参加者全員分の合計額を一度にじゃんけんで決めるものとする。ただし、目的地までの旅費(車代を除く)、宿泊費に限り、一人当たりの金額で計算をし、参加者の人数分だけじゃんけんを取り行うこととする。\n2 参加者が個人的な支払いをすることは認められず、その場合には、全員が当該個人と同等額の支払をするよう調整を図ること。\n\n(支払時期)\n第八条\n原則、支払が発生する毎にじゃんけんを行う。ただし、目的地までの旅費に関しては、次のとおり規定する。\n一 行きの旅費は、一泊目の夜\n二 帰りの旅費及び車代(高速代を含む)は、旅行終了直前\n三 宿泊費は、当該宿泊日の夜\n\n(支払方法)\n第九条\n現地の対応する決済方法に応じ、参加者内で立替えや両替等により臨機応変に支払うこと。ただし、事前予約により立替えた分については、振込みまたは現金での支払いとする。\n\n(運転)\n第十条\n運転の義務が発生する範囲は、移動距離を問わず、車が停止しかつ参加者のうち二人以上が同時に降車する時までとする。\n\n(上下関係)\n第十一条\n旅中に限り、支払実績額の多い順に序列を発生させることとする。各時点で一位の者が一番偉いため、決定権及び優先順位は、序列に従うこと。(本要綱において「参加者全員で協議すること」と規定しているものを除く。) なお、一位の特権制度は第十六条にて規定。\n\n(免除制度)\n第十二条\n免除制度として、免除券及びsuper免除券(以下、免除券等という。)が発行され、総合優勝者にはsuper免除券を一枚を、全十部門(1日目、2日目、3日目、飛行機、新幹線、宿、車、おみや代、無駄枠、支払勝率)において一位の者には各一枚ずつ免除券を初期配布する。\n2 免除券の効果は、支払いが確定した際に、再度参加者全員でじゃんけんをやり直すことができるものとする。\n3 super免除券の効果は、一件の支払につき、じゃんけん自体への参加を免除されるものとする。\n\n第十三条\n前条における免除券等の使用は、必ずじゃんけんが開始する前に申し出なければならず、支払いが確定しなかった場合でも返却はされない。なお、何れの免除券等を使用するかは一斉に宣言することとし、参加者内で事前に調整することは認められない。\n2 複数人での同時使用は禁止とし、申告が重複した場合には、じゃんけんで勝った者が使用を認められる。ただし、免除券とsuper免除券が重複した場合には、super免除券が優先される。\n\n第十四条\nsuper免除券は、一日に最低一枚発行しなければならない。発行方法は、旅費又は宿泊費のじゃんけん前時点での一定順位の者に与えられることとする。なお、獲得順位の決め方は、各日の一番最初にルーレットで決定する。追加での発行は全員で協議の上決定する。発行枚数に上限は設定しないが、その数量は厳格に管理しなければならない。\n\n(無駄枠)\n第十五条\n旅程に上限一回まで、無駄な物への支払い(以下、無駄枠という。)を予定し組み込むことができる。\n\n(イベント)\n第十六条\n支払に係るイベントとして、特権制度を次とおり規定する。特権は朝一で宣言するものとし、さらにどの規定にも優先される(特権使用者の免除券等併用は不可)。\nなお、特権を獲得出来る者は、一日目は前回優勝者、二日目以降は前日終了時点(合計)での一位の者とする。\nまた、一度獲得された特権はその時点で獲得できなくなる。\n一 免除券及びsuper免除券を他の者と重ねて使用することができる。（旅費全期間中適用）\n二 免除券又はsuper免除券を他の参加者から一枚奪うことができる。なお、所持者のみでじゃんけんを行い、負けた人から任意に奪うこととする。（一回限り）\n三 任意のじゃんけん二回（旅費及びその他のジャンケンで各一回ずつ）において、自分以外の全ての人に一機追加を付与する。（旅費全期間中適用）\n四 特定金額以下の支払は全て参加を免除される。なお、特定金額は特権発動日により変動し、一日目は四千円、二日目は六千円、三日目は八千円とする。（旅費全期間中適用）\n五 自分以外の免除券等所持者のみでじゃんけんを行わせ、負けた人にそれを強制使用させることができる。なお、super免除券も対象となるが、いずれの免除券を使用するかは、所持者本人の選択とする。（旅費全期間中適用、上限6回）\n\n第十七条\nピタリ賞及びニアピン賞を次のとおり規定する。宣言タイミングは前回四位の者が旅費総額を提示した時点とし、全支払じゃんけんが終了後の自分の支払金額との差異で判定する。ただし、順位変動は行われないものとする。\n一 ピタリ賞は、百円単位とし、支払確定額の全額が免除される。免除分は残りの参加メンバーに均等に割り振られる。\n二 ニアピン賞は、ピタリ賞±千円とし、支払確定額の半額が免除される。免除分は残りの参加メンバーに均等に割り振られる。\n\n第三編 旅行後\n(勝利特典)\n第十八条\n各回毎に、支払実績額が最も多い者には、次に掲げる特典が与えられる。\n一 次回目的地の決定権\n二 免除券、super免除券 各一枚ずつ\n三 次回旅行へ向けた打合せに係る食事代全額の免除\n\n第十九条\n三連覇(連続する三つの旅において一位)を成し遂げた場合、次回の旅に限り、全額費用負担が免除される。なお、海外も可とする。\n\n(打合せ)\n第二十条\n次回旅行前に、必ず一度以上、参加者全員で打ち合わせを行うこととする。なお、打合せの幹事は直近最下位の者が行わなければならない。\n\n第二十一条\n次回旅行の予約・手配は、最下位の者が行うこととする。";

}

/* カード：n3=+3, n10, n50, m10=-10, m1=-1, X101=101にする, PASS / TURN / SHOT / DOUBLE */
const NEU_LIMIT = 101;
function neuDeck(){
  const d = [];
  for (let v = 1; v <= 9; v++) for (let i = 0; i < 3; i++) d.push("n" + v);
  for (let i = 0; i < 6; i++) d.push("n10");
  d.push("n50", "n50");
  for (let i = 0; i < 4; i++) d.push("m10");
  d.push("m1", "m1");
  ["PASS", "TURN"].forEach(k => { for (let i = 0; i < 4; i++) d.push(k); });
  d.push("SHOT", "SHOT", "DOUBLE", "DOUBLE");
  for (let i = 0; i < 5; i++) d.push("X101");
  return d;
}
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const neuAdd = c => c[0] === "n" ? Number(c.slice(1)) : c[0] === "m" ? -Number(c.slice(1)) : null;
const NEU_INST = { PASS: "次の人へ", TURN: "逆回り", SHOT: "指名", DOUBLE: "次は2回" };
function neuCardHtml(c, extra = ""){
  const a = neuAdd(c);
  if (a !== null){
    const cls = a < 0 ? "c-min" : a >= 50 ? "c-50" : a >= 10 ? "c-10" : "c-num";
    return `<span class="ncard ${cls}" ${extra}><b>${a > 0 ? a : "−" + Math.abs(a)}</b><small>${a > 0 ? "たす" : "ひく"}</small></span>`;
  }
  if (c === "X101") return `<span class="ncard c101" ${extra}><b>101</b><small>101にする</small></span>`;
  const ic = { PASS: "→", TURN: "↺", SHOT: "◎", DOUBLE: "×2" }[c];
  return `<span class="ncard inst i-${c.toLowerCase()}" ${extra}><i>${ic}</i><b>${c}</b><small>${NEU_INST[c]}</small></span>`;
}

function neuNext(g, pid, dir){
  const n = g.players.length; let i = g.players.indexOf(pid);
  for (let k = 0; k < n; k++){ i = (i + dir + n) % n; const p = g.players[i]; if ((g.chips[p] || 0) > 0 && p !== pid) return p; }
  return pid;
}
function neuDeal(g, starter){
  let deck = shuffle(neuDeck());
  const hands = {};
  neuAlive(g).forEach(p => { hands[p] = deck.slice(0, 3); deck = deck.slice(3); });
  return { hands, deck, discard: [], total: 0, dir: 1, turn: { pid: starter, need: 1, played: 0, drawn: 0, dbl: false, shot: null, done: false } };
}

  let order = base.slice();
  const s = openSheet("NEU（ノイ）を始める", `
    <p class="note">101を超えないようにカードを出し合い、出せなくなった人がチップを失います。最後まで生き残った人の勝ち（2〜7人）。</p>
    <div class="f"><span>参加者（タップで選ぶ）</span>${chipPlayers(db.players.map(p => p.id), order)}</div>
    <div class="f"><span>席順（時計回り）・名前を指で動かして並べ替え</span><div id="nOrder" class="norder"></div><button class="mini" id="nShuf" style="margin-top:6px">席順をシャッフル</button></div>
    <label class="f"><span>最初の親（じゃんけんで決めた人）</span><select id="nDealer"></select></label>
    <div class="btns"><button class="btn" id="nGo">対戦スタート</button></div>`);
  const draw = () => {
    $("#nOrder").innerHTML = order.map((id, i) => `<span class="nseat" data-seat="${id}" style="--pc:${pcolor(id)}"><b>${i + 1}</b>${esc(pname(id))}<em class="grip">⋮⋮</em></span>`).join("<i>→</i>");
    bindSeatDrag();
    const cur = $("#nDealer").value;
    $("#nDealer").innerHTML = order.map(id => `<option value="${id}" ${id === cur ? "selected" : ""}>${esc(pname(id))}</option>`).join("");
  };
  s.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    const id = b.dataset.p, on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(on));
    order = on ? [...order, id] : order.filter(x => x !== id); draw();
  });
  $("#nShuf").onclick = () => { order = shuffle(order); draw(); };
  // 席順のドラッグ並べ替え（指で押さえて動かす）
  function bindSeatDrag(){
    $("#nOrder").querySelectorAll("[data-seat]").forEach(el => {
      el.onpointerdown = e => {
        e.preventDefault();
        const id = el.dataset.seat; el.setPointerCapture(e.pointerId); el.classList.add("drag");
        const sx = e.clientX, sy = e.clientY;
        const move = ev => {
          el.style.transform = `translate(${ev.clientX - sx}px, ${ev.clientY - sy}px) scale(1.08)`;
          el.style.pointerEvents = "none";
          const under = document.elementFromPoint(ev.clientX, ev.clientY);
          el.style.pointerEvents = "";
          const tgt = under && under.closest && under.closest("[data-seat]");
          $("#nOrder").querySelectorAll("[data-seat]").forEach(x => x.classList.toggle("over", x === tgt && x !== el));
        };
        const up = ev => {
          el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
          el.style.pointerEvents = "none";
          const under = document.elementFromPoint(ev.clientX, ev.clientY);
          el.style.pointerEvents = "";
          const tgt = under && under.closest && under.closest("[data-seat]");
          if (tgt && tgt.dataset.seat !== id){
            const from = order.indexOf(id), to = order.indexOf(tgt.dataset.seat);
            order.splice(from, 1); order.splice(to, 0, id);
            if (navigator.vibrate) navigator.vibrate(15);
          }
          draw();
        };
        el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
      };
    });
  }
  draw();
  $("#nGo").onclick = async () => {
    if (order.length < 2 || order.length > 7){ toast("参加者は2〜7人です"); return; }
    const dealer = $("#nDealer").value || order[0];
    const g0 = { players: order, chips: Object.fromEntries(order.map(id => [id, 3])) };
    const dealt = neuDeal(g0, dealer);
    const row = { trip_id: t ? t.id : null, status: "playing", ...g0, ...dealt, dealer, round: 1, created_by: me || null,
      log: [{ t: new Date().toISOString(), m: `第1回戦スタート。親は${pname(dealer)}` }] };
    const res = await q(sb.from("neu_games").insert(row).select().single(), "作成");
    if (res){ await loadTable("neu_games"); closeSheet(); openNeu(res.id); pushCall({ type: "neu_start", ids: order.filter(id => id !== me), first: dealer }); }
  };
}

/* ---------- 対戦画面 ---------- */
let neuId = null, neuSel = null;
function openNeu(id){ neuId = id; neuSel = null; $("#neu").hidden = false; document.body.style.overflow = "hidden"; drawNeu(); }
function closeNeu(){ neuId = null; $("#neu").hidden = true; document.body.style.overflow = ""; render(); }
function drawNeu(){
  if (!neuId) return;
  const g = neuById(neuId); if (!g) return closeNeu();
  const el = $("#neu"), t = g.turn || {}, mine = g.players.includes(me) ? (g.hands[me] || []) : null;
  const myTurn = g.status === "playing" && t.pid === me;
  const deckN = (g.deck || []).length, canDraw = myTurn && t.drawn < t.played && (deckN + (g.discard || []).length) > 0;
  const last = (g.discard || [])[(g.discard || []).length - 1];
  const nextP = g.status === "playing" && t.pid ? (t.shot && (g.chips[t.shot] || 0) > 0 ? t.shot : neuNext(g, t.pid, g.dir)) : null;
  // 今の人から、回る順に並べる
  const ring = []; if (g.status === "playing" && t.pid){ let p = t.pid; const n = neuAlive(g).length; for (let k = 0; k < n; k++){ ring.push(p); p = neuNext(g, p, g.dir); } }
  const orderStrip = ring.length ? `<div class="nring"><span class="nrl">${g.dir === 1 ? "↻ 時計回り" : "↺ 逆回り"}</span>${ring.map((p, k) => `<span class="nrp ${k === 0 ? "now" : k === 1 ? "nx" : ""}" style="--pc:${pcolor(p)}">${k === 0 ? "<em>今</em>" : k === 1 ? "<em>次</em>" : ""}${esc(pname(p))}</span>`).join(`<i class="nra">→</i>`)}<i class="nra">→</i><span class="nrp loop" style="--pc:${pcolor(ring[0])}">${esc(pname(ring[0]))}</span></div>${t.shot ? `<p class="note" style="margin:4px 0 0;text-align:center">SHOTで${esc(pname(t.shot))}が指名されています</p>` : ""}` : "";
  const seats = g.players.map((p, si) => {
    const c = g.chips[p] || 0, out = c <= 0, on = g.status === "playing" && t.pid === p;
    return `<div class="nseat2 ${on ? "on" : ""} ${out ? "out" : ""}" style="--pc:${pcolor(p)}">
      <span class="seatno">${si + 1}</span>${p === g.dealer ? `<em class="dealer">親</em>` : ""}${p === nextP ? `<em class="nxb">次</em>` : ""}<b>${esc(pname(p))}</b>
      <span class="nchips">${out ? "脱落" : "●".repeat(c) + `<i>${"●".repeat(Math.max(0, 3 - c))}</i>`}</span>
      <small>${out ? "" : `手札${(g.hands[p] || []).length}枚`}${on && t.need === 2 ? "・2回" : ""}</small></div>`;
  }).join("");
  let center = `<div class="ntotal ${g.total >= 90 ? "hot" : ""} ${g.total === NEU_LIMIT ? "max" : ""}"><small>合計</small><b class="num" id="ntot">${g.total}</b><small>／101</small></div>
    <div class="nmeta"><span>山札 ${deckN}枚</span>${last ? `<span class="nlast">直前：${neuCardHtml(last, 'data-mini="1"')}</span>` : ""}</div>`;
  let me2 = "";
  if (g.status === "playing"){
    const who = t.pid === me ? "あなたの番" : `${esc(pname(t.pid))}の番`;
    const req = t.need === 2 ? `（2回出す：${t.played}/2）` : "";
    me2 += `<div class="nturn ${myTurn ? "mine" : ""}" style="--pc:${pcolor(t.pid)}">${who}${req}</div>`;
    if (mine){
      me2 += `<div class="nhand">${mine.length ? mine.map((c, i) => { const ok = myTurn && neuLegal(g, c); return `<button class="nslot ${ok ? "" : "ng"}" data-play="${i}" ${ok ? "" : "disabled"}>${neuCardHtml(c)}</button>`; }).join("") : `<p class="note">手札がありません</p>`}</div>`;
      if (myTurn){
        const any = mine.some(c => neuLegal(g, c));
        me2 += `<div class="nbtns"><button class="btn ghost" id="nDraw" ${canDraw ? "" : "disabled"}>山札から引く${t.played ? `（${t.drawn}/${t.played}）` : ""}</button><button class="btn" id="nEnd" ${t.done ? "" : "disabled"}>ターン終了</button></div>
          <button class="nlose ${!any && !t.done ? "pulse" : ""}" id="nLose">負けを宣言する</button>`;
        if (!any && !t.done) me2 += `<p class="note" style="text-align:center;margin:6px 0 0">出せるカードがありません</p>`;
      }
    } else me2 += `<p class="note" style="text-align:center">観戦中です（この対戦に参加していません）</p>`;
  }
  let over = "";
  if (g.status === "round_over" || g.status === "finished"){
    const fin = g.status === "finished";
    over = `<div class="nover" style="--c:${pcolor(fin ? g.winner : g.loser)}"><div class="k">${fin ? "優勝" : `第${g.round}回戦 終了`}</div>
      <div class="p">${esc(pname(fin ? g.winner : g.loser))}</div>
      <div class="y">${fin ? "最後まで生き残った！" : `チップを1枚失った${(g.chips[g.loser] || 0) <= 0 ? "…脱落" : `（残り${g.chips[g.loser]}枚）`}`}</div>
      <div class="btns">${fin ? `<button class="btn" id="nClose2">閉じる</button>` : `<button class="btn" id="nNext">次の回戦へ</button>`}</div></div>`;
  }
  // 直近の流れ：今の人までの1周分（生き残っている人数分のターン）だけ表示
  const logs = g.log || [], lap = Math.max(1, neuAlive(g).length);
  let from = logs.length, ends = 0;
  for (let k = logs.length - 1; k >= 0; k--){
    const m = logs[k].m || "";
    if (m.includes("のターン終了")){ if (ends >= lap) break; ends++; }
    from = k;
    if (m.includes("回戦スタート")) break;
  }
  const lg = logs.slice(from).reverse().map(x => `<li>${esc(x.m)}</li>`).join("");
  el.innerHTML = `<div class="ntop"><b class="nt">NEU</b><span>第${g.round}回戦</span><button class="mini" id="nMenu">…</button><button class="mini" id="nClose">閉じる</button></div>
    <div class="nseats">${seats}</div>${orderStrip}
    <div class="ncenter">${center}</div>
    <div class="nlogw"><div class="nlogh">直近の流れ<small>1周分</small></div><ul class="nlog">${lg}</ul></div>
    <div class="nmine">${me2}</div>${over}`;
  const on = (id, fn) => { const x = el.querySelector("#" + id); if (x) x.onclick = fn; };
  on("nClose", closeNeu); on("nClose2", closeNeu); on("nMenu", () => neuMenu(g));
  on("nDraw", () => neuDraw(g)); on("nEnd", () => neuEnd(g)); on("nLose", () => neuLose(g)); on("nNext", () => neuNextRound(g));
  el.querySelectorAll("[data-play]").forEach(b => b.onclick = () => neuPlay(g, Number(b.dataset.play)));
}
function neuMenu(g){
  const s = openSheet("NEUのメニュー", `<div class="menu"><button data-x="rule">ルールを見る<span></span></button><button data-x="abort">この対戦をやめる<span></span></button></div>`);
  s.querySelector('[data-x="rule"]').onclick = () => openSheet("NEUのルール", `<div class="rules">
    <p class="rp">合計が101を超えるカードは出せません（101ちょうどまでOK）。合計はマイナスにもなります。</p>
    <p class="rp">自分の番にカードを出したら、山札から出した枚数分を引いて「ターン終了」。引き忘れると手札が減ったまま続きます。</p>
    <p class="rp">出せるカードがなくなったら「負けを宣言する」。チップを1枚失い、次の回戦の親になります。チップがなくなったら脱落、最後の1人が勝ち。</p>
    <p class="rp">PASS：次の人へ／TURN：逆回りに／SHOT：次に出す人を指名／DOUBLE：次の人は2回出す（1枚目にDOUBLEは不可。1枚目にPASS・TURN・SHOTを出すと、2回出す義務が次の人に移る）／101：合計を101にする。</p></div>`);
  s.querySelector('[data-x="abort"]').onclick = async () => {
    if (!confirm("この対戦をやめますか？（記録は残りません）")) return;
    closeSheet(); await neuSave(g, { status: "aborted" }, "対戦が中止されました"); closeNeu();
  };
}
async function neuPlay(g, i){
  const t = { ...g.turn }, c = (g.hands[me] || [])[i];
  if (!c || !neuLegal(g, c)) return;
  if (c === "SHOT"){
    const alive = neuAlive(g).filter(p => p !== me);
    const s = openSheet("SHOT：次に出す人を指名", `<div class="chips">${alive.map(p => `<button type="button" class="pc" style="--pc:${pcolor(p)}" data-shot="${p}" aria-pressed="false"><span class="dot" style="background:${pcolor(p)}"></span>${esc(pname(p))}</button>`).join("")}</div>`);
    s.querySelectorAll("[data-shot]").forEach(b => b.onclick = () => { closeSheet(); neuApply(g, i, c, b.dataset.shot); });
    return;
  }
  neuApply(g, i, c, null);
}
async function neuApply(g, i, c, shotTo){
  const t = { ...g.turn };
  const hand = (g.hands[me] || []).slice(); hand.splice(i, 1);
  let total = g.total, dir = g.dir;
  const a = neuAdd(c);
  if (a !== null) total += a; else if (c === "X101") total = NEU_LIMIT;
  if (c === "TURN") dir = -dir;
  if (c === "SHOT") t.shot = shotTo;
  if (c === "DOUBLE") t.dbl = true;
  const transfer = t.need === 2 && t.played === 0 && ["PASS", "TURN", "SHOT"].includes(c);
  t.played++;
  if (transfer){ t.dbl = true; t.done = true; }
  if (t.played >= t.need) t.done = true;
  if (["PASS", "TURN", "SHOT"].includes(c) && !transfer && t.need === 2 && t.played === 2){ /* 2枚目の指示カードは通常どおり */ }
  const label = a !== null ? (a > 0 ? `+${a}` : `${a}`) : c === "X101" ? "101" : c;
  const ok = await neuSave(g, { hands: { ...g.hands, [me]: hand }, discard: [...(g.discard || []), c], total, dir, turn: t },
    `${pname(me)}：${label}${c === "SHOT" ? `（${pname(shotTo)}を指名）` : ""} → 合計${total}${transfer ? "（2回出す義務が次の人へ）" : ""}`);
  if (ok){
    const n = $("#ntot"); if (n){ n.classList.remove("pop"); void n.offsetWidth; n.classList.add("pop"); }
    if (navigator.vibrate) navigator.vibrate(20);
  }
}
async function neuDraw(g){
  const t = { ...g.turn }; if (!(t.drawn < t.played)) return;
  let deck = (g.deck || []).slice(), discard = (g.discard || []).slice();
  if (!deck.length){ deck = shuffle(discard); discard = []; toast("山札を切り直しました"); }
  if (!deck.length) return;
  const c = deck.shift(); t.drawn++;
  await neuSave(g, { deck, discard, hands: { ...g.hands, [me]: [...(g.hands[me] || []), c] }, turn: t });
}
async function neuEnd(g){
  const t = g.turn; if (!t.done) return;
  if (t.drawn < t.played && !confirm(`まだ${t.played - t.drawn}枚引いていません。このままターンを終えますか？`)) return;
  const next = t.shot && (g.chips[t.shot] || 0) > 0 ? t.shot : neuNext(g, me, g.dir);
  if (await neuSave(g, { turn: { pid: next, need: t.dbl ? 2 : 1, played: 0, drawn: 0, dbl: false, shot: null, done: false } },
    `${pname(me)}のターン終了 → ${pname(next)}${t.dbl ? "（2回）" : ""}`)) pushCall({ type: "neu_turn", to: next, total: g.total, need: t.dbl ? 2 : 1 });
}
async function neuLose(g){
  if (!confirm("負けを宣言しますか？\nチップを1枚失い、次の回戦の親になります。")) return;
  const chips = { ...g.chips, [me]: Math.max(0, (g.chips[me] || 0) - 1) };
  const alive = g.players.filter(p => chips[p] > 0);
  const fin = alive.length <= 1;
  await neuSave(g, { chips, loser: me, status: fin ? "finished" : "round_over", winner: fin ? alive[0] || null : null },
    `${pname(me)}が負けを宣言（合計${g.total}）。チップ残り${chips[me]}${chips[me] <= 0 ? "・脱落" : ""}${fin ? `。優勝は${pname(alive[0])}！` : ""}`);
  if (fin) flash("NEU 優勝！", pname(alive[0]));
}
async function neuNextRound(g){
  const dealer = g.loser || g.dealer;
  const g2 = { ...g };
  const starter = (g.chips[dealer] || 0) > 0 ? dealer : neuNext(g2, dealer, 1);
  const dealt = neuDeal(g2, starter);
  if (await neuSave(g, { ...dealt, dealer, loser: null, status: "playing", round: g.round + 1 }, `第${g.round + 1}回戦スタート。親は${pname(dealer)}${starter !== dealer ? `（${pname(starter)}から）` : ""}`)) pushCall({ type: "neu_turn", to: starter, total: 0, need: 1, round: g.round + 1 });
}

/* ---------- 起動 ---------- */
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
$("#gearBtn").onclick = openSettings;
$("#neuIco").onclick = openGames;
async function shareLink(){
  const url = location.origin + location.pathname;
  const data = { url };  // URLだけを渡すと、共有シートの「コピー」でリンクだけが保存される
  try {
    if (navigator.share){ await navigator.share(data); return; }
    await navigator.clipboard.writeText(url); toast("リンクをコピーしました");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    try { await navigator.clipboard.writeText(url); toast("リンクをコピーしました"); } catch (_) { prompt("このリンクを共有してください", url); }
  }
}
$("#meBtn").onclick = openMe;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) return;
  try { await loadAll(); render(); syncArena(); } catch (e) { console.error(e); }
});
(async () => {
  try { await loadAll(); }
  catch (e) { $("#view").innerHTML = `<div class="empty"><b>データを読み込めませんでした</b>${esc(e.message || e)}<br>Supabaseでテーブルを作成したか確認してください。</div>`; return; }
  render(); subscribe();
  if (db.players.length && !player(me)) openMe();
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
